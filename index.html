<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Maintenance System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Segoe UI;
}

/* LAYOUT */
.app{
  display:grid;
  grid-template-columns:260px 1fr;
  grid-template-rows:70px 1fr;
  height:100vh;
}

/* TOP BAR */
.topbar{
  grid-column:1 / span 2;
  background:#2f5b89; /* น้ำเงินเข้ม */
}

/* SIDEBAR */
.sidebar{
  background:#243c5a; /* น้ำเงินเข้มด้าน */
}

/* MAIN (ขวาเทาแบบรูป) */
.main{
  background:#d1d5db; /* เทาอ่อนแบบในรูป */
}

/* ปิดทุก margin padding */
.sidebar,
.main{
  margin:0;
  padding:0;
}
</style>
</head>

<body>

<div class="app">

  <!-- TOP -->
  <div class="topbar"></div>

  <!-- LEFT -->
  <div class="sidebar"></div>

  <!-- RIGHT -->
  <div class="main"></div>

</div>

</body>
</html>
