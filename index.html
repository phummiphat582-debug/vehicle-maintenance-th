<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Smart Maintenance Dashboard</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  display:flex;
  background:#e9eafc;
}

/* sidebar */
.sidebar{
  width:80px;
  background:linear-gradient(#8b5cf6,#6366f1);
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:20px;
}

.sidebar div{
  margin:20px 0;
  font-size:20px;
  color:#fff;
  cursor:pointer;
}

/* main */
.main{
  flex:1;
  padding:20px;
}

/* top */
.top{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}

/* grid */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

/* card */
.card{
  background:#fff;
  border-radius:20px;
  padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
}

/* big card */
.big{
  grid-column:span 2;
}

/* title */
.title{
  font-weight:bold;
  margin-bottom:10px;
}

/* value */
.value{
  font-size:26px;
  font-weight:bold;
}

/* chip */
.chip{
  margin-top:10px;
  background:#eef2ff;
  padding:5px 10px;
  border-radius:10px;
  font-size:12px;
}

/* vehicle */
.vehicle{
  background:#ddd;
  padding:8px 12px;
  border-radius:10px;
  cursor:pointer;
}

.vehicle.active{
  background:#6366f1;
  color:#fff;
}

/* search */
input{
  padding:10px;
  border-radius:10px;
  border:none;
}
</style>
</head>

<body>

<!-- sidebar -->
<div class="sidebar">
  <div>🏠</div>
  <div>🚗</div>
  <div>📊</div>
  <div>⚙️</div>
</div>

<!-- main -->
<div class="main">

<div class="top">
  <h2>Dashboard</h2>
  <input id="search" placeholder="ค้นหา...">
</div>

<!-- vehicles -->
<div style="display:flex; gap:10px; margin-bottom:20px;" id="vehicleList"></div>

<!-- grid -->
<div class="grid">

<div class="card big">
  <div class="title">💰 ค่าใช้จ่ายรวม</div>
  <div class="value" id="totalCost">0 บาท</div>
</div>

<div class="card">
  <div class="title">🔧 จำนวนงานซ่อม</div>
  <div class="value" id="totalJobs">0</div>
</div>

<div class="card">
  <div class="title">📅 วันนี้</div>
  <div class="value" id="todayJobs">0</div>
</div>

<div class="card">
  <div class="title">📊 เดือนนี้</div>
  <div class="value" id="monthCost">0</div>
</div>

<div class="card big">
  <div class="title">📋 รายการซ่อม</div>
  <div id="log"></div>
</div>

</div>

</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain: "vehicle-maintenance-64890.firebaseapp.com",
  projectId: "vehicle-maintenance-64890",
});

const db = firebase.firestore();

let selectedVehicle=null;
let all=[];

/* โหลดรถ */
db.collection("vehicles").onSnapshot(s=>{
  vehicleList.innerHTML="";
  let first=null;

  s.forEach(d=>{
    if(!first) first=d.id;

    let div=document.createElement("div");
    div.className="vehicle";
    div.innerText=d.id;

    div.onclick=()=>{
      document.querySelectorAll(".vehicle")
        .forEach(v=>v.classList.remove("active"));

      div.classList.add("active");
      selectedVehicle=d.id;
      load(d.id);
    };

    vehicleList.appendChild(div);
  });

  if(first) vehicleList.children[0].click();
});

/* โหลดข้อมูล */
function load(v){
  db.collection("vehicles").doc(v).collection("repairs")
  .onSnapshot(s=>{
    all=[];
    let total=0;
    let today=0;
    let month=0;

    let now=new Date();
    let todayStr=now.toISOString().split("T")[0];
    let monthStr=todayStr.slice(0,7);

    s.forEach(doc=>{
      let r=doc.data();
      let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);

      total+=cost;

      if(r["วันที่"]===todayStr) today++;
      if((r["วันที่"]||"").startsWith(monthStr)) month+=cost;

      all.push(r);
    });

    totalCost.innerText=total.toLocaleString()+" บาท";
    totalJobs.innerText=all.length;
    todayJobs.innerText=today;
    monthCost.innerText=month.toLocaleString();

    render(all);
  });
}

/* render */
function render(list){
  log.innerHTML="";

  list.forEach(r=>{
    let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);

    log.innerHTML+=`
    <div class="chip">
      🔧 ${r["ระบบที่ซ่อม"]||"-"} | 💰 ${cost} บาท
    </div>`;
  });
}

/* search */
search.oninput=()=>{
  let q=search.value.toLowerCase();
  render(all.filter(r=>
    (r["ระบบที่ซ่อม"]||"").toLowerCase().includes(q)
  ));
};
</script>

</body>
</html>
