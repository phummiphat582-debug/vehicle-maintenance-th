<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>SC THE ADVENTURE | LR Maintenance</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg:#0f172a;
  --panel:#1e293b;
  --card:#334155;
  --text:#e2e8f0;
  --sub:#94a3b8;
  --accent:#3b82f6;
  --danger:#ef4444;
}

body{
  margin:0;
  font-family:Segoe UI;
  background:var(--bg);
  color:var(--text);
  display:flex;
  height:100vh;
}

/* sidebar */
.sidebar{
  width:260px;
  background:#020617;
  padding:20px;
  border-right:1px solid #1e293b;
}

.sidebar h2{
  margin-bottom:16px;
}

.vehicle{
  padding:12px;
  border-radius:10px;
  cursor:pointer;
  margin-bottom:8px;
  color:var(--sub);
}

.vehicle.active{
  background:var(--accent);
  color:#fff;
}

/* main */
.main{
  flex:1;
  padding:24px;
  overflow:auto;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.search{
  width:300px;
  padding:10px;
  border-radius:10px;
  border:none;
}

/* card */
.repair-card{
  background:var(--panel);
  padding:18px;
  border-radius:16px;
  margin-bottom:14px;
}

.repair-card:hover{
  background:var(--card);
}

.cost{
  color:#22c55e;
}

/* FAB */
.fab{
  position:fixed;
  bottom:30px;
  right:30px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:var(--accent);
  color:#fff;
  font-size:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

/* modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-box{
  background:#1e293b;
  padding:30px;
  border-radius:20px;
  width:500px;
}

input,textarea{
  width:100%;
  margin-bottom:10px;
  padding:10px;
  border-radius:10px;
  border:none;
}

button{
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.btn{
  background:var(--accent);
  color:#fff;
}

.btn-danger{
  background:var(--danger);
  color:#fff;
}
</style>
</head>

<body>

<div class="sidebar">
  <h2>🚗 รถทั้งหมด</h2>
  <div id="vehicleList"></div>
</div>

<div class="main">
  <div class="header">
    <h2 id="title">เลือกรถ</h2>
    <input id="search" class="search" placeholder="ค้นหา...">
  </div>

  <div id="repairList"></div>
</div>

<div class="fab" onclick="openModal()">+</div>

<!-- modal -->
<div class="modal" id="modal">
<div class="modal-box">
<h3>เพิ่มรายการซ่อม</h3>

<input type="date" id="date">
<input placeholder="ระบบที่ซ่อม" id="system">
<textarea placeholder="อาการเสีย" id="symptoms"></textarea>
<input type="number" placeholder="ค่าอะไหล่" id="partsCost">
<input type="number" placeholder="ค่าแรง" id="laborCost">

<button class="btn" onclick="save()">บันทึก</button>
<button class="btn-danger" onclick="closeModal()">ยกเลิก</button>

</div>
</div>

<script>
firebase.initializeApp({
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT"
});

const db = firebase.firestore();

const vehicleList = document.getElementById("vehicleList");
const repairList = document.getElementById("repairList");
const title = document.getElementById("title");

let selectedVehicle = null;
let allData = [];

/* โหลดรถ */
function loadVehicles(){
  db.collection("vehicles").onSnapshot(s=>{
    vehicleList.innerHTML="";
    s.forEach(d=>{
      const div=document.createElement("div");
      div.className="vehicle";
      div.textContent=d.id;

      div.onclick=()=>{
        document.querySelectorAll(".vehicle")
          .forEach(v=>v.classList.remove("active"));

        div.classList.add("active");
        selectedVehicle=d.id;
        title.textContent=d.id;

        loadRepairs(d.id);
      };

      vehicleList.appendChild(div);
    });
  });
}

/* โหลดรายการ */
function loadRepairs(v){
  db.collection("vehicles").doc(v).collection("repairs")
  .onSnapshot(s=>{
    allData=[];
    s.forEach(doc=>{
      const r=doc.data();
      r._id=doc.id;
      allData.push(r);
    });

    allData.sort((a,b)=>
      new Date(b["วันที่"]) - new Date(a["วันที่"])
    );

    render(allData);
  });
}

/* render */
function render(list){
  repairList.innerHTML="";

  list.forEach(r=>{
    const cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);

    repairList.innerHTML+=`
    <div class="repair-card">
      <b>${r["วันที่"]||"-"}</b><br>
      ${r["ระบบที่ซ่อม"]||"-"}<br>
      <small>${r["อาการเสีย"]||"-"}</small><br>
      <div class="cost">💰 ${cost.toLocaleString()} บาท</div>
      <button class="btn-danger" onclick="del('${r._id}')">ลบ</button>
    </div>`;
  });
}

/* save */
function save(){
  if(!selectedVehicle) return alert("เลือกคันก่อน");

  db.collection("vehicles")
    .doc(selectedVehicle)
    .collection("repairs")
    .add({
      "วันที่":date.value,
      "ระบบที่ซ่อม":system.value,
      "อาการเสีย":symptoms.value,
      "ค่าอะไหล่":partsCost.value,
      "ค่าแรง":laborCost.value,
      "เวลาบันทึก":new Date()
    })
    .then(()=>{
      closeModal();
      clearForm();
    });
}

/* delete */
function del(id){
  db.collection("vehicles")
    .doc(selectedVehicle)
    .collection("repairs")
    .doc(id)
    .delete();
}

/* search */
search.oninput=()=>{
  const q=search.value.toLowerCase();

  const res=allData.filter(r=>
    (r["ระบบที่ซ่อม"]||"").toLowerCase().includes(q) ||
    (r["อาการเสีย"]||"").toLowerCase().includes(q)
  );

  render(res);
};

/* modal */
function openModal(){modal.style.display="flex"}
function closeModal(){modal.style.display="none"}

function clearForm(){
  document.querySelectorAll("#modal input, #modal textarea")
  .forEach(e=>e.value="");
}

loadVehicles();
</script>

</body>
</html>
