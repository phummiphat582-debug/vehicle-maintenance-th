<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>SC Maintenance Stable</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{margin:0;font-family:Inter;background:#f8fafc}

/* header */
header{
  padding:18px;
  background:#111827;
  color:#fff;
}

/* container */
.container{
  padding:20px;
  max-width:1200px;
  margin:auto;
}

/* card */
.card{
  background:#fff;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
  border:1px solid #e5e7eb;
}

/* item */
.item{
  padding:12px;
  border-bottom:1px solid #eee;
  display:flex;
  justify-content:space-between;
}

/* input */
input,select{
  padding:10px;
  border-radius:8px;
  border:1px solid #ddd;
  width:100%;
}

/* grid */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:10px;
}

/* button */
button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:#4f46e5;
  color:#fff;
  cursor:pointer;
}
</style>
</head>

<body>

<header>SC MAINTENANCE SYSTEM</header>

<div class="container">

<div class="card grid">
  <select id="vehicleSelect"></select>
  <button onclick="openModal()">Add</button>
  <input id="searchInput" placeholder="Search">
</div>

<div class="card">
  <div id="list"></div>
</div>

</div>

<!-- MODAL -->
<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;">
<div style="background:#fff;padding:20px;width:400px;border-radius:10px">

<input type="date" id="date">
<input id="system" placeholder="System">
<input id="technician" placeholder="Technician">
<input id="partsCost" placeholder="Parts Cost">
<input id="laborCost" placeholder="Labor Cost">

<button onclick="save()">Save</button>
<button onclick="closeModal()">Cancel</button>

</div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain:"vehicle-maintenance-64890.firebaseapp.com",
  projectId:"vehicle-maintenance-64890"
});

const db=firebase.firestore();

const vehicleSelect=document.getElementById("vehicleSelect");
const listEl=document.getElementById("list");
const searchInput=document.getElementById("searchInput");

let allRepairs=[];

/* โหลดรถ */
db.collection("vehicles").onSnapshot(s=>{
  vehicleSelect.innerHTML="";
  s.forEach(d=>{
    vehicleSelect.innerHTML+=`<option>${d.id}</option>`;
  });
  load(vehicleSelect.value);
});

vehicleSelect.onchange=()=>load(vehicleSelect.value);

/* โหลดข้อมูล */
function load(v){
  db.collection("vehicles").doc(v).collection("repairs")
  .onSnapshot(s=>{
    allRepairs=[];
    s.forEach(doc=>{
      let r=doc.data();
      r._id=doc.id;
      allRepairs.push(r);
    });
    render(allRepairs);
  });
}

/* render */
function render(data){
  listEl.innerHTML="";

  data.sort((a,b)=>new Date(b["วันที่"]) - new Date(a["วันที่"]));

  data.forEach(r=>{
    let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);

    listEl.innerHTML+=`
    <div class="item">
      <div>
        <b>${r["ระบบที่ซ่อม"]||"-"}</b><br>
        ${r["วันที่"]||"-"} | ${r["ช่างผู้รับผิดชอบ"]||"-"}
      </div>
      <div>${cost.toLocaleString()}</div>
    </div>`;
  });
}

/* search */
searchInput.oninput=()=>{
  let q=searchInput.value.toLowerCase();
  render(allRepairs.filter(r=>
    (r["ระบบที่ซ่อม"]||"").toLowerCase().includes(q)
  ));
};

/* save */
function save(){
  let v=vehicleSelect.value;

  db.collection("vehicles").doc(v)
  .collection("repairs")
  .add({
    "วันที่":date.value,
    "ระบบที่ซ่อม":system.value,
    "ช่างผู้รับผิดชอบ":technician.value,
    "ค่าอะไหล่":partsCost.value,
    "ค่าแรง":laborCost.value
  });

  closeModal();
}

function openModal(){modal.style.display="flex";}
function closeModal(){modal.style.display="none";}
</script>

</body>
</html>
