<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>SC Maintenance Premium</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg:#eef2f7;
  --card:#f8fafc;
  --shadow1:#ffffff;
  --shadow2:#c9d1d9;
  --primary:#4db6c6;
}

body{
  margin:0;
  font-family:'JetBrains Mono', monospace;
  background:var(--bg);
}

/* header */
.header{
  background:linear-gradient(135deg,#4db6c6,#3aa4b4);
  color:#fff;
  padding:18px;
  font-size:18px;
  box-shadow:0 10px 25px rgba(0,0,0,.15);
}

/* layout */
.app{
  display:flex;
  height:calc(100vh - 60px);
}

/* sidebar */
.sidebar{
  width:240px;
  padding:20px;
}

/* button */
.btn{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border-radius:14px;
  border:none;
  cursor:pointer;
  background:var(--card);
  box-shadow:
    6px 6px 12px var(--shadow2),
    -6px -6px 12px var(--shadow1);
  transition:.2s;
}
.btn:active{
  transform:scale(.95);
  box-shadow:inset 4px 4px 10px var(--shadow2),
             inset -4px -4px 10px var(--shadow1);
}

/* center */
.center{
  flex:1;
  padding:25px;
  overflow:auto;
}

/* title */
.title{
  font-size:20px;
  margin-bottom:20px;
}

/* card item */
.item{
  background:var(--card);
  padding:18px;
  border-radius:16px;
  margin-bottom:15px;

  box-shadow:
    8px 8px 18px var(--shadow2),
    -8px -8px 18px var(--shadow1);

  transition:.2s;
}
.item:hover{
  transform:translateY(-3px);
}

/* popup */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.3);
  backdrop-filter:blur(6px);
  display:none;
  align-items:center;
  justify-content:center;
}

.popup-box{
  background:var(--card);
  padding:25px;
  border-radius:20px;
  width:300px;

  box-shadow:
    10px 10px 30px rgba(0,0,0,.2),
    -10px -10px 20px rgba(255,255,255,.6);

  animation:pop .25s ease;
}

@keyframes pop{
  from{transform:scale(.85);opacity:0}
  to{transform:scale(1);opacity:1}
}

/* vehicle */
.vehicle{
  padding:12px;
  border-radius:10px;
  cursor:pointer;
  margin-bottom:8px;
  transition:.2s;
}
.vehicle:hover{
  background:#e0f2f1;
}

/* modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.3);
  backdrop-filter:blur(6px);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-box{
  background:var(--card);
  padding:25px;
  border-radius:20px;
  width:350px;

  box-shadow:
    10px 10px 30px rgba(0,0,0,.2),
    -10px -10px 20px rgba(255,255,255,.6);

  animation:pop .25s;
}

input,textarea{
  width:100%;
  margin-bottom:10px;
  padding:10px;
  border-radius:10px;
  border:none;
  box-shadow:inset 3px 3px 6px var(--shadow2),
             inset -3px -3px 6px var(--shadow1);
}
</style>
</head>

<body>

<div class="header">🚗 SC Maintenance Premium</div>

<div class="app">

<div class="sidebar">
  <button class="btn" onclick="openVehiclePopup()">🚗 เลือกรถ</button>
  <button class="btn" onclick="openModal()">➕ เพิ่มรายการ</button>
</div>

<div class="center">
  <div class="title" id="currentVehicle">ยังไม่ได้เลือกรถ</div>
  <div id="repairList"></div>
</div>

</div>

<!-- popup -->
<div class="popup" id="vehiclePopup">
  <div class="popup-box" id="vehicleList"></div>
</div>

<!-- modal -->
<div class="modal" id="modal">
<div class="modal-box">

<h3>เพิ่มรายการ</h3>

<input type="date" id="date">
<input id="system" placeholder="ระบบ">
<textarea id="symptoms" placeholder="อาการ"></textarea>
<input id="technician" placeholder="ช่าง">
<input id="partsCost" placeholder="ค่าอะไหล่">
<input id="laborCost" placeholder="ค่าแรง">

<button class="btn" onclick="save()">บันทึก</button>

</div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain:"vehicle-maintenance-64890.firebaseapp.com",
  projectId:"vehicle-maintenance-64890"
});

const db=firebase.firestore();
let selectedVehicle=null;

/* load vehicles */
db.collection("vehicles").onSnapshot(s=>{
  vehicleList.innerHTML="";
  s.forEach(d=>{
    vehicleList.innerHTML+=`
    <div class="vehicle" onclick="selectVehicle('${d.id}')">
      🚗 ${d.id}
    </div>`;
  });
});

function openVehiclePopup(){
  vehiclePopup.style.display="flex";
}

function selectVehicle(v){
  selectedVehicle=v;
  currentVehicle.innerText=v;
  vehiclePopup.style.display="none";
  load(v);
}

/* load repairs */
function load(v){
  db.collection("vehicles").doc(v).collection("repairs")
  .onSnapshot(s=>{
    let list=[];
    s.forEach(doc=>list.push(doc.data()));

    list.sort((a,b)=>new Date(b["วันที่"])-new Date(a["วันที่"]));

    repairList.innerHTML="";
    list.forEach(r=>{
      let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);

      repairList.innerHTML+=`
      <div class="item">
        📅 ${r["วันที่"]}<br>
        🔧 ${r["ระบบที่ซ่อม"]}<br>
        💰 ${cost.toLocaleString()} บาท
      </div>`;
    });
  });
}

/* save */
function save(){
  if(!selectedVehicle) return alert("เลือกคันก่อน");

  db.collection("vehicles").doc(selectedVehicle)
    .collection("repairs")
    .add({
      "วันที่":date.value,
      "ระบบที่ซ่อม":system.value,
      "อาการเสีย":symptoms.value,
      "ช่างผู้รับผิดชอบ":technician.value,
      "ค่าอะไหล่":partsCost.value,
      "ค่าแรง":laborCost.value
    });

  modal.style.display="none";
}

/* modal */
function openModal(){modal.style.display="flex";}
</script>

</body>
</html>
