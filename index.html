<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>SC MAINTENANCE SYSTEM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#0b0f14;
  --sidebar:#0f141a;
  --topbar:#111827;
  --card:#161b22;
  --text:#e6edf3;
  --sub:#8b9bb0;
  --border:#1e293b;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Segoe UI;
  background:var(--bg);
  color:var(--text);
}

/* LAYOUT */
.app{
  display:grid;
  grid-template-columns:260px 1fr;
  grid-template-rows:70px 1fr;
  height:100vh;
}

/* TOPBAR */
.topbar{
  grid-column:1 / span 2;
  background:var(--topbar);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 25px;
  font-size:18px;
  font-weight:600;
}

/* SIDEBAR */
.sidebar{
  background:var(--sidebar);
  border-right:1px solid var(--border);
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

/* MAIN */
.main{
  padding:25px;
  overflow:auto;
}

/* CARD */
.card{
  background:var(--card);
  border-radius:14px;
  border:1px solid var(--border);
  padding:20px;
}

/* INPUT */
input,select,textarea{
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#020617;
  color:#fff;
  width:100%;
}

/* BUTTON */
button{
  padding:12px;
  border:none;
  border-radius:10px;
  background:#1f2937;
  color:#fff;
  cursor:pointer;
}
button:hover{
  background:#374151;
}
button.danger{
  background:#dc2626;
}

/* TABLE */
.table{
  width:100%;
  border-collapse:collapse;
}

th{
  text-align:left;
  padding:14px;
  background:#020617;
  color:#8b9bb0;
}

td{
  padding:14px;
  border-top:1px solid var(--border);
}

tr:hover{
  background:rgba(255,255,255,.05);
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-box{
  width:95%;
  max-width:900px;
  background:#020617;
  padding:25px;
  border-radius:14px;
  border:1px solid var(--border);
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  margin:15px 0;
}

.detail-row{
  display:grid;
  grid-template-columns:200px 1fr;
  border-bottom:1px dashed var(--border);
  padding:8px 0;
}
</style>
</head>

<body>

<div class="app">

<!-- TOPBAR -->
<div class="topbar">
  ระบบซ่อมบำรุงรถยนต์
</div>

<!-- SIDEBAR -->
<aside class="sidebar">
  <button onclick="openModal()">+ เพิ่มรายการ</button>
  <select id="vehicleSelect"></select>
  <button onclick="loadRepairs(vehicleSelect.value)">โหลดข้อมูล</button>
  <button class="danger" onclick="confirmDeleteAll()">ลบทั้งหมด</button>
</aside>

<!-- MAIN -->
<main class="main">

  <div class="card">
    <input id="searchInput" placeholder="ค้นหา...">
  </div>

  <br>

  <div class="card">
    <table class="table">
      <thead>
        <tr>
          <th>วันที่</th>
          <th>รถ</th>
          <th>ระบบ</th>
          <th>อาการ</th>
          <th>ช่าง</th>
          <th>ค่าใช้จ่าย</th>
          <th>ดู</th>
          <th>ลบ</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</main>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-box">
<h2>บันทึกการซ่อม</h2>

<div class="form-grid">
<input type="date" id="date">
<input id="mileage" placeholder="เลขไมล์">
<input id="jobNo" placeholder="เลขที่ใบงาน">
<input id="system" placeholder="ระบบที่ซ่อม">
<input id="technician" placeholder="ช่าง">
<input id="approver" placeholder="ผู้อนุมัติ">
<textarea id="symptoms" placeholder="อาการ"></textarea>
<textarea id="parts" placeholder="อะไหล่"></textarea>
<textarea id="note" placeholder="หมายเหตุ"></textarea>
<input type="number" id="partsCost" placeholder="ค่าอะไหล่">
<input type="number" id="laborCost" placeholder="ค่าแรง">
</div>

<button onclick="save()">บันทึก</button>
<button class="danger" onclick="closeModal()">ยกเลิก</button>

</div>
</div>

<!-- DETAIL -->
<div class="modal" id="detailModal">
<div class="modal-box">
<h2>รายละเอียด</h2>
<div id="detailContent"></div>
<button class="danger" onclick="detailModal.style.display='none'">ปิด</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain: "vehicle-maintenance-64890.firebaseapp.com",
  projectId: "vehicle-maintenance-64890",
});
const db = firebase.firestore();

const modal = document.getElementById("modal");
const detailModal = document.getElementById("detailModal");

const vehicleSelect = document.getElementById("vehicleSelect");
const tbody = document.getElementById("tbody");
const searchInput = document.getElementById("searchInput");

let allRepairs=[];

function openModal(){
  modal.style.display="flex";
  date.value = new Date().toISOString().split("T")[0];
}
function closeModal(){modal.style.display="none"}

function loadVehicles(){
  db.collection("vehicles").onSnapshot(s=>{
    vehicleSelect.innerHTML="";
    s.forEach(d=>{
      const o=document.createElement("option");
      o.value=d.id;
      o.textContent=d.id;
      vehicleSelect.appendChild(o);
    });
    if(vehicleSelect.value) loadRepairs(vehicleSelect.value);
  });
}
vehicleSelect.onchange=()=>loadRepairs(vehicleSelect.value);

function loadRepairs(v){
  db.collection("vehicles").doc(v).collection("repairs")
  .onSnapshot(s=>{
    allRepairs=[];
    s.forEach(doc=>{
      let r=doc.data();
      r._id=doc.id;
      allRepairs.push(r);
    });

    // เรียงวันที่ล่าสุดก่อน
    allRepairs.sort((a,b)=>{
      return new Date(b["วันที่"]) - new Date(a["วันที่"]);
    });

    renderTable(allRepairs,v);
  });
}

function renderTable(list,v){
  tbody.innerHTML="";
  list.forEach(r=>{
    const cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);
    tbody.innerHTML+=`
<tr>
<td>${r["วันที่"]||""}</td>
<td>${v}</td>
<td>${r["ระบบที่ซ่อม"]||""}</td>
<td>${r["อาการเสีย"]||""}</td>
<td>${r["ช่างผู้รับผิดชอบ"]||""}</td>
<td>${cost}</td>
<td><button onclick='openDetail(${JSON.stringify(r).replace(/'/g,"&#39;")})'>ดู</button></td>
<td><button class="danger" onclick="deleteItem('${v}','${r._id}')">ลบ</button></td>
</tr>`;
  });
}

function save(){
  const key = vehicleSelect.value;
  if(!key){ alert("เลือกรถก่อน"); return; }

  db.collection("vehicles").doc(key).collection("repairs").add({
    "วันที่":date.value,
    "เลขไมล์":mileage.value,
    "เลขที่ใบงาน":jobNo.value,
    "ระบบที่ซ่อม":system.value,
    "อาการเสีย":symptoms.value,
    "อะไหล่ที่เปลี่ยน":parts.value,
    "ช่างผู้รับผิดชอบ":technician.value,
    "ผู้อนุมัติ":approver.value,
    "หมายเหตุ":note.value,
    "ค่าอะไหล่":partsCost.value,
    "ค่าแรง":laborCost.value
  }).then(closeModal);
}

function deleteItem(v,id){
  db.collection("vehicles").doc(v).collection("repairs").doc(id).delete();
}

async function confirmDeleteAll(){
  const v=vehicleSelect.value;
  const ref=db.collection("vehicles").doc(v);
  const snap=await ref.collection("repairs").get();
  const batch=db.batch();
  snap.forEach(d=>batch.delete(d.ref));
  await batch.commit();
  await ref.delete();
}

function openDetail(d){
  let html="";
  for(let k in d){
    if(k==="_id") continue;
    html+=`<div class="detail-row"><b>${k}</b><div>${d[k]||"-"}</div></div>`;
  }
  detailContent.innerHTML=html;
  detailModal.style.display="flex";
}

loadVehicles();
</script>

</body>
</html>
