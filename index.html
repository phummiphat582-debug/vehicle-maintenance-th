<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>SC Maintenance Terminal</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg:#020617;
  --card:#020617;
  --line:#0f172a;
  --text:#d1fae5;
  --accent:#22c55e;
}

body{
  margin:0;
  font-family:'JetBrains Mono', monospace;
  background:var(--bg);
  color:var(--text);
}

/* header */
.header{
  padding:15px;
  border-bottom:1px solid var(--line);
}

/* container */
.container{
  padding:20px;
  max-width:1300px;
  margin:auto;
}

/* panel */
.panel{
  border:1px solid var(--line);
  padding:15px;
  margin-bottom:15px;
}

/* input */
input,select,textarea{
  width:100%;
  padding:8px;
  margin-bottom:8px;
  background:#000;
  border:1px solid var(--line);
  color:var(--text);
}

/* button */
button{
  background:#000;
  color:var(--accent);
  border:1px solid var(--accent);
  padding:8px 12px;
  cursor:pointer;
}
button:hover{
  background:var(--accent);
  color:#000;
}

/* log */
.item{
  padding:10px;
  border-bottom:1px solid var(--line);
  transition:.2s;
}
.item:hover{
  background:#021f1f;
}

/* modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal-box{
  background:#000;
  border:1px solid var(--accent);
  padding:20px;
  width:400px;
  animation:pop .2s;
}
@keyframes pop{
  from{transform:scale(.9);opacity:0}
  to{transform:scale(1);opacity:1}
}
</style>
</head>

<body>

<div class="header">
SYSTEM: SC_MAINTENANCE_TERMINAL
</div>

<div class="container">

<!-- control -->
<div class="panel">
<select id="vehicleSelect"></select>
<button onclick="openModal()">ADD RECORD</button>
<input id="search" placeholder="SEARCH">
</div>

<!-- list -->
<div class="panel" id="list"></div>

</div>

<!-- modal -->
<div class="modal" id="modal">
<div class="modal-box">

<h3>CREATE RECORD</h3>

<input type="date" id="date">
<input id="mileage" placeholder="Mileage">
<input id="jobNo" placeholder="Job No">
<input id="system" placeholder="System">
<textarea id="symptoms" placeholder="Symptoms"></textarea>
<textarea id="parts" placeholder="Parts"></textarea>
<input id="technician" placeholder="Technician">
<input id="approver" placeholder="Approver">
<textarea id="note" placeholder="Note"></textarea>
<input id="partsCost" placeholder="Parts Cost">
<input id="laborCost" placeholder="Labor Cost">

<button onclick="confirmSave()">EXECUTE</button>
<button onclick="closeModal()">CANCEL</button>

</div>
</div>

<!-- confirm -->
<div class="modal" id="confirm">
<div class="modal-box">
CONFIRM EXECUTION<br><br>
<button onclick="save()">CONFIRM</button>
<button onclick="confirm.style.display='none'">CANCEL</button>
</div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain:"vehicle-maintenance-64890.firebaseapp.com",
  projectId:"vehicle-maintenance-64890"
});

const db=firebase.firestore();

const vehicleSelect=document.getElementById("vehicleSelect");
const listEl=document.getElementById("list");
const search=document.getElementById("search");

let all=[];

/* load vehicles */
db.collection("vehicles").onSnapshot(s=>{
  vehicleSelect.innerHTML="";
  s.forEach(d=>{
    vehicleSelect.innerHTML+=`<option>${d.id}</option>`;
  });
  load(vehicleSelect.value);
});

vehicleSelect.onchange=()=>load(vehicleSelect.value);

/* load all repairs */
function load(v){
  db.collection("vehicles").doc(v).collection("repairs")
  .onSnapshot(s=>{
    all=[];
    s.forEach(doc=>{
      let r=doc.data();
      r._id=doc.id;
      all.push(r);
    });
    render(all);
  });
}

/* render */
function render(data){
  listEl.innerHTML="";

  data.sort((a,b)=>new Date(b["วันที่"]) - new Date(a["วันที่"]));

  data.forEach(r=>{
    let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);

    listEl.innerHTML+=`
    <div class="item">
      [${r["วันที่"]||"-"}] 
      ${r["ระบบที่ซ่อม"]||"-"} 
      | ${r["อาการเสีย"]||"-"} 
      | ${cost}
    </div>`;
  });
}

/* search */
search.oninput=()=>{
  let q=search.value.toLowerCase();
  render(all.filter(r=>
    (r["ระบบที่ซ่อม"]||"").toLowerCase().includes(q) ||
    (r["อาการเสีย"]||"").toLowerCase().includes(q)
  ));
};

/* modal */
function openModal(){modal.style.display="flex";}
function closeModal(){modal.style.display="none";}

/* confirm */
function confirmSave(){confirm.style.display="flex";}

/* save */
function save(){
  let v=vehicleSelect.value;

  db.collection("vehicles").doc(v)
  .collection("repairs")
  .add({
    "วันที่":date.value,
    "เลขไมล์":mileage.value,
    "เลขที่ใบงาน":jobNo.value,
    "ระบบที่ซ่อม":system.value,
    "อาการเสีย":symptoms.value,
    "อะไหล่ที่เปลี่ยน":parts.value,
    "ช่างผู้รับผิดชอบ":technician.value,
    "ผู้อนุมัติ":approver.value,
    "หมายเหตุ":note.value,
    "ค่าอะไหล่":partsCost.value,
    "ค่าแรง":laborCost.value
  });

  closeModal();
  confirm.style.display="none";
}
</script>

</body>
</html>
