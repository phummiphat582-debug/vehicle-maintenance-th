<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ระบบซ่อมบำรุง</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --red:#b91c1c;
  --dark:#7f1d1d;
  --bg:#f4f6f8;
}

body{
  margin:0;
  font-family:Segoe UI,Arial;
  background:var(--bg);
}

header{
  background:linear-gradient(90deg,var(--dark),var(--red));
  color:#fff;
  padding:18px 30px;
  font-size:20px;
  font-weight:600;
}

.container{
  max-width:1600px;
  margin:auto;
  padding:25px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.06);
}

/* Grid */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
}

/* Inputs */
input,textarea,select{
  width:100%;
  padding:10px;
  border:1px solid #ddd;
  border-radius:8px;
}

/* Buttons */
button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:var(--red);
  color:#fff;
  cursor:pointer;
}
button:hover{opacity:.9}
.danger{background:#dc2626}

/* TABLE PRO */
table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
}

thead th{
  position:sticky;
  top:0;
  background:#fff;
  z-index:2;
  cursor:pointer;
}

th,td{
  padding:12px;
  border-bottom:1px solid #eee;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

tbody tr:hover{
  background:#fef2f2;
}

/* column size */
th:nth-child(1){width:120px;}
th:nth-child(2){width:200px;}
th:nth-child(3){width:180px;}
th:nth-child(4){width:220px;}
th:nth-child(5){width:150px;}
th:nth-child(6){width:120px;}
th:nth-child(7){width:120px;}
th:nth-child(8){width:80px;}

/* Modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-box{
  background:#fff;
  padding:25px;
  border-radius:12px;
  width:95%;
  max-width:1200px;
  max-height:90vh;
  overflow:auto;
}

/* Form */
.form-section{margin-top:15px}
.form-title{
  font-weight:600;
  margin-bottom:10px;
  color:var(--dark);
}
.form-grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}
.form-grid-3{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:15px;
}
textarea{min-height:100px}

/* Detail */
.detail-row{
  display:grid;
  grid-template-columns:200px 1fr;
  padding:8px 0;
  border-bottom:1px dashed #ddd;
}
.detail-row b{color:var(--red)}
</style>
</head>

<body>

<header>ระบบซ่อมบำรุง</header>

<div class="container">

<div class="card grid">
<select id="vehicleSelect"></select>
<button onclick="openModal()">เพิ่มรายการ</button>
<button class="danger" onclick="deleteAll()">ลบทั้งหมด</button>
</div>

<div class="card grid">
<input id="searchInput" placeholder="ค้นหา">
<button onclick="resetSearch()">ล้าง</button>
</div>

<div class="card">
<table>
<thead>
<tr>
<th onclick="setSort('วันที่')">วันที่</th>
<th>รถ</th>
<th onclick="setSort('ระบบที่ซ่อม')">ระบบ</th>
<th onclick="setSort('อาการเสีย')">อาการ</th>
<th onclick="setSort('ช่างผู้รับผิดชอบ')">ช่าง</th>
<th>ค่าใช้จ่าย</th>
<th>รายละเอียด</th>
<th>ลบ</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<div class="card" style="display:flex;justify-content:space-between;">
<div id="pageInfo"></div>
<div>
<button onclick="prevPage()">ก่อนหน้า</button>
<button onclick="nextPage()">ถัดไป</button>
</div>
</div>

</div>

<!-- modal เพิ่ม -->
<div class="modal" id="modal">
<div class="modal-box">

<h3>เพิ่มประวัติการซ่อม</h3>

<div class="form-section">
<div class="form-title">ข้อมูลหลัก</div>
<div class="form-grid-3">
<input type="date" id="date">
<input id="mileage" placeholder="เลขไมล์">
<input id="jobNo" placeholder="เลขที่ใบงาน">
</div>
</div>

<div class="form-section">
<div class="form-title">งานซ่อม</div>
<div class="form-grid-2">
<input id="system" placeholder="ระบบ">
<input id="technician" placeholder="ช่าง">
</div>
</div>

<div class="form-section">
<div class="form-title">รายละเอียด</div>
<div class="form-grid-3">
<textarea id="symptoms" placeholder="อาการ"></textarea>
<textarea id="parts" placeholder="อะไหล่"></textarea>
<textarea id="note" placeholder="หมายเหตุ"></textarea>
</div>
</div>

<div class="form-section">
<div class="form-title">ค่าใช้จ่าย</div>
<div class="form-grid-2">
<input type="number" id="partsCost" placeholder="ค่าอะไหล่">
<input type="number" id="laborCost" placeholder="ค่าแรง">
</div>
</div>

<br>
<button onclick="save()">บันทึก</button>
<button class="danger" onclick="closeModal()">ยกเลิก</button>

</div>
</div>

<!-- detail -->
<div class="modal" id="detailModal">
<div class="modal-box">
<h3>รายละเอียด</h3>
<div id="detailContent"></div>
<button onclick="detailModal.style.display='none'">ปิด</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSy...",
  projectId:"vehicle-maintenance-64890"
});
const db=firebase.firestore();

let all=[];
let currentPage=1;
let perPage=10;
let currentSort=null;
let sortAsc=true;

/* load */
function loadVehicles(){
  db.collection("vehicles").onSnapshot(s=>{
    vehicleSelect.innerHTML="";
    s.forEach(d=>{
      let o=document.createElement("option");
      o.value=d.id;
      o.textContent=d.id;
      vehicleSelect.appendChild(o);
    });
    if(vehicleSelect.value) loadRepairs(vehicleSelect.value);
  });
}

vehicleSelect.onchange=()=>loadRepairs(vehicleSelect.value);

function loadRepairs(v){
  db.collection("vehicles").doc(v).collection("repairs")
  .onSnapshot(s=>{
    all=[];
    s.forEach(d=>{
      let r=d.data();
      r._id=d.id;
      all.push(r);
    });

    all.sort((a,b)=> new Date(b["วันที่"]) - new Date(a["วันที่"]));
    render();
  });
}

/* render */
function render(list=all){
  if(currentSort){
    list=[...list].sort((a,b)=>{
      let va=a[currentSort]||"";
      let vb=b[currentSort]||"";
      return sortAsc
        ? va.toString().localeCompare(vb)
        : vb.toString().localeCompare(va);
    });
  }

  let start=(currentPage-1)*perPage;
  let page=list.slice(start,start+perPage);

  tbody.innerHTML="";
  page.forEach(r=>{
    let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);

    tbody.innerHTML+=`
    <tr>
      <td>${r["วันที่"]||""}</td>
      <td>${vehicleSelect.value}</td>
      <td>${r["ระบบที่ซ่อม"]||""}</td>
      <td>${r["อาการเสีย"]||""}</td>
      <td>${r["ช่างผู้รับผิดชอบ"]||""}</td>
      <td>${cost}</td>
      <td><button onclick='showDetail(${JSON.stringify(r)})'>ดู</button></td>
      <td><button onclick="del('${r._id}')">ลบ</button></td>
    </tr>`;
  });

  pageInfo.innerText=`หน้า ${currentPage} / ${Math.ceil(list.length/perPage)}`;
}

/* sort */
function setSort(f){
  if(currentSort===f){sortAsc=!sortAsc}
  else{currentSort=f;sortAsc=true}
  render();
}

/* search realtime */
searchInput.addEventListener("input",()=>{
  let q=searchInput.value.toLowerCase();
  let res=all.filter(r=>
    (r["ระบบที่ซ่อม"]||"").toLowerCase().includes(q) ||
    (r["อาการเสีย"]||"").toLowerCase().includes(q)
  );
  currentPage=1;
  render(res);
});

function resetSearch(){
  searchInput.value="";
  render();
}

/* CRUD */
function save(){
  db.collection("vehicles").doc(vehicleSelect.value)
  .collection("repairs").add({
    "วันที่":date.value,
    "เลขไมล์":mileage.value,
    "เลขที่ใบงาน":jobNo.value,
    "ระบบที่ซ่อม":system.value,
    "อาการเสีย":symptoms.value,
    "อะไหล่ที่เปลี่ยน":parts.value,
    "ช่างผู้รับผิดชอบ":technician.value,
    "หมายเหตุ":note.value,
    "ค่าอะไหล่":partsCost.value,
    "ค่าแรง":laborCost.value
  });
  closeModal();
}

function del(id){
  db.collection("vehicles").doc(vehicleSelect.value)
  .collection("repairs").doc(id).delete();
}

/* modal */
function openModal(){modal.style.display="flex"}
function closeModal(){modal.style.display="none"}

function showDetail(d){
  let html="";
  for(let k in d){
    html+=`<div class="detail-row"><b>${k}</b><div>${d[k]||"-"}</div></div>`;
  }
  detailContent.innerHTML=html;
  detailModal.style.display="flex";
}

/* page */
function nextPage(){currentPage++;render()}
function prevPage(){if(currentPage>1)currentPage--;render()}

function deleteAll(){
  let v=vehicleSelect.value;
  db.collection("vehicles").doc(v).collection("repairs")
  .get().then(s=>{
    let batch=db.batch();
    s.forEach(d=>batch.delete(d.ref));
    batch.commit();
  });
}

loadVehicles();
</script>

</body>
</html>
