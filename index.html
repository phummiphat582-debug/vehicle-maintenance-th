<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ระบบซ่อมบำรุง</title>

<style>
:root{
  --red:#991b1b;
  --red2:#b91c1c;
  --bg:#f1f5f9;
}

/* RESET */
body{
  margin:0;
  font-family:Segoe UI;
  background:var(--bg);
}

/* SIDEBAR */
.sidebar{
  width:240px;
  height:100vh;
  position:fixed;
  left:0;
  top:0;
  background:linear-gradient(180deg,var(--red),#7f1d1d);
  color:#fff;
  padding:20px;
  box-sizing:border-box;
}

/* 🔥 แก้ทับตรงนี้ */
.main{
  margin-left:240px; /* สำคัญ */
  padding:25px;
}

/* HEADER */
header{
  margin-left:240px;
  background:linear-gradient(90deg,var(--red),var(--red2));
  color:#fff;
  padding:18px;
  font-weight:600;
}

/* CARD */
.card{
  background:#fff;
  padding:20px;
  border-radius:16px;
  box-shadow:0 10px 25px rgba(0,0,0,.06);
  margin-bottom:20px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

/* STAT */
.stat{
  font-size:28px;
  font-weight:700;
  color:var(--red);
}

/* TABLE */
.table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:12px;
  border-bottom:1px solid #eee;
}

/* BUTTON */
button{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  background:var(--red2);
  color:#fff;
  cursor:pointer;
}
.danger{background:#dc2626}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal-box{
  background:#fff;
  padding:20px;
  border-radius:12px;
  width:90%;
  max-width:900px;
  max-height:90vh;
  overflow:auto;
}

/* DETAIL */
.detail-row{
  display:grid;
  grid-template-columns:180px 1fr;
  padding:6px 0;
  border-bottom:1px dashed #ddd;
}
.detail-row b{color:var(--red)}
</style>
</head>

<body>

<div class="sidebar">
  <h3>ระบบซ่อมบำรุง</h3>
</div>

<header>ระบบซ่อมบำรุง</header>

<div class="main">

<!-- SUMMARY -->
<div class="grid">
  <div class="card">
    <div>จำนวนรายการ</div>
    <div class="stat" id="count">0</div>
  </div>
  <div class="card">
    <div>ค่าใช้จ่ายรวม</div>
    <div class="stat" id="total">0</div>
  </div>
</div>

<!-- CONTROL -->
<div class="card grid">
  <input id="searchInput" placeholder="ค้นหา">
  <button onclick="openModal()">เพิ่มรายการ</button>
  <button class="danger" onclick="deleteAll()">ลบทั้งหมด</button>
</div>

<!-- TABLE -->
<div class="card">
<table class="table">
<thead>
<tr>
<th>วันที่</th>
<th>รถ</th>
<th>ระบบ</th>
<th>ช่าง</th>
<th>ดู</th>
<th>ลบ</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>

<!-- ADD MODAL -->
<div class="modal" id="addModal">
<div class="modal-box">

<h3>เพิ่มรายการ</h3>

<input id="vehicle" placeholder="ชื่อรถ"><br><br>
<input type="date" id="date"><br><br>
<input id="system" placeholder="ระบบ"><br><br>
<input id="technician" placeholder="ช่าง"><br><br>

<textarea id="symptoms" placeholder="อาการ"></textarea><br>
<textarea id="parts" placeholder="อะไหล่"></textarea><br>
<textarea id="note" placeholder="หมายเหตุ"></textarea><br>

<input type="number" id="partsCost" placeholder="ค่าอะไหล่"><br>
<input type="number" id="laborCost" placeholder="ค่าแรง"><br><br>

<button onclick="save()">บันทึก</button>
<button onclick="addModal.style.display='none'">ยกเลิก</button>

</div>
</div>

<!-- DETAIL -->
<div class="modal" id="detailModal">
<div class="modal-box">
<h3>รายละเอียด</h3>
<div id="detail"></div>
<button onclick="detailModal.style.display='none'">ปิด</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSy...",
  projectId:"vehicle-maintenance-64890"
});
const db=firebase.firestore();

let all=[];

db.collection("vehicles").onSnapshot(s=>{
  all=[];
  s.forEach(v=>{
    db.collection("vehicles").doc(v.id).collection("repairs")
    .get().then(r=>{
      r.forEach(d=>{
        let data=d.data();
        data.vehicle=v.id;
        data._id=d.id;
        all.push(data);
        render();
      });
    });
  });
});

function render(){
  tbody.innerHTML="";
  let total=0;

  all.forEach(r=>{
    let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);
    total+=cost;

    tbody.innerHTML+=`
    <tr>
      <td>${r["วันที่"]||""}</td>
      <td>${r.vehicle}</td>
      <td>${r["ระบบที่ซ่อม"]||""}</td>
      <td>${r["ช่างผู้รับผิดชอบ"]||""}</td>
      <td><button onclick='show(${JSON.stringify(r)})'>ดู</button></td>
      <td><button class="danger" onclick="del('${r.vehicle}','${r._id}')">ลบ</button></td>
    </tr>`;
  });

  count.innerText=all.length;
  totalEl.innerText=total;
}

function show(d){
  let html="";
  for(let k in d){
    html+=`<div class="detail-row"><b>${k}</b><div>${d[k]}</div></div>`;
  }
  detail.innerHTML=html;
  detailModal.style.display="flex";
}

function save(){
  let v=vehicle.value;

  db.collection("vehicles").doc(v).collection("repairs").add({
    "วันที่":date.value,
    "ระบบที่ซ่อม":system.value,
    "อาการเสีย":symptoms.value,
    "อะไหล่ที่เปลี่ยน":parts.value,
    "ช่างผู้รับผิดชอบ":technician.value,
    "หมายเหตุ":note.value,
    "ค่าอะไหล่":partsCost.value,
    "ค่าแรง":laborCost.value
  });

  addModal.style.display="none";
}

function del(v,id){
  db.collection("vehicles").doc(v).collection("repairs").doc(id).delete();
}

function deleteAll(){
  if(!confirm("ลบทั้งหมด?")) return;
}

function openModal(){
  addModal.style.display="flex";
}

const totalEl=document.getElementById("total");
</script>

</body>
</html>
