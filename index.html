<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>SC Maintenance PRO+</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
:root{
  --primary:#4f46e5;
  --danger:#dc2626;
}
body{
  margin:0;
  font-family:Segoe UI;
  background:#f3f4f6;
}

/* header */
.header{
  background:var(--primary);
  color:#fff;
  padding:20px;
  font-size:22px;
}

/* vehicle */
.vehicle{
  background:#ddd;
  padding:12px;
  margin:10px 20px;
  border-radius:12px;
  cursor:pointer;
  transition:.2s;
}
.vehicle:active{
  transform:scale(.95);
}
.vehicle.active{
  background:var(--primary);
  color:#fff;
}

/* list accordion */
.list{
  overflow:hidden;
  max-height:0;
  transition:max-height .3s ease;
  margin:0 20px;
}
.list.open{
  max-height:2000px;
}

/* item */
.item{
  background:#fff;
  padding:15px;
  border-radius:12px;
  margin-top:10px;
  animation:fadeIn .3s;
}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

/* button */
.btn{
  background:var(--primary);
  color:#fff;
  padding:12px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  transition:.15s;
}
.btn:active{
  transform:scale(.95);
}
.btn-danger{
  background:var(--danger);
}

/* modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal-box{
  background:#fff;
  border-radius:20px;
  width:90%;
  max-width:800px;
  height:90vh;
  padding:20px;
  display:flex;
  flex-direction:column;
  animation:pop .25s;
}
@keyframes pop{
  from{transform:scale(.85);opacity:0}
  to{transform:scale(1);opacity:1}
}

/* form */
.form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  flex:1;
}
.full{grid-column:span 2}

input,textarea{
  padding:12px;
  border-radius:12px;
  border:1px solid #ddd;
  transition:.2s;
}
input:focus,textarea:focus{
  outline:none;
  border-color:var(--primary);
  box-shadow:0 0 0 2px rgba(79,70,229,.2);
}

/* confirm */
.confirm{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
}
.confirm-box{
  background:#fff;
  padding:20px;
  border-radius:20px;
  width:300px;
  text-align:center;
  animation:pop .2s;
}
</style>
</head>

<body>

<div class="header">🚗 SC Maintenance PRO+</div>

<div style="padding:20px">
  <button class="btn" onclick="openModal()">➕ เพิ่มรายการ</button>
</div>

<div id="vehicleContainer"></div>

<!-- modal -->
<div class="modal" id="modal">
<div class="modal-box">

<h3>เพิ่มรายการซ่อม</h3>

<div class="form">

<input type="date" id="date">
<input id="mileage" placeholder="เลขไมล์">

<input id="jobNo" placeholder="ใบงาน">
<input id="system" placeholder="ระบบ">

<textarea id="symptoms" class="full" placeholder="อาการ"></textarea>
<textarea id="parts" class="full" placeholder="อะไหล่"></textarea>

<input id="technician" placeholder="ช่าง">
<input id="approver" placeholder="ผู้อนุมัติ">

<input id="partsCost" placeholder="ค่าอะไหล่">
<input id="laborCost" placeholder="ค่าแรง">

<textarea id="note" class="full" placeholder="หมายเหตุ"></textarea>

</div>

<div style="display:flex; gap:10px;">
  <button class="btn" onclick="confirmSave()">💾 บันทึก</button>
  <button class="btn btn-danger" onclick="closeModal()">❌ ยกเลิก</button>
</div>

</div>
</div>

<!-- confirm -->
<div class="confirm" id="confirmBox">
  <div class="confirm-box">
    <h3>ยืนยันการบันทึก?</h3><br>
    <button class="btn" onclick="save()">ยืนยัน</button>
    <button class="btn btn-danger" onclick="closeConfirm()">ยกเลิก</button>
  </div>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain: "vehicle-maintenance-64890.firebaseapp.com",
  projectId: "vehicle-maintenance-64890",
});

const db=firebase.firestore();

let selectedVehicle=null;
let vehicleData={};

/* โหลดรถ + ข้อมูล */
db.collection("vehicles").onSnapshot(async s=>{
  vehicleContainer.innerHTML="";

  for(const d of s.docs){
    let vName=d.id;

    let snap=await db.collection("vehicles")
      .doc(vName).collection("repairs").get();

    let repairs=[];
    snap.forEach(doc=>{
      let r=doc.data();
      r._id=doc.id;
      repairs.push(r);
    });

    vehicleData[vName]=repairs;

    vehicleContainer.innerHTML+=`
    <div class="vehicle" onclick="toggleVehicle('${vName}', this)">
      🚗 ${vName}
    </div>

    <div class="list" id="list-${vName}">
      ${renderRepairsHTML(repairs, vName)}
    </div>`;
  }
});

/* toggle accordion */
function toggleVehicle(name, el){
  selectedVehicle=name;

  let list=document.getElementById("list-"+name);

  list.classList.toggle("open");
}

/* render */
function renderRepairsHTML(list,v){
  return list.map(r=>{
    let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);

    return `
    <div class="item">
      📅 ${r["วันที่"]||"-"}<br>
      🔧 ${r["ระบบที่ซ่อม"]||"-"}<br>
      🧠 ${r["อาการเสีย"]||"-"}<br>
      💰 ${cost.toLocaleString()} บาท<br>
      👨‍🔧 ${r["ช่างผู้รับผิดชอบ"]||"-"}<br><br>
      <button class="btn btn-danger" onclick="del('${v}','${r._id}')">ลบ</button>
    </div>`;
  }).join("");
}

/* confirm */
function confirmSave(){
  confirmBox.style.display="flex";
}
function closeConfirm(){
  confirmBox.style.display="none";
}

/* save */
function save(){
  confirmBox.style.display="none";

  if(!selectedVehicle) return alert("เลือกคันก่อน");

  db.collection("vehicles").doc(selectedVehicle)
    .collection("repairs")
    .add({
      "วันที่":date.value,
      "เลขไมล์":mileage.value,
      "เลขที่ใบงาน":jobNo.value,
      "ระบบที่ซ่อม":system.value,
      "อาการเสีย":symptoms.value,
      "อะไหล่ที่เปลี่ยน":parts.value,
      "ช่างผู้รับผิดชอบ":technician.value,
      "ผู้อนุมัติ":approver.value,
      "หมายเหตุ":note.value,
      "ค่าอะไหล่":partsCost.value,
      "ค่าแรง":laborCost.value,
      "เวลาบันทึก":new Date()
    });

  closeModal();
}

/* delete */
function del(v,id){
  db.collection("vehicles")
    .doc(v)
    .collection("repairs")
    .doc(id)
    .delete();
}

/* modal */
function openModal(){modal.style.display="flex";}
function closeModal(){modal.style.display="none";}
</script>

</body>
</html>
