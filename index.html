<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Apple Maintenance</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont;
  background:#000;
  color:#fff;
}

/* header */
.header{
  padding:20px;
  font-size:30px;
  font-weight:700;
}

/* rings */
.rings{
  display:flex;
  justify-content:center;
  margin:20px;
}

.ring{
  position:absolute;
  border-radius:50%;
}

.r1{width:180px;height:180px;}
.r2{width:140px;height:140px;}
.r3{width:100px;height:100px;}

.inner{
  position:absolute;
  width:60px;
  height:60px;
  background:#000;
  border-radius:50%;
  top:60px;
  left:60px;
}

/* stats */
.stats{
  display:flex;
  justify-content:space-around;
  margin:20px;
}

.stat{
  text-align:center;
}

.stat div{
  font-size:22px;
}

/* vehicle */
.vehicle-bar{
  display:flex;
  overflow:auto;
  gap:10px;
  padding:10px;
}

.vehicle{
  padding:10px 16px;
  background:#222;
  border-radius:20px;
  cursor:pointer;
}

.vehicle.active{
  background:#0f0;
  color:#000;
}

/* cards */
.list{
  padding:15px;
}

.card{
  background:#111;
  padding:15px;
  border-radius:20px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<div class="header">Summary</div>

<!-- RINGS -->
<div class="rings">
  <canvas id="ringsCanvas" width="200" height="200"></canvas>
</div>

<!-- stats -->
<div class="stats">
  <div class="stat">
    Move
    <div id="moveVal">0</div>
  </div>
  <div class="stat">
    Repair
    <div id="repairVal">0</div>
  </div>
  <div class="stat">
    Cost
    <div id="costVal">0</div>
  </div>
</div>

<!-- vehicles -->
<div class="vehicle-bar" id="vehicleList"></div>

<!-- list -->
<div class="list" id="log"></div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain: "vehicle-maintenance-64890.firebaseapp.com",
  projectId: "vehicle-maintenance-64890",
});

const db = firebase.firestore();

let selectedVehicle=null;
let all=[];

/* โหลดรถ */
db.collection("vehicles").onSnapshot(s=>{
  vehicleList.innerHTML="";
  let first=null;

  s.forEach(d=>{
    if(!first) first=d.id;

    let div=document.createElement("div");
    div.className="vehicle";
    div.innerText=d.id;

    div.onclick=()=>{
      document.querySelectorAll(".vehicle")
        .forEach(v=>v.classList.remove("active"));

      div.classList.add("active");
      selectedVehicle=d.id;
      load(d.id);
    };

    vehicleList.appendChild(div);
  });

  if(first) vehicleList.children[0].click();
});

/* โหลด */
function load(v){
  db.collection("vehicles").doc(v).collection("repairs")
  .onSnapshot(s=>{
    all=[];
    s.forEach(doc=>{
      all.push(doc.data());
    });

    calculate();
    render();
  });
}

/* คำนวณ */
function calculate(){
  let totalCost=0;
  let totalJobs=all.length;
  let todayJobs=0;

  let today=new Date().toISOString().split("T")[0];

  all.forEach(r=>{
    let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);
    totalCost+=cost;

    if(r["วันที่"]===today) todayJobs++;
  });

  moveVal.innerText = totalJobs;
  repairVal.innerText = todayJobs;
  costVal.innerText = totalCost.toLocaleString();

  drawRings(totalJobs, todayJobs, totalCost);
}

/* วาดวง */
function drawRings(move, repair, cost){
  let canvas=document.getElementById("ringsCanvas");
  let ctx=canvas.getContext("2d");

  ctx.clearRect(0,0,200,200);

  drawRing(ctx, move/20, 80, "#ff375f"); // move
  drawRing(ctx, repair/10, 60, "#30d158"); // repair
  drawRing(ctx, cost/50000, 40, "#0a84ff"); // cost
}

function drawRing(ctx, percent, radius, color){
  ctx.beginPath();
  ctx.strokeStyle="#222";
  ctx.lineWidth=15;
  ctx.arc(100,100,radius,0,Math.PI*2);
  ctx.stroke();

  ctx.beginPath();
  ctx.strokeStyle=color;
  ctx.lineWidth=15;
  ctx.arc(100,100,radius,-Math.PI/2,(Math.PI*2*percent)-Math.PI/2);
  ctx.stroke();
}

/* render */
function render(){
  log.innerHTML="";

  all.forEach(r=>{
    let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);

    log.innerHTML+=`
    <div class="card">
      🔧 ${r["ระบบที่ซ่อม"]||"-"}<br>
      💰 ${cost.toLocaleString()} บาท<br>
      📅 ${r["วันที่"]||"-"}
    </div>`;
  });
}
</script>

</body>
</html>
