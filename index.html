<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>SC THE ADVENTURE | Fitness Maintenance</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg:#0f172a;
  --card:#1e293b;
  --accent:#22c55e;
  --danger:#ef4444;
  --text:#f1f5f9;
  --sub:#94a3b8;
}

body{
  margin:0;
  font-family:Segoe UI;
  background:var(--bg);
  color:var(--text);
}

/* header */
.header{
  padding:20px;
  font-size:22px;
  font-weight:bold;
}

/* vehicle bar */
.vehicle-bar{
  display:flex;
  overflow:auto;
  gap:10px;
  padding:10px 20px;
}

.vehicle{
  padding:10px 16px;
  background:#1e293b;
  border-radius:20px;
  cursor:pointer;
  white-space:nowrap;
}

.vehicle.active{
  background:var(--accent);
  color:#000;
}

/* main */
.container{
  padding:20px;
}

/* card */
.card{
  background:var(--card);
  border-radius:20px;
  padding:20px;
  margin-bottom:15px;
}

/* top */
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* cost */
.cost{
  font-size:20px;
  font-weight:bold;
  color:var(--accent);
}

/* label */
.label{
  font-size:13px;
  color:var(--sub);
}

/* row */
.row{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
}

/* chips */
.chip{
  display:inline-block;
  padding:4px 10px;
  background:#334155;
  border-radius:10px;
  margin-top:6px;
  font-size:12px;
}

/* button */
.btn{
  background:var(--accent);
  border:none;
  padding:10px;
  border-radius:12px;
  color:#000;
  width:100%;
}

.btn-danger{
  background:var(--danger);
  color:#fff;
}

/* search */
.search{
  margin:10px 20px;
}

.search input{
  width:100%;
  padding:10px;
  border-radius:12px;
  border:none;
}

/* modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-box{
  background:#1e293b;
  padding:20px;
  border-radius:20px;
  width:90%;
  max-height:90vh;
  overflow:auto;
}

input,textarea{
  width:100%;
  margin-bottom:10px;
  padding:10px;
  border-radius:10px;
  border:none;
}
</style>
</head>

<body>

<div class="header">🚗 Maintenance Tracker</div>

<div class="vehicle-bar" id="vehicleList"></div>

<div class="search">
  <input id="search" placeholder="ค้นหา...">
</div>

<div class="container" id="log"></div>

<div style="padding:20px;">
  <button class="btn" onclick="openModal()">➕ เพิ่มรายการ</button>
</div>

<!-- modal -->
<div class="modal" id="modal">
<div class="modal-box">

<h3>เพิ่มรายการซ่อม</h3>

<input type="date" id="date">
<input id="mileage" placeholder="เลขไมล์">
<input id="jobNo" placeholder="เลขที่ใบงาน">

<input id="system" placeholder="ระบบ">
<textarea id="symptoms" placeholder="อาการ"></textarea>
<textarea id="parts" placeholder="อะไหล่"></textarea>

<input id="technician" placeholder="ช่าง">
<input id="approver" placeholder="ผู้อนุมัติ">

<input type="number" id="partsCost" placeholder="ค่าอะไหล่">
<input type="number" id="laborCost" placeholder="ค่าแรง">

<textarea id="note" placeholder="หมายเหตุ"></textarea>

<button class="btn" onclick="save()">บันทึก</button>
<button class="btn-danger" onclick="closeModal()">ยกเลิก</button>

</div>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain: "vehicle-maintenance-64890.firebaseapp.com",
  projectId: "vehicle-maintenance-64890",
});

const db = firebase.firestore();

let selectedVehicle=null;
let all=[];

/* โหลดรถ */
db.collection("vehicles").onSnapshot(s=>{
  vehicleList.innerHTML="";
  let first=null;

  s.forEach(d=>{
    if(!first) first=d.id;

    let div=document.createElement("div");
    div.className="vehicle";
    div.innerText=d.id;

    div.onclick=()=>{
      document.querySelectorAll(".vehicle")
        .forEach(v=>v.classList.remove("active"));

      div.classList.add("active");
      selectedVehicle=d.id;
      load(d.id);
    };

    vehicleList.appendChild(div);
  });

  if(first){
    vehicleList.children[0].click();
  }
});

/* โหลด */
function load(v){
  db.collection("vehicles").doc(v).collection("repairs")
  .onSnapshot(s=>{
    all=[];
    s.forEach(doc=>{
      let r=doc.data();
      r._id=doc.id;
      all.push(r);
    });

    all.sort((a,b)=>new Date(b["วันที่"])-new Date(a["วันที่"]));
    render(all);
  });
}

/* render */
function render(list){
  log.innerHTML="";

  list.forEach(r=>{
    let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);

    log.innerHTML+=`
    <div class="card">

      <div class="top">
        <div>
          <div>${r["ระบบที่ซ่อม"]||"-"}</div>
          <div class="label">${r["วันที่"]||"-"}</div>
        </div>
        <div class="cost">${cost.toLocaleString()}฿</div>
      </div>

      <div class="chip">🧠 ${r["อาการเสีย"]||"-"}</div>
      <div class="chip">👨‍🔧 ${r["ช่างผู้รับผิดชอบ"]||"-"}</div>
      <div class="chip">📏 ${r["เลขไมล์"]||"-"}</div>

      <div class="row">
        <small>${r["เลขที่ใบงาน"]||"-"}</small>
        <button class="btn-danger" onclick="del('${r._id}')">ลบ</button>
      </div>

    </div>`;
  });
}

/* save */
function save(){
  db.collection("vehicles").doc(selectedVehicle)
  .collection("repairs")
  .add({
    "วันที่":date.value,
    "เลขไมล์":mileage.value,
    "เลขที่ใบงาน":jobNo.value,
    "ระบบที่ซ่อม":system.value,
    "อาการเสีย":symptoms.value,
    "อะไหล่ที่เปลี่ยน":parts.value,
    "ช่างผู้รับผิดชอบ":technician.value,
    "ผู้อนุมัติ":approver.value,
    "หมายเหตุ":note.value,
    "ค่าอะไหล่":partsCost.value,
    "ค่าแรง":laborCost.value,
    "เวลาบันทึก":new Date()
  });

  closeModal();
}

/* delete */
function del(id){
  db.collection("vehicles").doc(selectedVehicle)
  .collection("repairs").doc(id).delete();
}

/* search */
search.oninput=()=>{
  let q=search.value.toLowerCase();
  render(all.filter(r=>
    (r["ระบบที่ซ่อม"]||"").toLowerCase().includes(q) ||
    (r["อาการเสีย"]||"").toLowerCase().includes(q)
  ));
};

function openModal(){modal.style.display="flex";}
function closeModal(){modal.style.display="none";}
</script>

</body>
</html>
