<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>SC Maintenance Ultra UI</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg:#0f172a;
  --glass:rgba(255,255,255,0.05);
  --border:rgba(255,255,255,0.1);
  --primary:#38bdf8;
}

body{
  margin:0;
  font-family:'JetBrains Mono', monospace;
  background:linear-gradient(135deg,#0f172a,#020617);
  color:#fff;
}

/* header */
.header{
  padding:20px;
  font-size:18px;
  backdrop-filter:blur(20px);
  background:var(--glass);
  border-bottom:1px solid var(--border);
}

/* layout */
.container{
  padding:20px;
}

/* glass card */
.card{
  background:var(--glass);
  border:1px solid var(--border);
  backdrop-filter:blur(20px);
  border-radius:20px;
  padding:18px;
  margin-bottom:15px;
  transition:.25s;
}
.card:hover{
  transform:translateY(-4px);
}

/* button */
.btn{
  padding:12px;
  border-radius:14px;
  border:none;
  background:var(--primary);
  color:#000;
  cursor:pointer;
  font-weight:600;
  transition:.2s;
}
.btn:active{
  transform:scale(.95);
}

/* floating panel */
.sheet{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:#020617;
  border-radius:20px 20px 0 0;
  padding:20px;
  transform:translateY(100%);
  transition:.35s cubic-bezier(.2,.8,.2,1);
}
.sheet.open{
  transform:translateY(0);
}

/* vehicle */
.vehicle{
  padding:12px;
  border-bottom:1px solid #222;
  cursor:pointer;
}
.vehicle:hover{
  color:var(--primary);
}

/* modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-box{
  background:#020617;
  padding:20px;
  border-radius:20px;
  width:350px;
  animation:pop .3s;
}
@keyframes pop{
  from{transform:scale(.8);opacity:0}
  to{transform:scale(1);opacity:1}
}

/* input */
input,textarea{
  width:100%;
  margin-bottom:10px;
  padding:10px;
  border-radius:10px;
  border:none;
  background:#111;
  color:#fff;
}
</style>
</head>

<body>

<div class="header">🚗 SC Maintenance Ultra</div>

<div class="container">

<button class="btn" onclick="openSheet()">🚗 เลือกรถ</button>
<button class="btn" onclick="openModal()">➕ เพิ่ม</button>

<h3 id="currentVehicle">ยังไม่ได้เลือกรถ</h3>

<div id="repairList"></div>

</div>

<!-- bottom sheet -->
<div class="sheet" id="sheet">
  <h3>เลือกรถ</h3>
  <div id="vehicleList"></div>
</div>

<!-- modal -->
<div class="modal" id="modal">
<div class="modal-box">

<h3>เพิ่มรายการ</h3>

<input type="date" id="date">
<input id="system" placeholder="ระบบ">
<textarea id="symptoms" placeholder="อาการ"></textarea>
<input id="technician" placeholder="ช่าง">
<input id="partsCost" placeholder="ค่าอะไหล่">
<input id="laborCost" placeholder="ค่าแรง">

<button class="btn" onclick="save()">บันทึก</button>

</div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain:"vehicle-maintenance-64890.firebaseapp.com",
  projectId:"vehicle-maintenance-64890"
});

const db=firebase.firestore();
let selectedVehicle=null;

/* vehicles */
db.collection("vehicles").onSnapshot(s=>{
  vehicleList.innerHTML="";
  s.forEach(d=>{
    vehicleList.innerHTML+=`
    <div class="vehicle" onclick="selectVehicle('${d.id}')">
      🚗 ${d.id}
    </div>`;
  });
});

function openSheet(){
  sheet.classList.add("open");
}

function selectVehicle(v){
  selectedVehicle=v;
  currentVehicle.innerText=v;
  sheet.classList.remove("open");
  load(v);
}

/* load repairs */
function load(v){
  db.collection("vehicles").doc(v).collection("repairs")
  .onSnapshot(s=>{
    let list=[];
    s.forEach(doc=>list.push(doc.data()));

    list.sort((a,b)=>new Date(b["วันที่"])-new Date(a["วันที่"]));

    repairList.innerHTML="";
    list.forEach(r=>{
      let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);

      repairList.innerHTML+=`
      <div class="card">
        📅 ${r["วันที่"]}<br>
        🔧 ${r["ระบบที่ซ่อม"]}<br>
        💰 ${cost.toLocaleString()} บาท
      </div>`;
    });
  });
}

/* save */
function save(){
  if(!selectedVehicle) return alert("เลือกคันก่อน");

  db.collection("vehicles").doc(selectedVehicle)
    .collection("repairs")
    .add({
      "วันที่":date.value,
      "ระบบที่ซ่อม":system.value,
      "อาการเสีย":symptoms.value,
      "ช่างผู้รับผิดชอบ":technician.value,
      "ค่าอะไหล่":partsCost.value,
      "ค่าแรง":laborCost.value
    });

  modal.style.display="none";
}

/* modal */
function openModal(){modal.style.display="flex";}
</script>

</body>
</html>
