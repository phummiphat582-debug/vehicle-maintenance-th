<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>SC Fleet System</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg:#0f172a;
  --card:#111827;
  --border:#1f2937;
  --text:#e5e7eb;
  --sub:#9ca3af;
  --primary:#6366f1;
}

body{
  margin:0;
  font-family:Inter,Segoe UI;
  background:var(--bg);
  color:var(--text);
}

/* layout */
.container{
  max-width:1200px;
  margin:auto;
  padding:30px;
}

/* header */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.title{
  font-size:24px;
  font-weight:600;
}

/* grid */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

/* vehicle */
.vehicle{
  background:var(--card);
  border:1px solid var(--border);
  padding:18px;
  border-radius:16px;
  cursor:pointer;
  transition:.2s;
}
.vehicle:hover{
  border-color:var(--primary);
}
.vehicle.active{
  background:var(--primary);
}

/* panel */
.panel{
  margin-top:15px;
  display:none;
}
.panel.open{
  display:block;
}

/* item */
.item{
  background:var(--card);
  border:1px solid var(--border);
  padding:14px;
  border-radius:12px;
  margin-top:10px;
  transition:.2s;
}
.item:hover{
  transform:translateY(-2px);
}

/* text */
.sub{
  color:var(--sub);
  font-size:13px;
}

/* button */
.btn{
  background:var(--primary);
  border:none;
  color:#fff;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
}
.btn:active{
  transform:scale(.96);
}

/* modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal-box{
  background:var(--card);
  padding:20px;
  border-radius:16px;
  width:400px;
}

/* input */
input,textarea{
  width:100%;
  margin-bottom:10px;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#020617;
  color:#fff;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <div class="title">🚗 Fleet Maintenance</div>
  <button class="btn" onclick="openModal()">+ เพิ่ม</button>
</div>

<div id="vehicleGrid" class="grid"></div>

</div>

<!-- modal -->
<div class="modal" id="modal">
<div class="modal-box">

<h3>เพิ่มรายการซ่อม</h3>

<input type="date" id="date">
<input id="system" placeholder="ระบบ">
<input id="technician" placeholder="ช่าง">
<input id="partsCost" placeholder="ค่าอะไหล่">
<input id="laborCost" placeholder="ค่าแรง">

<button class="btn" onclick="save()">บันทึก</button>

</div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain:"vehicle-maintenance-64890.firebaseapp.com",
  projectId:"vehicle-maintenance-64890"
});

const db=firebase.firestore();
let selected=null;

/* load vehicles */
db.collection("vehicles").onSnapshot(s=>{
  vehicleGrid.innerHTML="";

  s.forEach(d=>{
    let v=d.id;

    vehicleGrid.innerHTML+=`
    <div>
      <div class="vehicle" onclick="toggle('${v}', this)">
        🚗 ${v}
      </div>

      <div class="panel" id="p-${v}"></div>
    </div>`;
  });
});

/* toggle */
function toggle(v,el){
  selected=v;

  let panel=document.getElementById("p-"+v);

  if(panel.classList.contains("open")){
    panel.classList.remove("open");
    return;
  }

  document.querySelectorAll(".panel")
    .forEach(p=>p.classList.remove("open"));

  panel.classList.add("open");

  load(v);
}

/* load repairs */
function load(v){
  db.collection("vehicles").doc(v).collection("repairs")
  .onSnapshot(s=>{
    let html="";

    s.forEach(doc=>{
      let r=doc.data();
      let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);

      html+=`
      <div class="item">
        <b>${r["ระบบที่ซ่อม"]||"-"}</b><br>
        <div class="sub">${r["วันที่"]||"-"} • ${r["ช่างผู้รับผิดชอบ"]||"-"}</div>
        <div>💰 ${cost.toLocaleString()} บาท</div>
      </div>`;
    });

    document.getElementById("p-"+v).innerHTML=html;
  });
}

/* save */
function save(){
  if(!selected) return alert("เลือกคันก่อน");

  db.collection("vehicles").doc(selected)
    .collection("repairs")
    .add({
      "วันที่":date.value,
      "ระบบที่ซ่อม":system.value,
      "ช่างผู้รับผิดชอบ":technician.value,
      "ค่าอะไหล่":partsCost.value,
      "ค่าแรง":laborCost.value
    });

  modal.style.display="none";
}

/* modal */
function openModal(){modal.style.display="flex";}
</script>

</body>
</html>
