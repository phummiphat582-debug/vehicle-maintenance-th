<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>SC Maintenance Terminal</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:'JetBrains Mono', monospace;
  background:#000;
  color:#00ff9f;
}

/* scanline */
body::after{
  content:"";
  position:fixed;
  inset:0;
  background:linear-gradient(rgba(0,255,0,0.05) 1px, transparent 1px);
  background-size:100% 3px;
  pointer-events:none;
}

/* header */
.header{
  padding:15px;
  border-bottom:1px solid #00ff9f;
}

/* container */
.container{
  padding:20px;
}

/* filter */
select{
  background:#000;
  color:#0f0;
  border:1px solid #0f0;
  padding:5px;
  margin-bottom:15px;
}

/* log */
.log{
  line-height:1.6;
}

.line{
  margin-bottom:6px;
}

/* glow */
.line span{
  text-shadow:0 0 5px #00ff9f;
}

/* input */
input,textarea{
  width:100%;
  background:#000;
  border:1px solid #0f0;
  color:#0f0;
  margin-bottom:8px;
  padding:5px;
}

/* button */
button{
  background:#000;
  color:#0f0;
  border:1px solid #0f0;
  padding:8px;
  cursor:pointer;
}
button:hover{
  background:#0f0;
  color:#000;
}

/* modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal-box{
  width:400px;
}
</style>
</head>

<body>

<div class="header">
  > SC_MAINTENANCE_SYSTEM v1.0
</div>

<div class="container">

<select id="vehicleFilter"></select>
<button onclick="openModal()">ADD_LOG</button>

<div class="log" id="log"></div>

</div>

<!-- modal -->
<div class="modal" id="modal">
<div class="modal-box">

<h3>> ADD REPAIR</h3>

<input type="date" id="date">
<input id="system" placeholder="system">
<textarea id="symptoms" placeholder="symptoms"></textarea>
<input id="technician" placeholder="technician">
<input id="partsCost" placeholder="parts cost">
<input id="laborCost" placeholder="labor cost">

<button onclick="save()">EXECUTE</button>

</div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain:"vehicle-maintenance-64890.firebaseapp.com",
  projectId:"vehicle-maintenance-64890"
});

const db=firebase.firestore();

let allData=[];

/* โหลดทั้งหมด */
db.collection("vehicles").onSnapshot(async s=>{
  allData=[];
  vehicleFilter.innerHTML="<option value='all'>ALL</option>";

  for(const d of s.docs){
    let v=d.id;
    vehicleFilter.innerHTML+=`<option>${v}</option>`;

    let snap=await db.collection("vehicles").doc(v).collection("repairs").get();

    snap.forEach(doc=>{
      let r=doc.data();
      r.vehicle=v;
      allData.push(r);
    });
  }

  render();
});

/* render */
function render(){
  let filter=vehicleFilter.value;

  let list=allData.filter(r=>{
    return filter==="all" || r.vehicle===filter;
  });

  list.sort((a,b)=>new Date(b["วันที่"])-new Date(a["วันที่"]));

  log.innerHTML="";

  list.forEach(r=>{
    let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);

    log.innerHTML+=`
    <div class="line">
      <span>[${r.vehicle}]</span> 
      ${r["วันที่"]} | 
      ${r["ระบบที่ซ่อม"]} | 
      ${r["อาการเสีย"]} | 
      ${cost}฿
    </div>`;
  });
}

/* filter */
vehicleFilter.onchange=render;

/* save */
function save(){
  let v=vehicleFilter.value;
  if(v==="all") return alert("เลือกคันก่อน");

  db.collection("vehicles").doc(v)
    .collection("repairs")
    .add({
      "วันที่":date.value,
      "ระบบที่ซ่อม":system.value,
      "อาการเสีย":symptoms.value,
      "ช่างผู้รับผิดชอบ":technician.value,
      "ค่าอะไหล่":partsCost.value,
      "ค่าแรง":laborCost.value
    });

  modal.style.display="none";
}

/* modal */
function openModal(){modal.style.display="flex";}
</script>

</body>
</html>
