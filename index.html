<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>SC Maintenance Terminal Pro</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:'JetBrains Mono', monospace;
  background:#020617;
  color:#22c55e;
}

/* header */
.header{
  padding:15px;
  border-bottom:1px solid #14532d;
  font-size:14px;
}

/* container */
.container{
  padding:20px;
}

/* vehicle block */
.vehicle-block{
  margin-bottom:30px;
  border:1px solid #14532d;
  border-radius:10px;
  padding:15px;
  background:rgba(0,255,100,0.03);
}

/* vehicle title */
.vehicle-title{
  font-size:16px;
  margin-bottom:10px;
  color:#4ade80;
}

/* date group */
.date-group{
  margin-bottom:15px;
  padding-left:10px;
  border-left:2px solid #14532d;
}

/* date */
.date{
  font-size:13px;
  color:#86efac;
  margin-bottom:5px;
}

/* item */
.item{
  padding:8px 10px;
  margin-bottom:5px;
  background:#020617;
  border-radius:6px;
  border:1px solid #14532d;
}

/* hover */
.item:hover{
  background:#022c22;
}

/* cost */
.cost{
  color:#4ade80;
}

/* modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-box{
  background:#020617;
  padding:20px;
  border:1px solid #14532d;
  width:350px;
}

input,textarea{
  width:100%;
  margin-bottom:8px;
  padding:6px;
  background:#000;
  border:1px solid #14532d;
  color:#22c55e;
}

button{
  background:#000;
  color:#22c55e;
  border:1px solid #22c55e;
  padding:8px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
> SC MAINTENANCE SYSTEM (READABLE MODE)
</div>

<div class="container">
  <button onclick="openModal()">+ ADD LOG</button>
  <div id="log"></div>
</div>

<!-- modal -->
<div class="modal" id="modal">
<div class="modal-box">

<h3>> ADD REPAIR</h3>

<input id="vehicle" placeholder="รถ">
<input type="date" id="date">
<input id="system" placeholder="ระบบ">
<textarea id="symptoms" placeholder="อาการ"></textarea>
<input id="technician" placeholder="ช่าง">
<input id="partsCost" placeholder="ค่าอะไหล่">
<input id="laborCost" placeholder="ค่าแรง">

<button onclick="save()">EXECUTE</button>

</div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain:"vehicle-maintenance-64890.firebaseapp.com",
  projectId:"vehicle-maintenance-64890"
});

const db=firebase.firestore();

/* โหลดทั้งหมด */
db.collection("vehicles").onSnapshot(async s=>{
  let all={};

  for(const d of s.docs){
    let v=d.id;
    let snap=await db.collection("vehicles").doc(v).collection("repairs").get();

    snap.forEach(doc=>{
      let r=doc.data();

      if(!all[v]) all[v]=[];
      all[v].push(r);
    });
  }

  render(all);
});

/* render */
function render(data){
  log.innerHTML="";

  for(let v in data){

    let list=data[v];

    // sort วันที่
    list.sort((a,b)=>new Date(b["วันที่"])-new Date(a["วันที่"]));

    // group by date
    let group={};

    list.forEach(r=>{
      let d=r["วันที่"]||"unknown";
      if(!group[d]) group[d]=[];
      group[d].push(r);
    });

    let html=`
    <div class="vehicle-block">
      <div class="vehicle-title">🚗 ${v}</div>
    `;

    for(let d in group){
      html+=`<div class="date-group">
        <div class="date">📅 ${d}</div>`;

      group[d].forEach(r=>{
        let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);

        html+=`
        <div class="item">
          🔧 ${r["ระบบที่ซ่อม"]||"-"} | 
          ${r["อาการเสีย"]||"-"} | 
          👨‍🔧 ${r["ช่างผู้รับผิดชอบ"]||"-"} | 
          💰 <span class="cost">${cost}</span>
        </div>`;
      });

      html+=`</div>`;
    }

    html+=`</div>`;

    log.innerHTML+=html;
  }
}

/* save */
function save(){
  let v=vehicle.value;

  if(!v) return alert("ใส่ชื่อรถ");

  db.collection("vehicles").doc(v)
    .collection("repairs")
    .add({
      "วันที่":date.value,
      "ระบบที่ซ่อม":system.value,
      "อาการเสีย":symptoms.value,
      "ช่างผู้รับผิดชอบ":technician.value,
      "ค่าอะไหล่":partsCost.value,
      "ค่าแรง":laborCost.value
    });

  modal.style.display="none";
}

/* modal */
function openModal(){modal.style.display="flex";}
</script>

</body>
</html>
