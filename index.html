<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Maintenance System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Segoe UI;
}

/* LAYOUT */
.app{
  display:grid;
  grid-template-columns:260px 1fr;
  grid-template-rows:70px 1fr;
  height:100vh;
}

/* TOP BAR */
.topbar{
  grid-column:1 / span 2;
  background:#2f5b89;
  color:#fff;
  display:flex;
  align-items:center;
  padding:0 20px;
  font-weight:600;
}

/* SIDEBAR */
.sidebar{
  background:#243c5a;
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* MAIN */
.main{
  background:#d1d5db;
  padding:20px;
  overflow:auto;
}

/* INPUT */
input,select,textarea{
  padding:10px;
  border-radius:6px;
  border:none;
}

/* BUTTON */
button{
  padding:10px;
  border:none;
  border-radius:6px;
  background:#1e293b;
  color:#fff;
  cursor:pointer;
}
button.danger{
  background:#dc2626;
}

/* TABLE */
.table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
}

th{
  text-align:left;
  padding:10px;
  background:#f3f4f6;
}

td{
  padding:10px;
  border-top:1px solid #e5e7eb;
}

tr:hover{
  background:#f9fafb;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-box{
  background:#fff;
  padding:20px;
  border-radius:8px;
  width:90%;
  max-width:800px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:10px;
}
</style>
</head>

<body>

<div class="app">

<!-- TOP -->
<div class="topbar">
  ระบบซ่อมบำรุงรถยนต์
</div>

<!-- LEFT -->
<aside class="sidebar">

<button onclick="openModal()">+ เพิ่มรายการ</button>

<select id="vehicleSelect"></select>

<button onclick="loadRepairs(vehicleSelect.value)">โหลดข้อมูล</button>

<button class="danger" onclick="confirmDeleteAll()">ลบรถทั้งหมด</button>

</aside>

<!-- RIGHT -->
<main class="main">

<input id="searchInput" placeholder="ค้นหา..." style="width:300px;margin-bottom:10px">

<table class="table">
<thead>
<tr>
<th>วันที่</th>
<th>รถ</th>
<th>ระบบ</th>
<th>อาการ</th>
<th>ช่าง</th>
<th>ค่าใช้จ่าย</th>
<th>ดู</th>
<th>ลบ</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

</main>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-box">

<h3>บันทึกการซ่อม</h3>

<div class="form-grid">
<input type="date" id="date">
<input id="mileage" placeholder="เลขไมล์">
<input id="jobNo" placeholder="เลขที่ใบงาน">
<input id="system" placeholder="ระบบ">
<input id="technician" placeholder="ช่าง">
<textarea id="symptoms" placeholder="อาการ"></textarea>
<textarea id="parts" placeholder="อะไหล่"></textarea>
<input type="number" id="partsCost" placeholder="ค่าอะไหล่">
<input type="number" id="laborCost" placeholder="ค่าแรง">
</div>

<br>
<button onclick="save()">บันทึก</button>
<button class="danger" onclick="closeModal()">ยกเลิก</button>

</div>
</div>

<!-- DETAIL -->
<div class="modal" id="detailModal">
<div class="modal-box">
<h3>รายละเอียด</h3>
<div id="detailContent"></div>
<button onclick="detailModal.style.display='none'">ปิด</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain: "vehicle-maintenance-64890.firebaseapp.com",
  projectId: "vehicle-maintenance-64890",
});
const db = firebase.firestore();

const modal = document.getElementById("modal");
const detailModal = document.getElementById("detailModal");
const vehicleSelect = document.getElementById("vehicleSelect");
const tbody = document.getElementById("tbody");
const searchInput = document.getElementById("searchInput");

let allRepairs=[];

function openModal(){
  modal.style.display="flex";
  date.value = new Date().toISOString().split("T")[0];
}
function closeModal(){modal.style.display="none"}

/* โหลดรถ */
function loadVehicles(){
  db.collection("vehicles").onSnapshot(s=>{
    vehicleSelect.innerHTML="";
    s.forEach(d=>{
      const o=document.createElement("option");
      o.value=d.id;
      o.textContent=d.id;
      vehicleSelect.appendChild(o);
    });
    if(vehicleSelect.value) loadRepairs(vehicleSelect.value);
  });
}
vehicleSelect.onchange=()=>loadRepairs(vehicleSelect.value);

/* โหลดรายการ */
function loadRepairs(v){
  db.collection("vehicles").doc(v).collection("repairs")
  .onSnapshot(s=>{
    allRepairs=[];
    s.forEach(doc=>{
      let r=doc.data();
      r._id=doc.id;
      allRepairs.push(r);
    });

    // เรียงล่าสุดก่อน
    allRepairs.sort((a,b)=>{
      return new Date(b["วันที่"]) - new Date(a["วันที่"]);
    });

    renderTable(allRepairs,v);
  });
}

/* render */
function renderTable(list,v){
  tbody.innerHTML="";
  list.forEach(r=>{
    const cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);

    tbody.innerHTML+=`
<tr>
<td>${r["วันที่"]||""}</td>
<td>${v}</td>
<td>${r["ระบบที่ซ่อม"]||""}</td>
<td>${r["อาการเสีย"]||""}</td>
<td>${r["ช่างผู้รับผิดชอบ"]||""}</td>
<td>${cost}</td>
<td><button onclick='openDetail(${JSON.stringify(r).replace(/'/g,"&#39;")})'>ดู</button></td>
<td><button class="danger" onclick="deleteItem('${v}','${r._id}')">ลบ</button></td>
</tr>`;
  });
}

/* ค้นหา */
searchInput.oninput=()=>{
  const q=searchInput.value.toLowerCase();
  const res=allRepairs.filter(r=>
    (r["ระบบที่ซ่อม"]||"").toLowerCase().includes(q) ||
    (r["อาการเสีย"]||"").toLowerCase().includes(q)
  );
  renderTable(res,vehicleSelect.value);
};

/* บันทึก */
function save(){
  const key=vehicleSelect.value;
  if(!key){ alert("เลือกรถก่อน"); return; }

  db.collection("vehicles").doc(key).collection("repairs").add({
    "วันที่":date.value,
    "เลขไมล์":mileage.value,
    "เลขที่ใบงาน":jobNo.value,
    "ระบบที่ซ่อม":system.value,
    "อาการเสีย":symptoms.value,
    "อะไหล่ที่เปลี่ยน":parts.value,
    "ช่างผู้รับผิดชอบ":technician.value,
    "ค่าอะไหล่":partsCost.value,
    "ค่าแรง":laborCost.value
  }).then(closeModal);
}

/* ลบ */
function deleteItem(v,id){
  db.collection("vehicles").doc(v).collection("repairs").doc(id).delete();
}

/* ลบทั้งหมด */
async function confirmDeleteAll(){
  const v=vehicleSelect.value;
  const ref=db.collection("vehicles").doc(v);
  const snap=await ref.collection("repairs").get();
  const batch=db.batch();
  snap.forEach(d=>batch.delete(d.ref));
  await batch.commit();
  await ref.delete();
}

/* detail */
function openDetail(d){
  let html="";
  for(let k in d){
    if(k==="_id") continue;
    html+=`<p><b>${k}:</b> ${d[k]||"-"}</p>`;
  }
  detailContent.innerHTML=html;
  detailModal.style.display="flex";
}

loadVehicles();
</script>

</body>
</html>
