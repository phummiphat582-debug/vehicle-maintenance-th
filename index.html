<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>SC THE ADVENTURE | GitHub Maintenance</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg:#0d1117;
  --panel:#161b22;
  --border:#30363d;
  --text:#c9d1d9;
  --sub:#8b949e;
  --green:#238636;
  --red:#da3633;
}

/* layout */
body{
  margin:0;
  display:flex;
  font-family:Segoe UI;
  background:var(--bg);
  color:var(--text);
}

/* sidebar */
.sidebar{
  width:260px;
  background:#010409;
  border-right:1px solid var(--border);
  padding:20px;
}

.repo{
  padding:10px;
  cursor:pointer;
  border-radius:6px;
  margin-bottom:6px;
}

.repo:hover{
  background:#161b22;
}

.repo.active{
  background:#238636;
  color:#fff;
}

/* main */
.main{
  flex:1;
  padding:20px;
}

/* header */
.top{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}

input{
  background:#0d1117;
  border:1px solid var(--border);
  color:#fff;
  padding:8px;
  border-radius:6px;
}

/* commit */
.commit{
  border-left:2px solid var(--border);
  padding-left:20px;
  margin-bottom:20px;
  position:relative;
}

.commit::before{
  content:"";
  width:10px;
  height:10px;
  background:#238636;
  border-radius:50%;
  position:absolute;
  left:-6px;
  top:5px;
}

.commit.red::before{
  background:#da3633;
}

.commit small{
  color:var(--sub);
}

/* button */
.btn{
  background:#238636;
  border:none;
  color:#fff;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
}

.btn-danger{
  background:#da3633;
}

/* modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-box{
  background:#161b22;
  padding:20px;
  border-radius:10px;
  width:400px;
}

textarea{
  width:100%;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="sidebar">
  <h3>🚗 Vehicles</h3>
  <div id="vehicleList"></div>
</div>

<div class="main">
  <div class="top">
    <h2 id="title">เลือกคัน</h2>
    <div>
      <input id="search" placeholder="search...">
      <button class="btn" onclick="openModal()">+ Add</button>
    </div>
  </div>

  <div id="log"></div>
</div>

<!-- modal -->
<div class="modal" id="modal">
<div class="modal-box">
  <h3>New Repair</h3>
  <input type="date" id="date"><br><br>
  <input id="system" placeholder="ระบบ"><br><br>
  <textarea id="symptoms" placeholder="อาการ"></textarea><br><br>
  <input id="partsCost" placeholder="ค่าอะไหล่"><br><br>
  <input id="laborCost" placeholder="ค่าแรง"><br><br>
  <button class="btn" onclick="save()">Save</button>
</div>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain: "vehicle-maintenance-64890.firebaseapp.com",
  projectId: "vehicle-maintenance-64890",
});

const db = firebase.firestore();

let selectedVehicle=null;
let all=[];

/* โหลดรถ */
db.collection("vehicles").onSnapshot(s=>{
  vehicleList.innerHTML="";
  let first=null;

  s.forEach(d=>{
    if(!first) first=d.id;

    const div=document.createElement("div");
    div.className="repo";
    div.innerText=d.id;

    div.onclick=()=>{
      document.querySelectorAll(".repo")
      .forEach(x=>x.classList.remove("active"));

      div.classList.add("active");
      selectedVehicle=d.id;
      title.innerText=d.id;

      load(d.id);
    };

    vehicleList.appendChild(div);
  });

  if(first){
    vehicleList.children[0].click();
  }
});

/* โหลด repair */
function load(v){
  db.collection("vehicles").doc(v).collection("repairs")
  .onSnapshot(s=>{
    all=[];
    s.forEach(doc=>{
      let r=doc.data();
      r._id=doc.id;
      all.push(r);
    });

    all.sort((a,b)=>new Date(b["วันที่"])-new Date(a["วันที่"]));
    render(all);
  });
}

/* render */
function render(list){
  log.innerHTML="";

  list.forEach(r=>{
    let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);

    let danger = cost > 5000 ? "red" : "";

    log.innerHTML+=`
    <div class="commit ${danger}">
      <b>${r["ระบบที่ซ่อม"]||"-"}</b><br>
      ${r["อาการเสีย"]||"-"}<br>
      💰 ${cost.toLocaleString()} บาท<br>
      <small>${r["วันที่"]||"-"}</small><br>
      <button class="btn-danger" onclick="del('${r._id}')">ลบ</button>
    </div>`;
  });
}

/* save */
function save(){
  if(!selectedVehicle) return alert("เลือกคันก่อน");

  db.collection("vehicles").doc(selectedVehicle)
  .collection("repairs")
  .add({
    "วันที่":date.value,
    "ระบบที่ซ่อม":system.value,
    "อาการเสีย":symptoms.value,
    "ค่าอะไหล่":partsCost.value,
    "ค่าแรง":laborCost.value,
    "เวลาบันทึก":new Date()
  });

  modal.style.display="none";
}

/* delete */
function del(id){
  db.collection("vehicles").doc(selectedVehicle)
  .collection("repairs").doc(id).delete();
}

/* search */
search.oninput=()=>{
  let q=search.value.toLowerCase();
  let res=all.filter(r=>
    (r["ระบบที่ซ่อม"]||"").toLowerCase().includes(q) ||
    (r["อาการเสีย"]||"").toLowerCase().includes(q)
  );
  render(res);
};

function openModal(){modal.style.display="flex";}
</script>

</body>
</html>
