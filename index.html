<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>SC MAINTENANCE SYSTEM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#0a0f1a;
  --panel:#111827;
  --card:#020617;
  --text:#e5e7eb;
  --sub:#94a3b8;
  --primary:#2563eb;
  --danger:#dc2626;
  --border:#1f2937;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Segoe UI;
  background:var(--bg);
  color:var(--text);
}

/* LAYOUT */
.app{
  display:flex;
  height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:260px;
  background:#020617;
  border-right:1px solid var(--border);
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.sidebar h2{
  margin:0 0 20px;
  font-size:18px;
  color:#60a5fa;
}

/* MAIN */
.main{
  flex:1;
  padding:25px;
  overflow:auto;
}

/* TOPBAR */
.topbar{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

/* CARD */
.card{
  background:var(--panel);
  padding:20px;
  border-radius:14px;
  border:1px solid var(--border);
}

/* INPUT */
input,select,textarea{
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#020617;
  color:#fff;
  width:100%;
}

/* BUTTON */
button{
  padding:12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:var(--primary);
  color:#fff;
}
button.danger{
  background:var(--danger);
}

/* TABLE */
.table{
  width:100%;
  border-collapse:collapse;
}

th{
  text-align:left;
  padding:14px;
  background:#020617;
  color:#94a3b8;
}

td{
  padding:14px;
  border-top:1px solid var(--border);
}

tr:hover{
  background:rgba(37,99,235,.1);
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-box{
  width:95%;
  max-width:900px;
  background:#020617;
  padding:25px;
  border-radius:14px;
  border:1px solid var(--border);
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
  margin:15px 0;
}

.detail-row{
  display:grid;
  grid-template-columns:200px 1fr;
  border-bottom:1px dashed var(--border);
  padding:8px 0;
}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<aside class="sidebar">
  <h2>MAINTENANCE</h2>

  <button onclick="openModal()">+ เพิ่มรายการ</button>

  <select id="vehicleSelect"></select>

  <button onclick="loadRepairs(vehicleSelect.value)">โหลดข้อมูล</button>

  <button class="danger" onclick="confirmDeleteAll()">ลบทั้งหมด</button>
</aside>

<!-- MAIN -->
<main class="main">

  <div class="topbar">
    <input id="searchInput" placeholder="ค้นหา...">
    <button onclick="searchRepairs()">ค้นหา</button>
    <button onclick="resetSearch()">รีเซ็ต</button>
  </div>

  <div class="card">
    <table class="table">
      <thead>
        <tr>
          <th>วันที่</th>
          <th>รถ</th>
          <th>ระบบ</th>
          <th>อาการ</th>
          <th>ช่าง</th>
          <th>ค่าใช้จ่าย</th>
          <th>ดู</th>
          <th>ลบ</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

</main>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-box">
<h2>บันทึกการซ่อม</h2>

<div class="form-grid">
<input id="plate" placeholder="ทะเบียน">
<input id="brand" placeholder="ยี่ห้อ">
<input id="model" placeholder="รุ่น">
<input type="date" id="date">
<input id="mileage" placeholder="เลขไมล์">
<input id="jobNo" placeholder="เลขที่ใบงาน">
<input id="system" placeholder="ระบบที่ซ่อม">
<input id="technician" placeholder="ช่าง">
<input id="approver" placeholder="ผู้อนุมัติ">
<textarea id="symptoms" placeholder="อาการ"></textarea>
<textarea id="parts" placeholder="อะไหล่"></textarea>
<textarea id="note" placeholder="หมายเหตุ"></textarea>
<input type="number" id="partsCost" placeholder="ค่าอะไหล่">
<input type="number" id="laborCost" placeholder="ค่าแรง">
</div>

<button onclick="save()">บันทึก</button>
<button class="danger" onclick="closeModal()">ยกเลิก</button>

</div>
</div>

<!-- DETAIL -->
<div class="modal" id="detailModal">
<div class="modal-box">
<h2>รายละเอียด</h2>
<div id="detailContent"></div>
<button class="danger" onclick="detailModal.style.display='none'">ปิด</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain: "vehicle-maintenance-64890.firebaseapp.com",
  projectId: "vehicle-maintenance-64890",
});
const db = firebase.firestore();

const modal = document.getElementById("modal");
const detailModal = document.getElementById("detailModal");

const vehicleSelect = document.getElementById("vehicleSelect");
const tbody = document.getElementById("tbody");
const searchInput = document.getElementById("searchInput");

let allRepairs=[];

function openModal(){modal.style.display="flex"}
function closeModal(){modal.style.display="none"}

function loadVehicles(){
  db.collection("vehicles").onSnapshot(s=>{
    vehicleSelect.innerHTML="";
    s.forEach(d=>{
      const o=document.createElement("option");
      o.value=d.id;
      o.textContent=d.id;
      vehicleSelect.appendChild(o);
    });
    if(vehicleSelect.value) loadRepairs(vehicleSelect.value);
  });
}
vehicleSelect.onchange=()=>loadRepairs(vehicleSelect.value);

function loadRepairs(v){
  db.collection("vehicles").doc(v).collection("repairs")
  .onSnapshot(s=>{
    allRepairs=[];
    s.forEach(doc=>{
      let r=doc.data();
      r._id=doc.id;
      allRepairs.push(r);
    });
    renderTable(allRepairs,v);
  });
}

function renderTable(list,v){
  tbody.innerHTML="";
  list.forEach(r=>{
    const cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);
    tbody.innerHTML+=`
<tr>
<td>${r["วันที่"]||""}</td>
<td>${v}</td>
<td>${r["ระบบที่ซ่อม"]||""}</td>
<td>${r["อาการเสีย"]||""}</td>
<td>${r["ช่างผู้รับผิดชอบ"]||""}</td>
<td>${cost}</td>
<td><button onclick='openDetail(${JSON.stringify(r).replace(/'/g,"&#39;")})'>ดู</button></td>
<td><button class="danger" onclick="deleteItem('${v}','${r._id}')">ลบ</button></td>
</tr>`;
  });
}

function searchRepairs(){
  const q=searchInput.value.toLowerCase();
  const res=allRepairs.filter(r=>
    (r["ระบบที่ซ่อม"]||"").toLowerCase().includes(q) ||
    (r["อาการเสีย"]||"").toLowerCase().includes(q)
  );
  renderTable(res,vehicleSelect.value);
}

function resetSearch(){
  searchInput.value="";
  renderTable(allRepairs,vehicleSelect.value);
}

function save(){
  const key=plate.value+" "+brand.value+" "+model.value;
  const ref=db.collection("vehicles").doc(key);
  ref.set({updated:new Date()},{merge:true});

  ref.collection("repairs").add({
    "วันที่":date.value,
    "เลขไมล์":mileage.value,
    "เลขที่ใบงาน":jobNo.value,
    "ระบบที่ซ่อม":system.value,
    "อาการเสีย":symptoms.value,
    "อะไหล่ที่เปลี่ยน":parts.value,
    "ช่างผู้รับผิดชอบ":technician.value,
    "ผู้อนุมัติ":approver.value,
    "หมายเหตุ":note.value,
    "ค่าอะไหล่":partsCost.value,
    "ค่าแรง":laborCost.value
  }).then(()=>{
    closeModal();
  });
}

function deleteItem(v,id){
  db.collection("vehicles").doc(v).collection("repairs").doc(id).delete();
}

async function confirmDeleteAll(){
  const v=vehicleSelect.value;
  const ref=db.collection("vehicles").doc(v);
  const snap=await ref.collection("repairs").get();
  const batch=db.batch();
  snap.forEach(d=>batch.delete(d.ref));
  await batch.commit();
  await ref.delete();
}

function openDetail(d){
  let html="";
  for(let k in d){
    if(k==="_id") continue;
    html+=`<div class="detail-row"><b>${k}</b><div>${d[k]||"-"}</div></div>`;
  }
  detailContent.innerHTML=html;
  detailModal.style.display="flex";
}

loadVehicles();
</script>

</body>
</html>
