<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>SC THE ADVENTURE | GitHub Maintenance</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg:#0d1117;
  --panel:#161b22;
  --border:#30363d;
  --text:#c9d1d9;
  --sub:#8b949e;
  --green:#238636;
  --red:#da3633;
}

body{
  margin:0;
  display:flex;
  font-family:Segoe UI;
  background:var(--bg);
  color:var(--text);
}

/* sidebar */
.sidebar{
  width:260px;
  background:#010409;
  border-right:1px solid var(--border);
  padding:20px;
}

.repo{
  padding:10px;
  cursor:pointer;
  border-radius:6px;
  margin-bottom:6px;
}
.repo:hover{background:#161b22;}
.repo.active{background:#238636;color:#fff;}

/* main */
.main{flex:1;padding:20px;}

.top{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}

input,textarea{
  background:#0d1117;
  border:1px solid var(--border);
  color:#fff;
  padding:8px;
  border-radius:6px;
  width:100%;
}

textarea{min-height:80px;}

/* commit */
.commit{
  border-left:2px solid var(--border);
  padding:15px 20px;
  margin-bottom:20px;
  position:relative;
  background:#161b22;
  border-radius:6px;
}

.commit::before{
  content:"";
  width:10px;height:10px;
  background:#238636;
  border-radius:50%;
  position:absolute;
  left:-6px;top:10px;
}

.commit.red::before{background:#da3633;}

hr{
  border:none;
  border-top:1px solid var(--border);
  margin:10px 0;
}

/* button */
.btn{
  background:#238636;
  border:none;
  color:#fff;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
}
.btn-danger{background:#da3633;}

/* modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.8);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-box{
  background:#161b22;
  padding:20px;
  border-radius:10px;
  width:500px;
  max-height:90vh;
  overflow:auto;
}
</style>
</head>

<body>

<div class="sidebar">
  <h3>🚗 Vehicles</h3>
  <div id="vehicleList"></div>
</div>

<div class="main">
  <div class="top">
    <h2 id="title">เลือกคัน</h2>
    <div style="display:flex; gap:10px;">
      <input id="search" placeholder="ค้นหา...">
      <button class="btn" onclick="openModal()">+ เพิ่ม</button>
    </div>
  </div>

  <div id="log"></div>
</div>

<!-- modal -->
<div class="modal" id="modal">
<div class="modal-box">

<h3>📝 เพิ่มรายการซ่อม</h3>

<h4>📅 ข้อมูลพื้นฐาน</h4>
<input type="date" id="date">
<input id="mileage" placeholder="เลขไมล์">
<input id="jobNo" placeholder="เลขที่ใบงาน">

<h4>🔧 รายละเอียดงาน</h4>
<input id="system" placeholder="ระบบที่ซ่อม">
<textarea id="symptoms" placeholder="อาการเสีย"></textarea>
<textarea id="parts" placeholder="อะไหล่ที่เปลี่ยน"></textarea>

<h4>👨‍🔧 ผู้เกี่ยวข้อง</h4>
<input id="technician" placeholder="ช่าง">
<input id="approver" placeholder="ผู้อนุมัติ">

<h4>💰 ค่าใช้จ่าย</h4>
<input type="number" id="partsCost" placeholder="ค่าอะไหล่">
<input type="number" id="laborCost" placeholder="ค่าแรง">

<h4>📌 หมายเหตุ</h4>
<textarea id="note"></textarea>

<br>
<button class="btn" onclick="save()">💾 บันทึก</button>
<button class="btn-danger" onclick="closeModal()">❌ ยกเลิก</button>

</div>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain: "vehicle-maintenance-64890.firebaseapp.com",
  projectId: "vehicle-maintenance-64890",
});

const db = firebase.firestore();

let selectedVehicle=null;
let all=[];

/* โหลดรถ */
db.collection("vehicles").onSnapshot(s=>{
  vehicleList.innerHTML="";
  let first=null;

  s.forEach(d=>{
    if(!first) first=d.id;

    const div=document.createElement("div");
    div.className="repo";
    div.innerText=d.id;

    div.onclick=()=>{
      document.querySelectorAll(".repo")
        .forEach(x=>x.classList.remove("active"));

      div.classList.add("active");
      selectedVehicle=d.id;
      title.innerText=d.id;

      load(d.id);
    };

    vehicleList.appendChild(div);
  });

  if(first){
    vehicleList.children[0].click();
  }
});

/* โหลดรายการ */
function load(v){
  db.collection("vehicles").doc(v).collection("repairs")
  .onSnapshot(s=>{
    all=[];
    s.forEach(doc=>{
      let r=doc.data();
      r._id=doc.id;
      all.push(r);
    });

    all.sort((a,b)=>new Date(b["วันที่"])-new Date(a["วันที่"]));
    render(all);
  });
}

/* render */
function render(list){
  log.innerHTML="";

  list.forEach(r=>{
    let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);
    let danger = cost > 5000 ? "red" : "";

    log.innerHTML+=`
    <div class="commit ${danger}">
      
      <b>🔧 ${r["ระบบที่ซ่อม"]||"-"}</b>
      <small> (${r["วันที่"]||"-"})</small>
      <hr>

      🧠 <b>อาการ:</b> ${r["อาการเสีย"]||"-"}<br>
      🧩 <b>อะไหล่:</b> ${r["อะไหล่ที่เปลี่ยน"]||"-"}<br>

      <hr>

      👨‍🔧 <b>ช่าง:</b> ${r["ช่างผู้รับผิดชอบ"]||"-"}<br>
      🧾 <b>ใบงาน:</b> ${r["เลขที่ใบงาน"]||"-"}<br>
      📏 <b>เลขไมล์:</b> ${r["เลขไมล์"]||"-"}<br>

      <hr>

      💰 <b>ค่าใช้จ่าย:</b> ${cost.toLocaleString()} บาท

      <hr>

      📌 ${r["หมายเหตุ"]||"-"}

      <br><br>
      <button class="btn-danger" onclick="del('${r._id}')">ลบ</button>
    </div>`;
  });
}

/* save */
function save(){
  if(!selectedVehicle) return alert("เลือกคันก่อน");

  db.collection("vehicles").doc(selectedVehicle)
  .collection("repairs")
  .add({
    "วันที่":date.value,
    "เลขไมล์":mileage.value,
    "เลขที่ใบงาน":jobNo.value,
    "ระบบที่ซ่อม":system.value,
    "อาการเสีย":symptoms.value,
    "อะไหล่ที่เปลี่ยน":parts.value,
    "ช่างผู้รับผิดชอบ":technician.value,
    "ผู้อนุมัติ":approver.value,
    "หมายเหตุ":note.value,
    "ค่าอะไหล่":partsCost.value,
    "ค่าแรง":laborCost.value,
    "เวลาบันทึก":new Date()
  });

  closeModal();
  clearForm();
}

/* delete */
function del(id){
  db.collection("vehicles").doc(selectedVehicle)
  .collection("repairs").doc(id).delete();
}

/* search */
search.oninput=()=>{
  let q=search.value.toLowerCase();

  let res=all.filter(r=>
    (r["ระบบที่ซ่อม"]||"").toLowerCase().includes(q) ||
    (r["อาการเสีย"]||"").toLowerCase().includes(q) ||
    (r["ช่างผู้รับผิดชอบ"]||"").toLowerCase().includes(q) ||
    (r["เลขที่ใบงาน"]||"").toLowerCase().includes(q) ||
    (r["อะไหล่ที่เปลี่ยน"]||"").toLowerCase().includes(q) ||
    (r["หมายเหตุ"]||"").toLowerCase().includes(q)
  );

  render(res);
};

/* modal */
function openModal(){modal.style.display="flex";}
function closeModal(){modal.style.display="none";}

/* clear */
function clearForm(){
  document.querySelectorAll("#modal input, #modal textarea")
    .forEach(e=>e.value="");
}
</script>

</body>
</html>
