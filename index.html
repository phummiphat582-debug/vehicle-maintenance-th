<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>SC THE ADVENTURE | ระบบซ่อมบำรุงรถยนต์</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --primary:#2563eb;
  --primary-dark:#1e40af;
  --danger:#dc2626;
  --bg:#0f172a;
  --card:#111827;
  --text:#e5e7eb;
  --sub:#94a3b8;
  --border:#1f2937;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Segoe UI,Arial;
  background:linear-gradient(135deg,#020617,#0f172a);
  color:var(--text);
}

/* HEADER */
header{
  padding:24px 40px;
  font-size:22px;
  font-weight:700;
  background:rgba(15,23,42,.7);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}

/* CONTAINER */
.container{
  max-width:1700px;
  margin:auto;
  padding:30px;
}

/* CARD */
.card{
  background:rgba(17,24,39,.9);
  border:1px solid var(--border);
  border-radius:20px;
  padding:24px;
  margin-bottom:25px;
  box-shadow:0 20px 40px rgba(0,0,0,.6);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:18px;
}

/* INPUT */
input,select,textarea{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid var(--border);
  background:#020617;
  color:#fff;
}

/* BUTTON */
button{
  padding:14px;
  border:none;
  border-radius:14px;
  font-weight:600;
  cursor:pointer;
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  color:#fff;
  transition:.2s;
}
button:hover{transform:translateY(-2px)}
button:active{transform:scale(.95)}

button.danger{
  background:linear-gradient(135deg,#dc2626,#7f1d1d);
}

/* TABLE */
.table{
  width:100%;
  border-collapse:collapse;
}

th{
  text-align:left;
  padding:16px;
  background:#020617;
  color:#94a3b8;
  font-size:13px;
}

td{
  padding:16px;
  border-top:1px solid var(--border);
}

tr:hover{
  background:rgba(37,99,235,.08);
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-box{
  width:95%;
  max-width:1400px;
  background:#020617;
  border-radius:20px;
  padding:30px;
  border:1px solid var(--border);
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:20px;
  margin:20px 0;
}

.detail-row{
  display:grid;
  grid-template-columns:220px 1fr;
  gap:10px;
  padding:10px 0;
  border-bottom:1px dashed var(--border);
}

.detail-row b{
  color:#60a5fa;
}
</style>
</head>

<body>

<header>SC THE ADVENTURE | ระบบซ่อมบำรุงรถยนต์</header>

<div class="container">

<div class="card">
  <div class="grid">
    <select id="vehicleSelect"></select>
    <button onclick="openModal()">เพิ่มรายการซ่อม</button>
    <button class="danger" onclick="confirmDeleteAll()">ลบรถทั้งหมด</button>
  </div>
</div>

<div class="card grid">
  <input id="searchInput" placeholder="ค้นหา (ระบบ / อาการ / ช่าง / ใบงาน)">
  <button onclick="searchRepairs()">ค้นหา</button>
  <button class="danger" onclick="resetSearch()">ล้าง</button>
</div>

<div class="card">
<table class="table">
<thead>
<tr>
<th>วันที่</th>
<th>รถ</th>
<th>ระบบ</th>
<th>อาการ</th>
<th>ช่าง</th>
<th>ค่าใช้จ่าย</th>
<th>รายละเอียด</th>
<th>ลบ</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-box">
<h2>บันทึกการซ่อม</h2>

<div class="form-grid">
<input id="plate" placeholder="ทะเบียน">
<input id="brand" placeholder="ยี่ห้อ">
<input id="model" placeholder="รุ่น">
<input type="date" id="date">
<input id="mileage" placeholder="เลขไมล์">
<input id="jobNo" placeholder="เลขที่ใบงาน">
<input id="system" placeholder="ระบบที่ซ่อม">
<input id="technician" placeholder="ช่าง">
<input id="approver" placeholder="ผู้อนุมัติ">
<textarea id="symptoms" placeholder="อาการ"></textarea>
<textarea id="parts" placeholder="อะไหล่"></textarea>
<textarea id="note" placeholder="หมายเหตุ"></textarea>
<input type="number" id="partsCost" placeholder="ค่าอะไหล่">
<input type="number" id="laborCost" placeholder="ค่าแรง">
</div>

<div class="grid">
<button onclick="confirmSave()">บันทึก</button>
<button class="danger" onclick="closeModal()">ยกเลิก</button>
</div>

</div>
</div>

<!-- CONFIRM -->
<div class="modal" id="confirmModal">
<div class="modal-box">
<h3 id="confirmTitle"></h3>
<p id="confirmText"></p>
<div class="grid">
<button onclick="confirmYes()">ยืนยัน</button>
<button class="danger" onclick="closeConfirm()">ยกเลิก</button>
</div>
</div>
</div>

<!-- DETAIL -->
<div class="modal" id="detailModal">
<div class="modal-box">
<h2>รายละเอียด</h2>
<div id="detailContent"></div>
<button class="danger" onclick="detailModal.style.display='none'">ปิด</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain: "vehicle-maintenance-64890.firebaseapp.com",
  projectId: "vehicle-maintenance-64890",
});
const db = firebase.firestore();

const modal = document.getElementById("modal");
const confirmModal = document.getElementById("confirmModal");
const detailModal = document.getElementById("detailModal");

const vehicleSelect = document.getElementById("vehicleSelect");
const tbody = document.getElementById("tbody");
const searchInput = document.getElementById("searchInput");

let confirmAction=null;
let allRepairs=[];

function openModal(){modal.style.display="flex"}
function closeModal(){modal.style.display="none"}

function openConfirm(t,txt,fn){
  confirmTitle.textContent=t;
  confirmText.textContent=txt;
  confirmAction=fn;
  confirmModal.style.display="flex";
}
function closeConfirm(){confirmModal.style.display="none"}
function confirmYes(){if(confirmAction) confirmAction();closeConfirm()}

function confirmSave(){
  openConfirm("บันทึก","ยืนยัน?",save);
}

function toast(msg){
  const t=document.createElement("div");
  t.textContent=msg;
  t.style.position="fixed";
  t.style.bottom="30px";
  t.style.right="30px";
  t.style.padding="14px 20px";
  t.style.background="#2563eb";
  t.style.color="#fff";
  t.style.borderRadius="10px";
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2000);
}

function loadVehicles(){
  db.collection("vehicles").onSnapshot(s=>{
    vehicleSelect.innerHTML="";
    s.forEach(d=>{
      const o=document.createElement("option");
      o.value=d.id;
      o.textContent=d.id;
      vehicleSelect.appendChild(o);
    });
    if(vehicleSelect.value) loadRepairs(vehicleSelect.value);
  });
}
vehicleSelect.onchange=()=>loadRepairs(vehicleSelect.value);

function loadRepairs(v){
  db.collection("vehicles").doc(v).collection("repairs")
  .onSnapshot(s=>{
    allRepairs=[];
    s.forEach(doc=>{
      let r=doc.data();
      r._id=doc.id;
      allRepairs.push(r);
    });
    renderTable(allRepairs,v);
  });
}

function renderTable(list,v){
  tbody.innerHTML="";
  list.forEach(r=>{
    const cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);
    tbody.innerHTML+=`
<tr>
<td>${r["วันที่"]||""}</td>
<td>${v}</td>
<td>${r["ระบบที่ซ่อม"]||""}</td>
<td>${r["อาการเสีย"]||""}</td>
<td>${r["ช่างผู้รับผิดชอบ"]||""}</td>
<td>${cost}</td>
<td><button onclick='openDetail(${JSON.stringify(r).replace(/'/g,"&#39;")})'>ดู</button></td>
<td><button class="danger" onclick="deleteItem('${v}','${r._id}')">ลบ</button></td>
</tr>`;
  });
}

function searchRepairs(){
  const q=searchInput.value.toLowerCase();
  const res=allRepairs.filter(r=>
    (r["ระบบที่ซ่อม"]||"").toLowerCase().includes(q) ||
    (r["อาการเสีย"]||"").toLowerCase().includes(q)
  );
  renderTable(res,vehicleSelect.value);
}

function resetSearch(){
  searchInput.value="";
  renderTable(allRepairs,vehicleSelect.value);
}

function save(){
  const key=plate.value+" "+brand.value+" "+model.value;
  const ref=db.collection("vehicles").doc(key);
  ref.set({updated:new Date()},{merge:true});

  ref.collection("repairs").add({
    "วันที่":date.value,
    "เลขไมล์":mileage.value,
    "เลขที่ใบงาน":jobNo.value,
    "ระบบที่ซ่อม":system.value,
    "อาการเสีย":symptoms.value,
    "อะไหล่ที่เปลี่ยน":parts.value,
    "ช่างผู้รับผิดชอบ":technician.value,
    "ผู้อนุมัติ":approver.value,
    "หมายเหตุ":note.value,
    "ค่าอะไหล่":partsCost.value,
    "ค่าแรง":laborCost.value
  }).then(()=>{
    closeModal();
    toast("บันทึกสำเร็จ");
  });
}

function deleteItem(v,id){
  openConfirm("ลบ","ยืนยัน?",()=>{
    db.collection("vehicles").doc(v).collection("repairs").doc(id).delete();
  });
}

async function confirmDeleteAll(){
  const v=vehicleSelect.value;
  openConfirm("ลบทั้งหมด","แน่ใจ?",async()=>{
    const ref=db.collection("vehicles").doc(v);
    const snap=await ref.collection("repairs").get();
    const batch=db.batch();
    snap.forEach(d=>batch.delete(d.ref));
    await batch.commit();
    await ref.delete();
  });
}

function openDetail(d){
  let html="";
  for(let k in d){
    if(k==="_id") continue;
    html+=`<div class="detail-row"><b>${k}</b><div>${d[k]||"-"}</div></div>`;
  }
  detailContent.innerHTML=html;
  detailModal.style.display="flex";
}

loadVehicles();
</script>

</body>
</html>
