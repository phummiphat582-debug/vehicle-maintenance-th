<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Maintenance System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI}

/* LAYOUT */
.app{
  display:grid;
  grid-template-columns:260px 1fr;
  grid-template-rows:70px 1fr;
  height:100vh;
}

/* TOP */
.topbar{
  grid-column:1 / span 2;
  background:#2f5b89;
  color:#fff;
  display:flex;
  align-items:center;
  padding:0 20px;
  font-weight:600;
}

/* LEFT */
.sidebar{
  background:#243c5a;
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* RIGHT */
.main{
  background:#d1d5db;
  padding:20px;
  overflow:auto;
}

/* BUTTON */
button{
  padding:10px;
  border:none;
  border-radius:6px;
  background:#1e293b;
  color:#fff;
  cursor:pointer;
  transition:.2s;
}
button:hover{transform:scale(1.05)}
button.danger{background:#dc2626}

/* INPUT */
input,select,textarea{
  padding:10px;
  border-radius:6px;
  border:none;
  width:100%;
}

/* TABLE */
.table{
  width:100%;
  background:#fff;
  border-collapse:collapse;
}
th,td{padding:10px}
th{background:#f3f4f6}
td{border-top:1px solid #e5e7eb}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;

  display:flex;
  justify-content:center;
  align-items:flex-start;

  padding:40px 10px;
  overflow-y:auto;
}

/* BOX */
.modal-box{
  background:#fff;
  padding:20px;
  border-radius:12px;
  width:90%;
  max-width:800px;

  max-height:85vh;
  overflow-y:auto;

  position:relative;
  margin:auto;

  overflow:visible;
}

/* ปุ่มปิด */
.close-btn{
  position:absolute;
  top:-12px;
  right:-12px;

  width:42px;
  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#dc2626;
  color:#fff;
  font-size:18px;

  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,.25);

  transition:.2s;
}
.close-btn:hover{
  transform:scale(1.1) rotate(5deg);
}

/* header sticky */
.modal-box h3{
  position:sticky;
  top:0;
  background:#fff;
  padding-bottom:10px;
}

/* form */
.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:10px;
}

/* detail */
#detailContent p{
  margin:6px 0;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="app">

<div class="topbar">ระบบซ่อมบำรุงรถยนต์</div>

<aside class="sidebar">
<button onclick="openModal()">+ เพิ่มรายการ</button>
<button onclick="vehicleModal.style.display='flex'">+ เพิ่มรถ</button>
<select id="vehicleSelect"></select>
<button class="danger" onclick="confirmDeleteAll()">ลบรถทั้งหมด</button>
</aside>

<main class="main">

<input id="searchInput" placeholder="ค้นหา..." style="width:300px;margin-bottom:10px">

<table class="table">
<thead>
<tr>
<th>วันที่</th>
<th>รถ</th>
<th>ระบบ</th>
<th>อาการ</th>
<th>ช่าง</th>
<th>ดู</th>
<th>ลบ</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

</main>

</div>

<!-- ADD REPAIR -->
<div class="modal" id="modal">
<div class="modal-box">
<button class="close-btn" onclick="closeModal()">✕</button>
<h3>บันทึกการซ่อม</h3>

<div class="form-grid">
<input type="date" id="date">
<input id="mileage" placeholder="เลขไมล์">
<input id="jobNo" placeholder="เลขที่ใบงาน">
<input id="system" placeholder="ระบบ">
<input id="technician" placeholder="ช่าง">
<textarea id="symptoms" placeholder="อาการ"></textarea>
<textarea id="parts" placeholder="อะไหล่"></textarea>
<input type="number" id="partsCost" placeholder="ค่าอะไหล่">
<input type="number" id="laborCost" placeholder="ค่าแรง">
</div>

<br>
<button onclick="confirmSave()">บันทึก</button>
<button class="danger" onclick="closeModal()">ยกเลิก</button>
</div>
</div>

<!-- ADD VEHICLE -->
<div class="modal" id="vehicleModal">
<div class="modal-box">
<button class="close-btn" onclick="vehicleModal.style.display='none'">✕</button>
<h3>เพิ่มรถใหม่</h3>
<input id="vehicleName" placeholder="เช่น กข1234 Toyota">
<br><br>
<button onclick="confirmAddVehicle()">บันทึก</button>
<button class="danger" onclick="vehicleModal.style.display='none'">ยกเลิก</button>
</div>
</div>

<!-- DETAIL -->
<div class="modal" id="detailModal">
<div class="modal-box">
<button class="close-btn" onclick="detailModal.style.display='none'">✕</button>
<h3>รายละเอียด</h3>
<div id="detailContent"></div>
</div>
</div>

<!-- CONFIRM -->
<div class="modal" id="confirmModal">
<div class="modal-box">
<button class="close-btn" onclick="closeConfirm()">✕</button>
<h3 id="confirmTitle"></h3>
<p id="confirmText"></p>
<button onclick="confirmYes()">ยืนยัน</button>
<button class="danger" onclick="closeConfirm()">ยกเลิก</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"YOUR_API_KEY",
  projectId:"vehicle-maintenance-64890"
});
const db=firebase.firestore();

let allRepairs=[],confirmAction=null;

function openModal(){
  modal.style.display="flex";
  date.value=new Date().toISOString().split("T")[0];
}
function closeModal(){modal.style.display="none"}

function openConfirm(t,txt,fn){
  confirmTitle.textContent=t;
  confirmText.textContent=txt;
  confirmAction=fn;
  confirmModal.style.display="flex";
}
function closeConfirm(){confirmModal.style.display="none"}
function confirmYes(){if(confirmAction)confirmAction();closeConfirm()}

function confirmAddVehicle(){
  const name=vehicleName.value.trim();
  if(!name){ openConfirm("ผิดพลาด","กรอกชื่อรถ"); return; }

  openConfirm("เพิ่มรถ","ยืนยัน?",()=>{
    db.collection("vehicles").doc(name).set({created:new Date()})
    .then(()=>{
      vehicleModal.style.display="none";
      vehicleName.value="";
    });
  });
}

function loadVehicles(){
  db.collection("vehicles").onSnapshot(s=>{
    vehicleSelect.innerHTML="";
    s.forEach(d=>{
      let o=document.createElement("option");
      o.value=d.id;
      o.textContent=d.id;
      vehicleSelect.appendChild(o);
    });
    if(vehicleSelect.value) loadRepairs(vehicleSelect.value);
  });
}
vehicleSelect.onchange=()=>loadRepairs(vehicleSelect.value);

function loadRepairs(v){
  db.collection("vehicles").doc(v).collection("repairs")
  .onSnapshot(s=>{
    allRepairs=[];
    s.forEach(doc=>{
      let r=doc.data();r._id=doc.id;
      allRepairs.push(r);
    });
    allRepairs.sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
    renderTable(allRepairs,v);
  });
}

function formatThaiDate(d){
  if(!d)return "";
  return new Date(d).toLocaleDateString("th-TH",{day:"numeric",month:"short",year:"numeric"});
}

function renderTable(list,v){
  tbody.innerHTML="";
  list.forEach(r=>{
    tbody.innerHTML+=`
<tr>
<td>${formatThaiDate(r["วันที่"])}</td>
<td>${v}</td>
<td>${r["ระบบที่ซ่อม"]||""}</td>
<td>${r["อาการเสีย"]||""}</td>
<td>${r["ช่างผู้รับผิดชอบ"]||""}</td>
<td><button onclick='openDetail(${JSON.stringify(r).replace(/'/g,"&#39;")})'>ดู</button></td>
<td><button class="danger" onclick="confirmDelete('${v}','${r._id}')">ลบ</button></td>
</tr>`;
  });
}

/* 🔥 FIX DETAIL (เรียง + ครบ) */
function openDetail(d){

  let cost=(+d["ค่าอะไหล่"]||0)+(+d["ค่าแรง"]||0);

  const fields = [
    ["วันที่","วันที่"],
    ["เลขไมล์","เลขไมล์"],
    ["เลขที่ใบงาน","เลขที่ใบงาน"],
    ["ระบบที่ซ่อม","ระบบที่ซ่อม"],
    ["อาการเสีย","อาการเสีย"],
    ["อะไหล่ที่เปลี่ยน","อะไหล่ที่เปลี่ยน"],
    ["ช่างผู้รับผิดชอบ","ช่างผู้รับผิดชอบ"],
    ["ค่าอะไหล่","ค่าอะไหล่"],
    ["ค่าแรง","ค่าแรง"]
  ];

  let html="";

  fields.forEach(([key,label])=>{
    html += `<p><b>${label}:</b> ${d[key] || "-"}</p>`;
  });

  html += `<hr>`;
  html += `<p><b>รวมค่าใช้จ่าย:</b> ${cost}</p>`;

  detailContent.innerHTML = html;
  detailModal.style.display = "flex";
}

function confirmSave(){ openConfirm("บันทึก","ยืนยัน?",save); }

function save(){
  let v=vehicleSelect.value;
  db.collection("vehicles").doc(v).collection("repairs").add({
    "วันที่":date.value,
    "timestamp":new Date(date.value).getTime(),
    "เลขไมล์":mileage.value,
    "เลขที่ใบงาน":jobNo.value,
    "ระบบที่ซ่อม":system.value,
    "อาการเสีย":symptoms.value,
    "อะไหล่ที่เปลี่ยน":parts.value,
    "ช่างผู้รับผิดชอบ":technician.value,
    "ค่าอะไหล่":partsCost.value,
    "ค่าแรง":laborCost.value
  }).then(closeModal);
}

function confirmDelete(v,id){
  openConfirm("ลบ","ยืนยัน?",()=>{
    db.collection("vehicles").doc(v).collection("repairs").doc(id).delete();
  });
}

function confirmDeleteAll(){
  let v=vehicleSelect.value;
  openConfirm("ลบทั้งหมด","แน่ใจ?",async()=>{
    let ref=db.collection("vehicles").doc(v);
    let snap=await ref.collection("repairs").get();
    let batch=db.batch();
    snap.forEach(d=>batch.delete(d.ref));
    await batch.commit();
    await ref.delete();
  });
}

loadVehicles();
</script>

</body>
</html>
