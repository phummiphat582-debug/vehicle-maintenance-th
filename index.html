<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>SC Maintenance PRO</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
:root{
  --primary:#4f46e5;
  --danger:#dc2626;
}
body{margin:0;font-family:Segoe UI;background:#f3f4f6}

/* header */
.header{
  background:var(--primary);
  color:#fff;
  padding:20px;
  font-size:22px;
}

/* vehicle */
.vehicle-bar{
  display:flex;
  gap:10px;
  padding:10px 20px;
}
.vehicle{
  padding:8px 12px;
  background:#ddd;
  border-radius:10px;
  cursor:pointer;
}
.vehicle.active{
  background:var(--primary);
  color:#fff;
}

/* list */
.list{padding:20px}
.item{
  background:#fff;
  padding:15px;
  border-radius:12px;
  margin-bottom:10px;
  line-height:1.6;
}

/* button */
.btn{
  background:var(--primary);
  color:#fff;
  padding:12px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  box-shadow:0 6px 15px rgba(0,0,0,.2);
  transition:.15s;
}
.btn:active{transform:scale(.96)}
.btn-danger{
  background:var(--danger);
}

/* modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-box{
  background:#fff;
  border-radius:20px;
  width:90%;
  max-width:800px;
  height:90vh;
  display:flex;
  flex-direction:column;
  padding:20px;
}

/* form */
.form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  flex:1;
}

.full{grid-column:span 2}

input,textarea{
  padding:12px;
  border-radius:12px;
  border:1px solid #ddd;
  transition:.2s;
}
input:focus,textarea:focus{
  outline:none;
  border-color:var(--primary);
  box-shadow:0 0 0 2px rgba(79,70,229,.2);
}

/* confirm */
.confirm{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
}
.confirm-box{
  background:#fff;
  padding:20px;
  border-radius:20px;
  width:300px;
  text-align:center;
  animation:pop .2s ease;
}
@keyframes pop{
  from{transform:scale(.8);opacity:0}
  to{transform:scale(1);opacity:1}
}
</style>
</head>

<body>

<div class="header">🚗 SC Maintenance PRO</div>

<div class="vehicle-bar" id="vehicleList"></div>

<div style="padding:20px">
  <button class="btn" onclick="openModal()">➕ เพิ่มรายการ</button>
</div>

<div class="list" id="log"></div>

<!-- modal -->
<div class="modal" id="modal">
<div class="modal-box">

<h3>เพิ่มรายการซ่อม</h3>

<div class="form">

<input type="date" id="date">
<input id="mileage" placeholder="เลขไมล์">

<input id="jobNo" placeholder="ใบงาน">
<input id="system" placeholder="ระบบ">

<textarea id="symptoms" class="full" placeholder="อาการ"></textarea>
<textarea id="parts" class="full" placeholder="อะไหล่"></textarea>

<input id="technician" placeholder="ช่าง">
<input id="approver" placeholder="ผู้อนุมัติ">

<input id="partsCost" placeholder="ค่าอะไหล่">
<input id="laborCost" placeholder="ค่าแรง">

<textarea id="note" class="full" placeholder="หมายเหตุ"></textarea>

</div>

<div style="display:flex; gap:10px;">
  <button class="btn" onclick="confirmSave()">💾 บันทึก</button>
  <button class="btn btn-danger" onclick="closeModal()">❌ ยกเลิก</button>
</div>

</div>
</div>

<!-- confirm -->
<div class="confirm" id="confirmBox">
  <div class="confirm-box">
    <h3>ยืนยันการบันทึก?</h3><br>
    <button class="btn" onclick="save()">ยืนยัน</button>
    <button class="btn btn-danger" onclick="closeConfirm()">ยกเลิก</button>
  </div>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain: "vehicle-maintenance-64890.firebaseapp.com",
  projectId: "vehicle-maintenance-64890",
});

const db=firebase.firestore();

let selectedVehicle=null;
let unsubscribe=null;

/* โหลดรถ */
db.collection("vehicles").onSnapshot(s=>{
  vehicleList.innerHTML="";
  let first=null;

  s.forEach(d=>{
    if(!first) first=d.id;

    let div=document.createElement("div");
    div.className="vehicle";
    div.innerText=d.id;

    div.onclick=()=>{
      document.querySelectorAll(".vehicle")
        .forEach(v=>v.classList.remove("active"));

      div.classList.add("active");
      selectedVehicle=d.id;
      load(d.id);
    };

    vehicleList.appendChild(div);
  });

  if(first) vehicleList.children[0].click();
});

/* โหลดข้อมูล */
function load(v){
  if(unsubscribe) unsubscribe();

  unsubscribe = db.collection("vehicles")
    .doc(v).collection("repairs")
    .onSnapshot(s=>{
      log.innerHTML="";

      s.forEach(doc=>{
        let r=doc.data();
        let id=doc.id;

        let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);

        log.innerHTML+=`
        <div class="item">
          📅 ${r["วันที่"]||"-"}<br>
          🔧 ${r["ระบบที่ซ่อม"]||"-"}<br>
          🧠 ${r["อาการเสีย"]||"-"}<br>
          💰 ${cost.toLocaleString()} บาท<br>
          👨‍🔧 ${r["ช่างผู้รับผิดชอบ"]||"-"}<br><br>
          <button class="btn btn-danger" onclick="del('${id}')">ลบ</button>
        </div>`;
      });
    });
}

/* confirm */
function confirmSave(){
  confirmBox.style.display="flex";
}
function closeConfirm(){
  confirmBox.style.display="none";
}

/* save */
function save(){
  confirmBox.style.display="none";

  if(!selectedVehicle) return alert("เลือกคันก่อน");

  db.collection("vehicles").doc(selectedVehicle)
    .collection("repairs")
    .add({
      "วันที่":date.value,
      "เลขไมล์":mileage.value,
      "เลขที่ใบงาน":jobNo.value,
      "ระบบที่ซ่อม":system.value,
      "อาการเสีย":symptoms.value,
      "อะไหล่ที่เปลี่ยน":parts.value,
      "ช่างผู้รับผิดชอบ":technician.value,
      "ผู้อนุมัติ":approver.value,
      "หมายเหตุ":note.value,
      "ค่าอะไหล่":partsCost.value,
      "ค่าแรง":laborCost.value,
      "เวลาบันทึก":new Date()
    });

  closeModal();
}

/* delete */
function del(id){
  db.collection("vehicles")
    .doc(selectedVehicle)
    .collection("repairs")
    .doc(id)
    .delete();
}

/* modal */
function openModal(){modal.style.display="flex";}
function closeModal(){modal.style.display="none";}
</script>

</body>
</html>
