<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>SC Maintenance Enterprise</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg:#f8fafc;
  --card:#ffffff;
  --primary:#4f46e5;
  --border:#e5e7eb;
}

body{
  margin:0;
  font-family:Inter;
  background:var(--bg);
}

/* header */
header{
  padding:18px 25px;
  background:#111827;
  color:#fff;
  font-weight:600;
}

/* container */
.container{
  padding:25px;
  max-width:1400px;
  margin:auto;
}

/* grid */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

/* card */
.card{
  background:var(--card);
  border-radius:14px;
  padding:18px;
  border:1px solid var(--border);
}

/* button */
button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:var(--primary);
  color:#fff;
  cursor:pointer;
}
button.secondary{
  background:#e5e7eb;
  color:#111;
}

/* list */
.item{
  padding:14px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
}

/* input */
input,textarea,select{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid var(--border);
}

/* modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  align-items:center;
  justify-content:center;
  animation:fade .2s;
}
.modal-box{
  background:#fff;
  padding:20px;
  width:500px;
  border-radius:12px;
  animation:pop .25s;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(.9)}to{transform:scale(1)}}
</style>
</head>

<body>

<header>SC MAINTENANCE SYSTEM</header>

<div class="container">

<!-- CONTROL -->
<div class="card grid">
  <select id="vehicleSelect"></select>
  <button onclick="openModal()">Add Record</button>
  <input id="search" placeholder="Search...">
</div>

<!-- LIST -->
<div class="card">
  <div id="list"></div>
</div>

</div>

<!-- FORM MODAL -->
<div class="modal" id="modal">
<div class="modal-box">

<h3>Create Maintenance Record</h3>

<input type="date" id="date">
<input id="mileage" placeholder="Mileage">
<input id="jobNo" placeholder="Job No">
<input id="system" placeholder="System">
<input id="technician" placeholder="Technician">
<input id="approver" placeholder="Approver">
<textarea id="symptoms" placeholder="Symptoms"></textarea>
<textarea id="parts" placeholder="Parts"></textarea>
<textarea id="note" placeholder="Note"></textarea>
<input id="partsCost" placeholder="Parts Cost">
<input id="laborCost" placeholder="Labor Cost">

<div class="grid">
  <button onclick="confirmSave()">Save</button>
  <button class="secondary" onclick="closeModal()">Cancel</button>
</div>

</div>
</div>

<!-- CONFIRM -->
<div class="modal" id="confirm">
<div class="modal-box">
<h3>Confirm Save</h3>
<p>Are you sure?</p>
<button onclick="save()">Confirm</button>
<button class="secondary" onclick="confirm.style.display='none'">Cancel</button>
</div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain:"vehicle-maintenance-64890.firebaseapp.com",
  projectId:"vehicle-maintenance-64890"
});

const db=firebase.firestore();
let all=[];

/* load vehicles */
db.collection("vehicles").onSnapshot(s=>{
  vehicleSelect.innerHTML="";
  s.forEach(d=>{
    vehicleSelect.innerHTML+=`<option>${d.id}</option>`;
  });
  load(vehicleSelect.value);
});

vehicleSelect.onchange=()=>load(vehicleSelect.value);

/* load repairs */
function load(v){
  db.collection("vehicles").doc(v).collection("repairs")
  .onSnapshot(s=>{
    all=[];
    s.forEach(doc=>all.push(doc.data()));
    render(all);
  });
}

/* render */
function render(list){
  list.sort((a,b)=>new Date(b["วันที่"])-new Date(a["วันที่"]));
  listEl="";
  list.innerHTML="";

  list.forEach(r=>{
    let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);

    list.innerHTML+=`
    <div class="item">
      <div>
        <b>${r["ระบบที่ซ่อม"]}</b><br>
        ${r["วันที่"]} | ${r["ช่างผู้รับผิดชอบ"]}
      </div>
      <div>${cost}</div>
    </div>`;
  });
}

/* search */
search.oninput=()=>{
  let q=search.value.toLowerCase();
  render(all.filter(r=>
    (r["ระบบที่ซ่อม"]||"").toLowerCase().includes(q)
  ));
};

/* modal */
function openModal(){modal.style.display="flex";}
function closeModal(){modal.style.display="none";}

/* confirm */
function confirmSave(){confirm.style.display="flex";}

/* save */
function save(){
  let v=vehicleSelect.value;

  db.collection("vehicles").doc(v)
  .collection("repairs")
  .add({
    "วันที่":date.value,
    "เลขไมล์":mileage.value,
    "เลขที่ใบงาน":jobNo.value,
    "ระบบที่ซ่อม":system.value,
    "อาการเสีย":symptoms.value,
    "อะไหล่ที่เปลี่ยน":parts.value,
    "ช่างผู้รับผิดชอบ":technician.value,
    "ผู้อนุมัติ":approver.value,
    "หมายเหตุ":note.value,
    "ค่าอะไหล่":partsCost.value,
    "ค่าแรง":laborCost.value
  });

  modal.style.display="none";
  confirm.style.display="none";
}
</script>

</body>
</html>
