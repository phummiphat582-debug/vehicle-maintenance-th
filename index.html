<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Maintenance Mail UI</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container app">

<!-- SIDEBAR -->
<aside class="sidebar">
  <h1 class="logo">🚗 Maintenance</h1>

  <nav class="main-nav">
    <ul>
      <li class="active">
        <a href="#">รถทั้งหมด</a>
        <a href="#" class="btn btn-primary" onclick="openModal()">+ เพิ่มรายการ</a>

        <ul id="vehicleList"></ul>
      </li>
    </ul>
  </nav>
</aside>

<!-- MAIN -->
<div class="main">

<header class="header">
  <input type="search" placeholder="ค้นหา..." id="search">
</header>

<div class="container">

<!-- LIST -->
<div class="messages">
  <h1 id="currentVehicle">เลือกรถ</h1>
  <ul class="message-list" id="repairList"></ul>
</div>

<!-- DETAIL -->
<section class="message">
  <h2 id="title">รายละเอียด</h2>

  <div class="meta-data" id="meta"></div>

  <div class="body" id="detail"></div>

</section>

</div>

</div>
</div>

<!-- MODAL -->
<div class="modal" id="modal" style="display:none;">
<div style="background:#fff;padding:20px;width:400px;border-radius:10px">

<h3>เพิ่มรายการซ่อม</h3>

<input type="date" id="date">
<input id="system" placeholder="ระบบ">
<textarea id="symptoms" placeholder="อาการ"></textarea>
<input id="technician" placeholder="ช่าง">
<input id="partsCost" placeholder="ค่าอะไหล่">
<input id="laborCost" placeholder="ค่าแรง">

<button onclick="save()">บันทึก</button>
<button onclick="closeModal()">ยกเลิก</button>

</div>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain: "vehicle-maintenance-64890.firebaseapp.com",
  projectId: "vehicle-maintenance-64890",
});

const db = firebase.firestore();

let selectedVehicle=null;

/* โหลดรถ */
db.collection("vehicles").onSnapshot(s=>{
  vehicleList.innerHTML="";

  s.forEach(d=>{
    let v=d.id;

    vehicleList.innerHTML+=`
    <li onclick="loadRepair('${v}')">
      <a href="#">🚗 ${v}</a>
    </li>`;
  });
});

/* โหลดรายการ */
function loadRepair(v){
  selectedVehicle=v;
  currentVehicle.innerText=v;

  db.collection("vehicles").doc(v).collection("repairs")
  .onSnapshot(s=>{
    repairList.innerHTML="";

    s.forEach(doc=>{
      let r=doc.data();
      let id=doc.id;

      repairList.innerHTML+=`
      <li onclick="openDetail('${v}','${id}')">
        <div class="preview">
          <h3>${r["ระบบที่ซ่อม"]||"-"} <small>${r["วันที่"]||""}</small></h3>
          <p>${r["อาการเสีย"]||""}</p>
        </div>
      </li>`;
    });
  });
}

/* รายละเอียด */
function openDetail(v,id){
  db.collection("vehicles").doc(v).collection("repairs").doc(id)
  .get().then(doc=>{
    let r=doc.data();
    let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);

    title.innerText=r["ระบบที่ซ่อม"]||"-";

    meta.innerHTML=`
      👨‍🔧 ${r["ช่างผู้รับผิดชอบ"]||"-"}<br>
      📅 ${r["วันที่"]||"-"}
    `;

    detail.innerHTML=`
      <p><b>อาการ:</b> ${r["อาการเสีย"]||"-"}</p>
      <p><b>ค่าใช้จ่าย:</b> ${cost.toLocaleString()} บาท</p>
      <p><b>หมายเหตุ:</b> ${r["หมายเหตุ"]||"-"}</p>
    `;
  });
}

/* save */
function save(){
  if(!selectedVehicle) return alert("เลือกคันก่อน");

  db.collection("vehicles").doc(selectedVehicle)
  .collection("repairs")
  .add({
    "วันที่":date.value,
    "ระบบที่ซ่อม":system.value,
    "อาการเสีย":symptoms.value,
    "ช่างผู้รับผิดชอบ":technician.value,
    "ค่าอะไหล่":partsCost.value,
    "ค่าแรง":laborCost.value,
    "เวลาบันทึก":new Date()
  });

  closeModal();
}

/* modal */
function openModal(){modal.style.display="flex";}
function closeModal(){modal.style.display="none";}
</script>

</body>
</html>
