<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>SC Maintenance System</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
/* ===== BASE ===== */
body{
  margin:0;
  font-family:Segoe UI;
  background:#0f172a;
  color:#fff;
}

/* ===== LAYOUT ===== */
.app{
  display:flex;
  height:100vh;
}

.sidebar{
  width:220px;
  background:#020617;
  padding:20px;
}

.sidebar h2{
  margin-bottom:20px;
}

.sidebar a{
  display:block;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
}
.sidebar a:hover{
  background:#1e293b;
}

/* ===== MAIN ===== */
.main{
  flex:1;
  padding:20px;
  overflow:auto;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

/* ===== CARD ===== */
.card{
  background:#1e293b;
  padding:20px;
  border-radius:15px;
}

/* ===== VEHICLE ===== */
.vehicle{
  padding:15px;
  background:#1e293b;
  border-radius:12px;
  cursor:pointer;
  transition:.2s;
}
.vehicle:hover{
  background:#334155;
}
.vehicle.active{
  background:#4f46e5;
}

/* ===== LIST ===== */
.item{
  background:#1e293b;
  padding:15px;
  border-radius:10px;
  margin-top:10px;
  animation:fade .3s;
}
@keyframes fade{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1}
}

/* ===== BUTTON ===== */
button{
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}
.btn{background:#4f46e5;color:#fff}
.btn-danger{background:#dc2626;color:#fff}

/* ===== MODAL ===== */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal-box{
  background:#111827;
  padding:20px;
  border-radius:15px;
  width:400px;
  max-height:90vh;
  overflow:auto;
}

/* ===== INPUT ===== */
input,textarea{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border-radius:10px;
  border:none;
}
</style>
</head>

<body>

<div class="app">

<!-- sidebar -->
<div class="sidebar">
  <h2>🚗 SC</h2>
  <a>Dashboard</a>
  <a>Maintenance</a>
</div>

<!-- main -->
<div class="main">

<h2>🚗 รถทั้งหมด</h2>
<div class="grid" id="vehicleList"></div>

<br>

<button class="btn" onclick="openModal()">➕ เพิ่มรายการ</button>

<h2>🔧 ประวัติการซ่อม</h2>
<div id="log"></div>

</div>

</div>

<!-- modal -->
<div class="modal" id="modal">
<div class="modal-box">

<h3>เพิ่มรายการซ่อม</h3>

<input type="date" id="date">
<input id="mileage" placeholder="เลขไมล์">
<input id="jobNo" placeholder="ใบงาน">
<input id="system" placeholder="ระบบ">
<textarea id="symptoms" placeholder="อาการ"></textarea>
<textarea id="parts" placeholder="อะไหล่"></textarea>
<input id="technician" placeholder="ช่าง">
<input id="approver" placeholder="ผู้อนุมัติ">
<input id="partsCost" placeholder="ค่าอะไหล่">
<input id="laborCost" placeholder="ค่าแรง">
<textarea id="note" placeholder="หมายเหตุ"></textarea>

<button class="btn" onclick="save()">บันทึก</button>
<button class="btn-danger" onclick="closeModal()">ยกเลิก</button>

</div>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain: "vehicle-maintenance-64890.firebaseapp.com",
  projectId: "vehicle-maintenance-64890",
});

const db = firebase.firestore();

let selectedVehicle=null;

/* โหลดรถ */
db.collection("vehicles").onSnapshot(s=>{
  vehicleList.innerHTML="";

  s.forEach(d=>{
    let name=d.id;

    let div=document.createElement("div");
    div.className="vehicle";
    div.innerText=name;

    div.onclick=()=>{
      document.querySelectorAll(".vehicle")
        .forEach(v=>v.classList.remove("active"));

      div.classList.add("active");
      selectedVehicle=name;
      load(name);
    };

    vehicleList.appendChild(div);
  });
});

/* โหลดข้อมูล */
function load(v){
  db.collection("vehicles")
    .doc(v)
    .collection("repairs")
    .onSnapshot(s=>{
      log.innerHTML="";

      s.forEach(doc=>{
        let r=doc.data();
        let id=doc.id;
        let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);

        log.innerHTML+=`
        <div class="item">
          📅 ${r["วันที่"]||"-"}<br>
          🔧 ${r["ระบบที่ซ่อม"]||"-"}<br>
          🧠 ${r["อาการเสีย"]||"-"}<br>
          💰 ${cost.toLocaleString()} บาท<br>
          👨‍🔧 ${r["ช่างผู้รับผิดชอบ"]||"-"}<br><br>
          <button class="btn-danger" onclick="del('${id}')">ลบ</button>
        </div>`;
      });
    });
}

/* save */
function save(){
  if(!selectedVehicle) return alert("เลือกคันก่อน");

  db.collection("vehicles").doc(selectedVehicle)
    .collection("repairs")
    .add({
      "วันที่":date.value,
      "เลขไมล์":mileage.value,
      "เลขที่ใบงาน":jobNo.value,
      "ระบบที่ซ่อม":system.value,
      "อาการเสีย":symptoms.value,
      "อะไหล่ที่เปลี่ยน":parts.value,
      "ช่างผู้รับผิดชอบ":technician.value,
      "ผู้อนุมัติ":approver.value,
      "หมายเหตุ":note.value,
      "ค่าอะไหล่":partsCost.value,
      "ค่าแรง":laborCost.value,
      "เวลาบันทึก":new Date()
    });

  closeModal();
}

/* delete */
function del(id){
  db.collection("vehicles")
    .doc(selectedVehicle)
    .collection("repairs")
    .doc(id)
    .delete();
}

/* modal */
function openModal(){modal.style.display="flex";}
function closeModal(){modal.style.display="none";}
</script>

</body>
</html>
