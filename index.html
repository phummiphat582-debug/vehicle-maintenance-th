<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>SC THE ADVENTURE - ระบบซ่อมบำรุง</title>

<style>
* {
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  margin: 0;
  background: #f4f6f9;
}

/* Sidebar */
.sidebar {
  width: 260px;
  height: 100vh;
  position: fixed;
  background: linear-gradient(180deg, #b31217, #7b0f12);
  padding: 20px;
  color: white;
  box-shadow: 8px 0 25px rgba(0,0,0,0.3);
}

.sidebar h2 {
  margin-top: 0;
}

.btn {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 12px;
  background: #ff3b3b;
  color: white;
  font-weight: bold;
  cursor: pointer;
  margin-top: 20px;
  box-shadow: 0 5px 15px rgba(255,0,0,0.4);
}

.btn:hover {
  transform: scale(1.05);
}

/* Main */
.main {
  margin-left: 260px;
  padding: 30px;
}

/* Card */
.card {
  background: white;
  padding: 20px;
  border-radius: 16px;
  margin-bottom: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}

/* Inputs */
input, textarea {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ddd;
  margin-top: 5px;
}

/* Table */
table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid #eee;
}

/* Popup */
.popup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  display: none;
  justify-content: center;
  align-items: center;
}

.popup-content {
  background: white;
  padding: 20px;
  border-radius: 16px;
  width: 300px;
  animation: pop 0.3s ease;
}

@keyframes pop {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.car-item {
  padding: 10px;
  cursor: pointer;
  border-radius: 10px;
}

.car-item:hover {
  background: #f1f1f1;
}
</style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
  <h2>ระบบซ่อมบำรุง</h2>
  <button class="btn" onclick="openPopup()">เลือกรถ</button>
  <p id="selectedCar">ยังไม่ได้เลือกรถ</p>
</div>

<!-- Main -->
<div class="main">

  <div class="card">
    <h3>บันทึกการซ่อม</h3>

    <label>วันที่</label>
    <input type="date" id="date">

    <label>รายละเอียด</label>
    <textarea id="detail"></textarea>

    <label>ค่าใช้จ่าย</label>
    <input type="number" id="price">

    <button class="btn" onclick="saveData()">บันทึก</button>
  </div>

  <div class="card">
    <h3>ประวัติการซ่อม</h3>
    <table>
      <thead>
        <tr>
          <th>รถ</th>
          <th>วันที่</th>
          <th>รายละเอียด</th>
          <th>ราคา</th>
        </tr>
      </thead>
      <tbody id="tableData"></tbody>
    </table>
  </div>

</div>

<!-- Popup -->
<div class="popup" id="popup">
  <div class="popup-content">
    <h3>เลือกคันรถ</h3>
    <div id="carList"></div>
  </div>
</div>

<script>
let cars = ["ATV-01","ATV-02","ATV-03","ATV-04","ATV-05","ATV-06","ATV-07","ATV-08"];
let selectedCar = "";

function openPopup(){
  document.getElementById("popup").style.display = "flex";
  renderCars();
}

function renderCars(){
  let html = "";
  cars.forEach(car=>{
    html += `<div class="car-item" onclick="selectCar('${car}')">${car}</div>`;
  });
  document.getElementById("carList").innerHTML = html;
}

function selectCar(car){
  selectedCar = car;
  document.getElementById("selectedCar").innerText = "รถ: " + car;
  document.getElementById("popup").style.display = "none";
}

function saveData(){
  let data = {
    car: selectedCar,
    date: document.getElementById("date").value,
    detail: document.getElementById("detail").value,
    price: document.getElementById("price").value
  };

  if(!data.car){
    alert("กรุณาเลือกคันรถ");
    return;
  }

  let list = JSON.parse(localStorage.getItem("data") || "[]");
  list.push(data);
  localStorage.setItem("data", JSON.stringify(list));

  loadData();
}

function loadData(){
  let list = JSON.parse(localStorage.getItem("data") || "[]");
  let html = "";

  list.forEach(d=>{
    html += `
      <tr>
        <td>${d.car}</td>
        <td>${d.date}</td>
        <td>${d.detail}</td>
        <td>${d.price}</td>
      </tr>
    `;
  });

  document.getElementById("tableData").innerHTML = html;
}

loadData();
</script>

</body>
</html>
