<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>SC Maintenance</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Segoe UI;
}

/* HEADER */
.header{
  background:#4db6c6;
  color:#fff;
  padding:15px;
  display:flex;
  justify-content:space-between;
}

/* layout */
.app{
  display:flex;
  height:calc(100vh - 60px);
}

/* LEFT */
.sidebar{
  width:220px;
  background:#3a3f44;
  padding:20px;
}
.sidebar button{
  width:100%;
  padding:10px;
  margin-bottom:10px;
  background:#4db6c6;
  border:none;
  color:#fff;
  cursor:pointer;
}

/* CENTER */
.center{
  flex:1;
  padding:20px;
  background:#f3f3f3;
  overflow:auto;
}

.title{
  font-size:20px;
  margin-bottom:15px;
}

/* repair item */
.item{
  background:#fff;
  padding:15px;
  border-radius:8px;
  margin-bottom:10px;
  border-left:5px solid #4db6c6;
}

/* popup */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
}
.popup-box{
  background:#fff;
  padding:20px;
  width:300px;
}
.vehicle{
  padding:10px;
  border-bottom:1px solid #ddd;
  cursor:pointer;
}
.vehicle:hover{
  background:#eee;
}

/* modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal-box{
  background:#fff;
  padding:20px;
  width:400px;
}
input,textarea{
  width:100%;
  margin-bottom:10px;
  padding:8px;
}
</style>
</head>

<body>

<div class="header">
  <div>SC Maintenance</div>
</div>

<div class="app">

<!-- LEFT -->
<div class="sidebar">
  <button onclick="openVehiclePopup()">🚗 เลือกรถ</button>
  <button onclick="openModal()">➕ เพิ่มรายการ</button>
</div>

<!-- CENTER -->
<div class="center">
  <div class="title" id="currentVehicle">ยังไม่ได้เลือกรถ</div>
  <div id="repairList"></div>
</div>

</div>

<!-- POPUP เลือกรถ -->
<div class="popup" id="vehiclePopup">
  <div class="popup-box" id="vehicleList"></div>
</div>

<!-- MODAL เพิ่ม -->
<div class="modal" id="modal">
<div class="modal-box">

<h3>เพิ่มรายการซ่อม</h3>

<input type="date" id="date">
<input id="system" placeholder="ระบบ">
<textarea id="symptoms" placeholder="อาการ"></textarea>
<input id="technician" placeholder="ช่าง">
<input id="partsCost" placeholder="ค่าอะไหล่">
<input id="laborCost" placeholder="ค่าแรง">

<button onclick="save()">บันทึก</button>
<button onclick="modal.style.display='none'">ยกเลิก</button>

</div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain:"vehicle-maintenance-64890.firebaseapp.com",
  projectId:"vehicle-maintenance-64890"
});

const db=firebase.firestore();

let selectedVehicle=null;

/* โหลดรถ */
db.collection("vehicles").onSnapshot(s=>{
  vehicleList.innerHTML="";

  s.forEach(d=>{
    let v=d.id;

    vehicleList.innerHTML+=`
    <div class="vehicle" onclick="selectVehicle('${v}')">
      🚗 ${v}
    </div>`;
  });
});

/* เปิด popup */
function openVehiclePopup(){
  vehiclePopup.style.display="flex";
}

/* เลือกรถ */
function selectVehicle(v){
  selectedVehicle=v;
  currentVehicle.innerText=v;
  vehiclePopup.style.display="none";
  loadRepairs(v);
}

/* โหลด + เรียงวันที่ */
function loadRepairs(v){
  db.collection("vehicles").doc(v).collection("repairs")
  .onSnapshot(s=>{
    let list=[];

    s.forEach(doc=>{
      let r=doc.data();
      list.push(r);
    });

    // sort ล่าสุดก่อน
    list.sort((a,b)=> new Date(b["วันที่"]) - new Date(a["วันที่"]));

    render(list);
  });
}

/* render */
function render(list){
  repairList.innerHTML="";

  list.forEach(r=>{
    let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);

    repairList.innerHTML+=`
    <div class="item">
      📅 <b>${r["วันที่"]||"-"}</b><br>
      🔧 ${r["ระบบที่ซ่อม"]||"-"}<br>
      🧠 ${r["อาการเสีย"]||"-"}<br>
      👨‍🔧 ${r["ช่างผู้รับผิดชอบ"]||"-"}<br>
      💰 ${cost.toLocaleString()} บาท
    </div>`;
  });
}

/* save */
function save(){
  if(!selectedVehicle) return alert("เลือกคันก่อน");

  db.collection("vehicles").doc(selectedVehicle)
    .collection("repairs")
    .add({
      "วันที่":date.value,
      "ระบบที่ซ่อม":system.value,
      "อาการเสีย":symptoms.value,
      "ช่างผู้รับผิดชอบ":technician.value,
      "ค่าอะไหล่":partsCost.value,
      "ค่าแรง":laborCost.value
    });

  modal.style.display="none";
}

/* modal */
function openModal(){modal.style.display="flex";}
</script>

</body>
</html>
