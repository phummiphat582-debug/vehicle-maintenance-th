<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>SC Maintenance (Full Data)</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{margin:0;font-family:Segoe UI;background:#f3f4f6}

.header{
  background:#4f46e5;
  color:#fff;
  padding:20px;
  font-size:22px;
}

.vehicle-bar{
  display:flex;
  gap:10px;
  padding:10px 20px;
}

.vehicle{
  padding:8px 12px;
  background:#ddd;
  border-radius:10px;
  cursor:pointer;
}
.vehicle.active{
  background:#4f46e5;
  color:#fff;
}

.list{padding:20px}

.item{
  background:#fff;
  padding:15px;
  border-radius:12px;
  margin-bottom:12px;
  line-height:1.6;
}

.cost{color:green;font-weight:bold}

button{
  padding:8px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
.btn{background:#4f46e5;color:#fff}
.btn-danger{background:#dc2626;color:#fff}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal-box{
  background:#fff;
  padding:20px;
  border-radius:12px;
  width:400px;
  max-height:90vh;
  overflow:auto;
}

input,textarea{
  width:100%;
  margin-bottom:10px;
  padding:8px;
}
</style>
</head>

<body>

<div class="header">🚗 SC Maintenance (ข้อมูลครบ)</div>

<div class="vehicle-bar" id="vehicleList"></div>

<div style="padding:20px">
  <button class="btn" onclick="openModal()">➕ เพิ่ม</button>
</div>

<div class="list" id="log"></div>

<!-- modal -->
<div class="modal" id="modal">
<div class="modal-box">

<h3>เพิ่มรายการซ่อม</h3>

<input type="date" id="date">
<input id="mileage" placeholder="เลขไมล์">
<input id="jobNo" placeholder="ใบงาน">

<input id="system" placeholder="ระบบ">
<textarea id="symptoms" placeholder="อาการ"></textarea>
<textarea id="parts" placeholder="อะไหล่"></textarea>

<input id="technician" placeholder="ช่าง">
<input id="approver" placeholder="ผู้อนุมัติ">

<input id="partsCost" placeholder="ค่าอะไหล่">
<input id="laborCost" placeholder="ค่าแรง">

<textarea id="note" placeholder="หมายเหตุ"></textarea>

<button class="btn" onclick="save()">บันทึก</button>
<button class="btn-danger" onclick="closeModal()">ยกเลิก</button>

</div>
</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain: "vehicle-maintenance-64890.firebaseapp.com",
  projectId: "vehicle-maintenance-64890",
});

const db=firebase.firestore();

let selectedVehicle=null;
let unsubscribe=null;

/* โหลดรถ */
db.collection("vehicles").onSnapshot(s=>{
  vehicleList.innerHTML="";
  let first=null;

  s.forEach(d=>{
    if(!first) first=d.id;

    let div=document.createElement("div");
    div.className="vehicle";
    div.innerText=d.id;

    div.onclick=()=>{
      document.querySelectorAll(".vehicle")
        .forEach(v=>v.classList.remove("active"));

      div.classList.add("active");
      selectedVehicle=d.id;
      load(d.id);
    };

    vehicleList.appendChild(div);
  });

  if(first) vehicleList.children[0].click();
});

/* โหลดข้อมูล */
function load(v){
  if(unsubscribe) unsubscribe();

  unsubscribe = db.collection("vehicles")
    .doc(v).collection("repairs")
    .onSnapshot(s=>{
      log.innerHTML="";

      s.forEach(doc=>{
        let r=doc.data();
        let id=doc.id;

        let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);

        log.innerHTML+=`
        <div class="item">
          📅 <b>${r["วันที่"]||"-"}</b><br>
          📏 ไมล์: ${r["เลขไมล์"]||"-"}<br>
          🧾 ใบงาน: ${r["เลขที่ใบงาน"]||"-"}<br>
          🔧 ระบบ: ${r["ระบบที่ซ่อม"]||"-"}<br>
          🧠 อาการ: ${r["อาการเสีย"]||"-"}<br>
          🧩 อะไหล่: ${r["อะไหล่ที่เปลี่ยน"]||"-"}<br>
          👨‍🔧 ช่าง: ${r["ช่างผู้รับผิดชอบ"]||"-"}<br>
          👤 อนุมัติ: ${r["ผู้อนุมัติ"]||"-"}<br>
          📌 หมายเหตุ: ${r["หมายเหตุ"]||"-"}<br>
          💰 <span class="cost">${cost.toLocaleString()} บาท</span><br><br>

          <button class="btn-danger" onclick="del('${id}')">ลบ</button>
        </div>`;
      });
    });
}

/* save */
function save(){
  if(!selectedVehicle) return alert("เลือกคันก่อน");

  db.collection("vehicles").doc(selectedVehicle)
    .collection("repairs")
    .add({
      "วันที่":date.value,
      "เลขไมล์":mileage.value,
      "เลขที่ใบงาน":jobNo.value,
      "ระบบที่ซ่อม":system.value,
      "อาการเสีย":symptoms.value,
      "อะไหล่ที่เปลี่ยน":parts.value,
      "ช่างผู้รับผิดชอบ":technician.value,
      "ผู้อนุมัติ":approver.value,
      "หมายเหตุ":note.value,
      "ค่าอะไหล่":partsCost.value,
      "ค่าแรง":laborCost.value,
      "เวลาบันทึก":new Date()
    });

  closeModal();
}

/* delete */
function del(id){
  db.collection("vehicles")
    .doc(selectedVehicle)
    .collection("repairs")
    .doc(id)
    .delete();
}

/* modal */
function openModal(){modal.style.display="flex";}
function closeModal(){modal.style.display="none";}
</script>

</body>
</html>
