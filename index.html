<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Manager Dashboard</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  display:flex;
  background:#eef2ff;
}

/* sidebar */
.sidebar{
  width:90px;
  background:linear-gradient(#6366f1,#4f46e5);
  height:100vh;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:20px;
}

/* main */
.main{
  flex:1;
  padding:20px;
}

/* top */
.top{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}

/* grid */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:20px;
}

/* card */
.card{
  background:#fff;
  border-radius:20px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
}

.big{grid-column:span 2;}

.value{
  font-size:26px;
  font-weight:bold;
}

/* warning */
.warn{
  color:#dc2626;
  font-weight:bold;
}

/* list */
.item{
  background:#f9fafb;
  padding:10px;
  border-radius:10px;
  margin-top:8px;
}

/* vehicle */
.vehicle{
  padding:8px 12px;
  border-radius:10px;
  background:#ddd;
  cursor:pointer;
}
.vehicle.active{
  background:#4f46e5;
  color:#fff;
}

/* input */
input{
  padding:10px;
  border-radius:10px;
  border:none;
}
</style>
</head>

<body>

<div class="sidebar">
  📊<br><br>
  🚗<br><br>
  ⚙️
</div>

<div class="main">

<div class="top">
  <h2>Manager Dashboard</h2>
  <input id="search" placeholder="ค้นหา...">
</div>

<div id="vehicleList" style="display:flex;gap:10px;margin-bottom:20px;"></div>

<div class="grid">

<div class="card">
  💰 ค่าใช้จ่ายรวม
  <div class="value" id="totalCost">0</div>
</div>

<div class="card">
  📅 เดือนนี้
  <div class="value" id="monthCost">0</div>
</div>

<div class="card">
  🔧 งานทั้งหมด
  <div class="value" id="totalJobs">0</div>
</div>

<div class="card">
  ⚠️ รถเสี่ยง
  <div class="value warn" id="riskCar">-</div>
</div>

<div class="card big">
  🚗 รถที่ซ่อมบ่อย
  <div id="topCars"></div>
</div>

<div class="card big">
  📊 ค่าใช้จ่ายตามระบบ
  <div id="systemStats"></div>
</div>

<div class="card big">
  📋 รายการล่าสุด
  <div id="log"></div>
</div>

</div>

</div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain: "vehicle-maintenance-64890.firebaseapp.com",
  projectId: "vehicle-maintenance-64890",
});

const db = firebase.firestore();

let selectedVehicle=null;
let allData=[];
let vehicleStats={};

/* โหลดรถ */
db.collection("vehicles").onSnapshot(async s=>{
  vehicleList.innerHTML="";
  vehicleStats={};

  for(const d of s.docs){
    let name=d.id;
    vehicleStats[name]=[];

    let snap=await db.collection("vehicles").doc(name).collection("repairs").get();
    snap.forEach(doc=>{
      vehicleStats[name].push(doc.data());
    });
  }

  renderDashboard();
});

/* วิเคราะห์ */
function renderDashboard(){
  let total=0, month=0, jobs=0;
  let systemMap={};
  let carCount={};

  let today=new Date().toISOString().slice(0,7);

  for(let car in vehicleStats){
    carCount[car]=vehicleStats[car].length;

    vehicleStats[car].forEach(r=>{
      let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);
      total+=cost;
      jobs++;

      if((r["วันที่"]||"").startsWith(today)) month+=cost;

      let sys=r["ระบบที่ซ่อม"]||"อื่นๆ";
      systemMap[sys]=(systemMap[sys]||0)+cost;
    });
  }

  totalCost.innerText=total.toLocaleString();
  monthCost.innerText=month.toLocaleString();
  totalJobs.innerText=jobs;

  /* รถพังบ่อย */
  let worst=Object.entries(carCount).sort((a,b)=>b[1]-a[1])[0];
  riskCar.innerText=worst ? worst[0]+" ("+worst[1]+")" : "-";

  /* top cars */
  topCars.innerHTML="";
  Object.entries(carCount)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,5)
    .forEach(c=>{
      topCars.innerHTML+=`<div class="item">${c[0]} - ${c[1]} ครั้ง</div>`;
    });

  /* system stats */
  systemStats.innerHTML="";
  Object.entries(systemMap)
    .sort((a,b)=>b[1]-a[1])
    .forEach(s=>{
      systemStats.innerHTML+=`<div class="item">${s[0]} - ${s[1].toLocaleString()} บาท</div>`;
    });
}
</script>

</body>
</html>
