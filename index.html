<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ระบบซ่อมบำรุง</title>

<style>
:root{
  --red:#991b1b;
  --red2:#b91c1c;
  --bg:#f1f5f9;
}

body{
  margin:0;
  font-family:Segoe UI;
  background:var(--bg);
}

/* SIDEBAR */
.sidebar{
  width:240px;
  height:100vh;
  position:fixed;
  background:linear-gradient(180deg,var(--red),#7f1d1d);
  color:#fff;
  padding:20px;
}

/* MAIN */
header{
  margin-left:240px;
  background:linear-gradient(90deg,var(--red),var(--red2));
  color:#fff;
  padding:15px;
}

.main{
  margin-left:240px;
  padding:20px;
}

/* CARD */
.card{
  background:#fff;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
}

/* BUTTON */
button{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  background:var(--red2);
  color:#fff;
  cursor:pointer;
}
.danger{background:#dc2626}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:10px;
  border-bottom:1px solid #eee;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-box{
  background:#fff;
  padding:20px;
  border-radius:10px;
  width:90%;
  max-width:500px;
  max-height:80vh;
  overflow:auto;
}

/* LIST */
.vehicle-item{
  padding:10px;
  border-bottom:1px solid #eee;
  cursor:pointer;
}
.vehicle-item:hover{
  background:#f3f4f6;
}

/* DETAIL */
.detail-row{
  display:grid;
  grid-template-columns:150px 1fr;
  margin-bottom:6px;
}
.detail-row b{color:var(--red)}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h3>ระบบซ่อมบำรุง</h3>
  <button onclick="openVehicleModal()">เลือกรถ</button>
</div>

<header>ระบบซ่อมบำรุง</header>

<div class="main">

<div class="card">
  <b id="currentVehicle">ยังไม่เลือกรถ</b>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>วันที่</th>
<th>ระบบ</th>
<th>ช่าง</th>
<th>ดู</th>
<th>ลบ</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>

<!-- เลือกรถ -->
<div class="modal" id="vehicleModal">
<div class="modal-box">
<h3>เลือกรถ</h3>
<div id="vehicleList"></div>
<br>
<button onclick="vehicleModal.style.display='none'">ปิด</button>
</div>
</div>

<!-- DETAIL -->
<div class="modal" id="detailModal">
<div class="modal-box">
<h3>รายละเอียด</h3>
<div id="detail"></div>
<button onclick="detailModal.style.display='none'">ปิด</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSy...",
  projectId:"vehicle-maintenance-64890"
});
const db=firebase.firestore();

let currentVehicle=null;

/* โหลด list รถ */
function openVehicleModal(){
  vehicleModal.style.display="flex";

  db.collection("vehicles").get().then(s=>{
    vehicleList.innerHTML="";
    s.forEach(d=>{
      let div=document.createElement("div");
      div.className="vehicle-item";
      div.innerText=d.id;

      div.onclick=()=>{
        currentVehicle=d.id;
        currentVehicleEl.innerText=d.id;
        vehicleModal.style.display="none";
        loadRepairs(d.id);
      };

      vehicleList.appendChild(div);
    });
  });
}

const currentVehicleEl=document.getElementById("currentVehicle");

/* โหลดข้อมูล */
function loadRepairs(v){
  db.collection("vehicles").doc(v).collection("repairs")
  .onSnapshot(s=>{
    tbody.innerHTML="";

    s.forEach(doc=>{
      let r=doc.data();

      tbody.innerHTML+=`
      <tr>
        <td>${r["วันที่"]||""}</td>
        <td>${r["ระบบที่ซ่อม"]||""}</td>
        <td>${r["ช่างผู้รับผิดชอบ"]||""}</td>
        <td><button onclick='show(${JSON.stringify(r)})'>ดู</button></td>
        <td><button class="danger" onclick="del('${v}','${doc.id}')">ลบ</button></td>
      </tr>`;
    });
  });
}

/* DETAIL */
function show(d){
  let html="";
  for(let k in d){
    html+=`<div class="detail-row"><b>${k}</b><div>${d[k]}</div></div>`;
  }
  detail.innerHTML=html;
  detailModal.style.display="flex";
}

/* DELETE */
function del(v,id){
  db.collection("vehicles").doc(v).collection("repairs").doc(id).delete();
}
</script>

</body>
</html>
