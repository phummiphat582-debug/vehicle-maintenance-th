<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ระบบสต๊อกกิจกรรม V9</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --primary:#b91c1c;
  --primary-dark:#7f1d1d;
  --accent:#ef4444;
  --bg:#f3f4f6;
  --card:#ffffff;
  --text:#1f2937;
}

*{box-sizing:border-box;font-family:Segoe UI}
body{margin:0;background:var(--bg);color:var(--text)}

/* Sidebar */
.sidebar{
  width:250px;height:100vh;position:fixed;
  background:linear-gradient(180deg,var(--primary-dark),var(--primary));
  color:#fff;padding:20px
}
.menu div{
  padding:14px;border-radius:12px;margin:8px 0;cursor:pointer
}
.menu div:hover{background:rgba(255,255,255,.15)}
.active{background:#fff;color:var(--primary);font-weight:bold}

/* Header */
header{
  margin-left:250px;
  background:linear-gradient(90deg,var(--primary-dark),var(--primary));
  color:#fff;padding:20px;font-size:20px;font-weight:700
}

/* Main */
.main{margin-left:250px;padding:30px}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px
}

.card{
  background:#fff;border-radius:18px;padding:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  transition:.2s
}
.card:hover{transform:translateY(-3px)}

.stat{
  font-size:28px;
  font-weight:bold;
  color:var(--primary)
}

/* Button */
button{
  padding:10px 14px;border:none;border-radius:10px;
  background:var(--primary);color:#fff;cursor:pointer
}
button:hover{background:var(--accent)}

.secondary{
  background:#fff;color:var(--primary);
  border:2px solid var(--primary)
}

/* Table */
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{padding:12px;border-bottom:1px solid #ddd;text-align:left}

/* Modal */
.modal{
  position:fixed;inset:0;
  background:rgba(0,0,0,.6);
  display:none;align-items:center;justify-content:center
}
.modal-box{
  background:#fff;padding:25px;border-radius:16px;
  width:95%;max-width:500px;
  animation:pop .2s ease
}
@keyframes pop{
  from{transform:scale(.9);opacity:0}
  to{transform:scale(1);opacity:1}
}

input{width:100%;padding:10px;margin:8px 0;border-radius:10px;border:1px solid #ddd}
</style>
</head>

<body>

<div class="sidebar">
  <h2>📦 Stock V9</h2>
  <div class="menu">
    <div class="active">Dashboard</div>
    <div onclick="openModal()">+ เพิ่มสินค้า</div>
  </div>
</div>

<header>ระบบสต๊อกกิจกรรม (แดงขาว Enterprise)</header>

<div class="main">

<div class="grid">
  <div class="card">
    <div>จำนวนสินค้า</div>
    <div class="stat" id="totalItems">0</div>
  </div>

  <div class="card">
    <div>จำนวนคงเหลือ</div>
    <div class="stat" id="totalQty">0</div>
  </div>

  <div class="card">
    <div>มูลค่ารวม</div>
    <div class="stat" id="totalValue">0</div>
  </div>
</div>

<button style="margin-top:20px" onclick="openModal()">➕ เพิ่มสินค้า</button>

<table>
<thead>
<tr>
<th>ชื่อ</th>
<th>จำนวน</th>
<th>ราคา</th>
<th>ลบ</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

</div>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h3>เพิ่มสินค้า</h3>
    <input id="name" placeholder="ชื่อสินค้า">
    <input id="qty" type="number" placeholder="จำนวน">
    <input id="price" type="number" placeholder="ราคา">
    <button onclick="save()">บันทึก</button>
    <button class="secondary" onclick="closeModal()">ยกเลิก</button>
  </div>
</div>

<script>
let data = JSON.parse(localStorage.getItem("stock") || "[]");

function render(){
  let tbody = document.getElementById("tbody");
  tbody.innerHTML="";

  let totalItems=data.length;
  let totalQty=0;
  let totalValue=0;

  data.forEach((d,i)=>{
    totalQty+= +d.qty;
    totalValue+= d.qty*d.price;

    tbody.innerHTML+=`
    <tr>
      <td>${d.name}</td>
      <td>${d.qty}</td>
      <td>${d.price}</td>
      <td><button onclick="del(${i})">ลบ</button></td>
    </tr>`;
  });

  totalItemsEl.textContent=totalItems;
  totalQtyEl.textContent=totalQty;
  totalValueEl.textContent=totalValue;
}

function save(){
  let name=document.getElementById("name").value;
  let qty=document.getElementById("qty").value;
  let price=document.getElementById("price").value;

  if(!name || !qty || !price) return alert("กรอกข้อมูลให้ครบ");

  data.push({name,qty,price});
  localStorage.setItem("stock",JSON.stringify(data));

  closeModal();
  render();
}

function del(i){
  data.splice(i,1);
  localStorage.setItem("stock",JSON.stringify(data));
  render();
}

function openModal(){modal.style.display="flex"}
function closeModal(){modal.style.display="none"}

const totalItemsEl=document.getElementById("totalItems");
const totalQtyEl=document.getElementById("totalQty");
const totalValueEl=document.getElementById("totalValue");

render();
</script>

</body>
</html>
