<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>SC Maintenance Enterprise</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Inter;
  background:#f1f5f9;
}

/* layout */
.app{
  display:flex;
}

/* sidebar */
.sidebar{
  width:220px;
  height:100vh;
  background:#0f172a;
  color:#fff;
  padding:20px;
}

/* main */
.main{
  flex:1;
  padding:20px;
}

/* grid */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

/* card */
.card{
  background:#fff;
  padding:20px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}

/* stat */
.stat{
  font-size:26px;
  font-weight:bold;
}

/* list */
.item{
  padding:10px;
  border-bottom:1px solid #eee;
}

/* canvas */
canvas{
  width:100%;
  height:200px;
}
</style>
</head>

<body>

<div class="app">

<!-- sidebar -->
<div class="sidebar">
  <h2>🚗 SC</h2>
  Dashboard
</div>

<!-- main -->
<div class="main">

<h2>Dashboard</h2>

<!-- KPI -->
<div class="grid">
  <div class="card">
    💰 ค่าใช้จ่ายรวม
    <div class="stat" id="totalCost">0</div>
  </div>

  <div class="card">
    🔧 งานทั้งหมด
    <div class="stat" id="totalJobs">0</div>
  </div>

  <div class="card">
    🚗 จำนวนรถ
    <div class="stat" id="totalVehicles">0</div>
  </div>
</div>

<br>

<!-- GRAPH -->
<div class="card">
  <h3>📈 ค่าใช้จ่ายรายวัน</h3>
  <canvas id="chart"></canvas>
</div>

<br>

<!-- LIST -->
<div class="card">
  <h3>📋 รายการล่าสุด</h3>
  <div id="list"></div>
</div>

</div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain:"vehicle-maintenance-64890.firebaseapp.com",
  projectId:"vehicle-maintenance-64890"
});

const db=firebase.firestore();

/* โหลดทั้งหมด */
db.collection("vehicles").onSnapshot(async s=>{
  let totalCost=0;
  let totalJobs=0;
  let daily={};

  totalVehicles.innerText=s.size;

  for(const d of s.docs){
    let snap=await db.collection("vehicles").doc(d.id).collection("repairs").get();

    snap.forEach(doc=>{
      let r=doc.data();
      let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);

      totalCost+=cost;
      totalJobs++;

      let day=r["วันที่"]||"unknown";
      if(!daily[day]) daily[day]=0;
      daily[day]+=cost;
    });
  }

  totalCostEl.innerText=totalCost.toLocaleString();
  totalJobsEl.innerText=totalJobs;

  drawChart(daily);
});

/* draw graph */
function drawChart(data){
  let ctx=chart.getContext("2d");
  ctx.clearRect(0,0,chart.width,chart.height);

  let keys=Object.keys(data).sort();
  let values=keys.map(k=>data[k]);

  let max=Math.max(...values,1);

  keys.forEach((k,i)=>{
    let x=i*50+30;
    let h=(values[i]/max)*150;

    ctx.fillStyle="#6366f1";
    ctx.fillRect(x,180-h,30,h);

    ctx.fillText(k,x,195);
  });
}
</script>

</body>
</html>
