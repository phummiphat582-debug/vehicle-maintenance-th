<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ระบบซ่อมบำรุง</title>

<style>
:root{
  --red:#991b1b;
  --red2:#b91c1c;
  --bg:#f1f5f9;
}

/* RESET */
body{
  margin:0;
  font-family:Segoe UI;
  background:var(--bg);
}

/* SIDEBAR */
.sidebar{
  width:240px;
  height:100vh;
  position:fixed;
  background:linear-gradient(180deg,var(--red),#7f1d1d);
  color:#fff;
  padding:20px;
}

.menu div{
  padding:12px;
  border-radius:10px;
  margin:8px 0;
  cursor:pointer;
}
.menu div:hover{
  background:rgba(255,255,255,.1);
}
.active{
  background:#fff;
  color:var(--red);
}

/* HEADER */
header{
  margin-left:240px;
  background:linear-gradient(90deg,var(--red),var(--red2));
  color:#fff;
  padding:18px;
  font-weight:600;
}

/* MAIN */
.main{
  margin-left:240px;
  padding:25px;
}

/* CARD */
.card{
  background:#fff;
  padding:20px;
  border-radius:16px;
  box-shadow:0 10px 25px rgba(0,0,0,.06);
  margin-bottom:20px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

/* STAT */
.stat{
  font-size:28px;
  font-weight:700;
  color:var(--red);
}

/* TABLE */
.table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:12px;
  border-bottom:1px solid #eee;
  text-align:left;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  background:var(--red2);
  color:#fff;
  cursor:pointer;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-box{
  background:#fff;
  padding:20px;
  border-radius:12px;
  width:90%;
  max-width:800px;
}

.detail-row{
  display:grid;
  grid-template-columns:180px 1fr;
  margin-bottom:8px;
}
.detail-row b{
  color:var(--red);
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h3>ระบบซ่อมบำรุง</h3>
  <div class="menu">
    <div class="active">Dashboard</div>
  </div>
</div>

<header>ระบบซ่อมบำรุง</header>

<div class="main">

<!-- SUMMARY -->
<div class="grid">
  <div class="card">
    <div>จำนวนรายการ</div>
    <div class="stat" id="count">0</div>
  </div>
  <div class="card">
    <div>ค่าใช้จ่ายรวม</div>
    <div class="stat" id="total">0</div>
  </div>
</div>

<!-- TABLE (โชว์แค่สำคัญ) -->
<div class="card">
<table class="table">
<thead>
<tr>
<th>วันที่</th>
<th>รถ</th>
<th>ระบบ</th>
<th>ช่าง</th>
<th>ดู</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>

<!-- DETAIL MODAL -->
<div class="modal" id="modal">
<div class="modal-box">
<h3>รายละเอียด</h3>
<div id="detail"></div>
<br>
<button onclick="modal.style.display='none'">ปิด</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSy...",
  projectId:"vehicle-maintenance-64890"
});
const db=firebase.firestore();

let all=[];

db.collection("vehicles").get().then(vs=>{
  vs.forEach(v=>{
    db.collection("vehicles").doc(v.id).collection("repairs")
    .onSnapshot(s=>{
      all=[];
      s.forEach(d=>{
        let r=d.data();
        r.vehicle=v.id;
        all.push(r);
      });

      render();
    });
  });
});

function render(){
  tbody.innerHTML="";
  let total=0;

  all.forEach(r=>{
    let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);
    total+=cost;

    tbody.innerHTML+=`
    <tr>
      <td>${r["วันที่"]||""}</td>
      <td>${r.vehicle}</td>
      <td>${r["ระบบที่ซ่อม"]||""}</td>
      <td>${r["ช่างผู้รับผิดชอบ"]||""}</td>
      <td><button onclick='show(${JSON.stringify(r)})'>ดู</button></td>
    </tr>`;
  });

  count.innerText=all.length;
  totalEl.innerText=total;
}

function show(d){
  let html="";
  for(let k in d){
    html+=`<div class="detail-row"><b>${k}</b><div>${d[k]||"-"}</div></div>`;
  }
  detail.innerHTML=html;
  modal.style.display="flex";
}

const totalEl=document.getElementById("total");
</script>

</body>
</html>
