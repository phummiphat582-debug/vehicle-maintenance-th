<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ระบบซ่อมบำรุง</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --red:#b91c1c;
  --dark:#7f1d1d;
  --bg:#f4f6f8;
}

body{
  margin:0;
  font-family:Segoe UI,Arial;
  background:var(--bg);
}

/* Header */
header{
  background:linear-gradient(90deg,var(--dark),var(--red));
  color:#fff;
  padding:18px 30px;
  font-size:20px;
  font-weight:600;
}

/* Layout */
.container{
  max-width:1600px;
  margin:auto;
  padding:25px;
}

/* Card */
.card{
  background:#fff;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.06);
}

/* Grid */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
}

/* Inputs */
input,textarea,select{
  width:100%;
  padding:10px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:14px;
}

/* Buttons */
button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:var(--red);
  color:#fff;
  cursor:pointer;
}
button:hover{opacity:.9}
.danger{background:#dc2626}

/* Table */
table{
  width:100%;
  border-collapse:collapse;
}
th{
  text-align:left;
  background:#f9fafb;
}
th,td{
  padding:12px;
  border-bottom:1px solid #eee;
}

/* Modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-box{
  background:#fff;
  padding:25px;
  border-radius:12px;
  width:95%;
  max-width:1200px;
  max-height:90vh;
  overflow:auto;
}

/* Form layout */
.form-section{margin-top:15px}
.form-title{
  font-weight:600;
  margin-bottom:10px;
  color:var(--dark)
}
.form-grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}
.form-grid-3{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:15px;
}
textarea{
  min-height:100px;
  resize:vertical;
}

/* Detail */
.detail-row{
  display:grid;
  grid-template-columns:200px 1fr;
  padding:8px 0;
  border-bottom:1px dashed #ddd;
}
.detail-row b{color:var(--red)}
</style>
</head>

<body>

<header>ระบบซ่อมบำรุง</header>

<div class="container">

<div class="card grid">
<select id="vehicleSelect"></select>
<button onclick="openModal()">เพิ่มรายการ</button>
<button class="danger" onclick="deleteAll()">ลบทั้งหมด</button>
</div>

<!-- 🔍 ค้นหา -->
<div class="card grid">
<input id="searchInput" placeholder="ค้นหา (ระบบ / อาการ / ช่าง / ใบงาน)">
<button onclick="search()">ค้นหา</button>
<button onclick="resetSearch()">ล้าง</button>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>วันที่</th>
<th>รถ</th>
<th>ระบบ</th>
<th>อาการ</th>
<th>ช่าง</th>
<th>ค่าใช้จ่าย</th>
<th>รายละเอียด</th>
<th>ลบ</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>

<!-- เพิ่ม -->
<div class="modal" id="modal">
<div class="modal-box">

<h3>เพิ่มประวัติการซ่อม</h3>

<div class="form-section">
<div class="form-title">ข้อมูลหลัก</div>
<div class="form-grid-3">
<input type="date" id="date">
<input id="mileage" placeholder="เลขไมล์">
<input id="jobNo" placeholder="เลขที่ใบงาน">
</div>
</div>

<div class="form-section">
<div class="form-title">รายละเอียดงานซ่อม</div>
<div class="form-grid-2">
<input id="system" placeholder="ระบบที่ซ่อม">
<input id="technician" placeholder="ช่าง">
</div>
<div class="form-grid-2" style="margin-top:10px;">
<input id="approver" placeholder="ผู้อนุมัติ">
</div>
</div>

<div class="form-section">
<div class="form-title">รายละเอียดเพิ่มเติม</div>
<div class="form-grid-3">
<textarea id="symptoms" placeholder="อาการเสีย"></textarea>
<textarea id="parts" placeholder="อะไหล่ที่เปลี่ยน"></textarea>
<textarea id="note" placeholder="หมายเหตุ"></textarea>
</div>
</div>

<div class="form-section">
<div class="form-title">ค่าใช้จ่าย</div>
<div class="form-grid-2">
<input type="number" id="partsCost" placeholder="ค่าอะไหล่">
<input type="number" id="laborCost" placeholder="ค่าแรง">
</div>
</div>

<br>
<button onclick="save()">บันทึก</button>
<button class="danger" onclick="closeModal()">ยกเลิก</button>

</div>
</div>

<!-- รายละเอียด -->
<div class="modal" id="detailModal">
<div class="modal-box">
<h3>รายละเอียดการซ่อม</h3>
<div id="detailContent"></div>
<br>
<button onclick="detailModal.style.display='none'">ปิด</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  projectId:"vehicle-maintenance-64890"
});
const db=firebase.firestore();

let all=[];

function loadVehicles(){
  db.collection("vehicles").onSnapshot(s=>{
    vehicleSelect.innerHTML="";
    s.forEach(d=>{
      let o=document.createElement("option");
      o.value=d.id;
      o.textContent=d.id;
      vehicleSelect.appendChild(o);
    });
    if(vehicleSelect.value) loadRepairs(vehicleSelect.value);
  });
}

vehicleSelect.onchange=()=>loadRepairs(vehicleSelect.value);

function loadRepairs(v){
  db.collection("vehicles").doc(v).collection("repairs")
  .onSnapshot(s=>{
    all=[];
    s.forEach(d=>{
      let r=d.data();
      r._id=d.id;
      all.push(r);
    });

    all.sort((a,b)=> new Date(b["วันที่"]) - new Date(a["วันที่"]));
    render(all);
  });
}

function render(list){
  tbody.innerHTML="";
  list.forEach(r=>{
    let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);

    tbody.innerHTML+=`
    <tr>
    <td>${r["วันที่"]||""}</td>
    <td>${vehicleSelect.value}</td>
    <td>${r["ระบบที่ซ่อม"]||""}</td>
    <td>${r["อาการเสีย"]||""}</td>
    <td>${r["ช่างผู้รับผิดชอบ"]||""}</td>
    <td>${cost}</td>
    <td><button onclick='showDetail(${JSON.stringify(r)})'>ดู</button></td>
    <td><button onclick="del('${r._id}')">ลบ</button></td>
    </tr>`;
  });
}

function showDetail(d){
  let html="";
  for(let k in d){
    if(k=="_id") continue;
    html+=`<div class="detail-row"><b>${k}</b><div>${d[k]||"-"}</div></div>`;
  }
  detailContent.innerHTML=html;
  detailModal.style.display="flex";
}

function save(){
  db.collection("vehicles").doc(vehicleSelect.value)
  .collection("repairs").add({
    "วันที่":date.value,
    "เลขไมล์":mileage.value,
    "เลขที่ใบงาน":jobNo.value,
    "ระบบที่ซ่อม":system.value,
    "อาการเสีย":symptoms.value,
    "อะไหล่ที่เปลี่ยน":parts.value,
    "ช่างผู้รับผิดชอบ":technician.value,
    "ผู้อนุมัติ":approver.value,
    "หมายเหตุ":note.value,
    "ค่าอะไหล่":partsCost.value,
    "ค่าแรง":laborCost.value,
    "เวลาบันทึก":new Date()
  });
  closeModal();
}

function del(id){
  db.collection("vehicles").doc(vehicleSelect.value)
  .collection("repairs").doc(id).delete();
}

function deleteAll(){
  let v=vehicleSelect.value;
  if(!confirm("ลบทั้งหมด?")) return;

  db.collection("vehicles").doc(v).collection("repairs")
  .get().then(s=>{
    let batch=db.batch();
    s.forEach(d=>batch.delete(d.ref));
    batch.commit();
  });
}

function search(){
  let q=searchInput.value.toLowerCase().trim();
  let res=all.filter(r=>
    (r["ระบบที่ซ่อม"]||"").toLowerCase().includes(q) ||
    (r["อาการเสีย"]||"").toLowerCase().includes(q) ||
    (r["ช่างผู้รับผิดชอบ"]||"").toLowerCase().includes(q) ||
    (r["เลขที่ใบงาน"]||"").toLowerCase().includes(q)
  );
  render(res);
}

function resetSearch(){
  searchInput.value="";
  render(all);
}

function openModal(){
  if(!vehicleSelect.value) return alert("กรุณาเลือกรถก่อน");
  modal.style.display="flex";
}
function closeModal(){modal.style.display="none"}

loadVehicles();
</script>

</body>
</html>
