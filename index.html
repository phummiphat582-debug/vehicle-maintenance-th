<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Maintenance Mail UI</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  display:flex;
  height:100vh;
}

/* LEFT */
.sidebar{
  width:220px;
  background:#2f353a;
  color:#fff;
  padding:20px;
}
.sidebar h2{
  margin-bottom:20px;
}
.sidebar .vehicle{
  padding:10px;
  cursor:pointer;
  border-radius:6px;
}
.sidebar .vehicle:hover{
  background:#3c434a;
}

/* CENTER */
.center{
  width:400px;
  background:#f5f5f5;
  border-right:1px solid #ddd;
  display:flex;
  flex-direction:column;
}
.center h2{
  margin:0;
  padding:15px;
}
.list{
  flex:1;
  overflow:auto;
}
.item{
  padding:15px;
  border-bottom:1px solid #ddd;
  cursor:pointer;
}
.item:hover{
  background:#fff;
}
.item.active{
  background:#ff8a65;
  color:#fff;
}

/* RIGHT */
.right{
  flex:1;
  padding:20px;
}
.title{
  font-size:20px;
  margin-bottom:10px;
}

/* BUTTON */
button{
  padding:10px;
  border:none;
  background:#44c4e7;
  color:#fff;
  border-radius:6px;
  cursor:pointer;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal-box{
  background:#fff;
  padding:20px;
  width:400px;
}
input,textarea{
  width:100%;
  margin-bottom:10px;
  padding:8px;
}
</style>
</head>

<body>

<!-- LEFT -->
<div class="sidebar">
  <h2>🚗 รถ</h2>
  <button onclick="openModal()">+ เพิ่ม</button>
  <div id="vehicleList"></div>
</div>

<!-- CENTER -->
<div class="center">
  <h2 id="currentVehicle">Inbox</h2>
  <div class="list" id="repairList"></div>
</div>

<!-- RIGHT -->
<div class="right">
  <div class="title" id="title">เลือกรายการ</div>
  <div id="detail"></div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-box">

<h3>เพิ่มรายการซ่อม</h3>

<input type="date" id="date">
<input id="system" placeholder="ระบบ">
<textarea id="symptoms" placeholder="อาการ"></textarea>
<input id="technician" placeholder="ช่าง">
<input id="partsCost" placeholder="ค่าอะไหล่">
<input id="laborCost" placeholder="ค่าแรง">

<button onclick="save()">บันทึก</button>

</div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain:"vehicle-maintenance-64890.firebaseapp.com",
  projectId:"vehicle-maintenance-64890"
});

const db=firebase.firestore();

let selectedVehicle=null;

/* โหลดรถ */
db.collection("vehicles").onSnapshot(s=>{
  vehicleList.innerHTML="";

  s.forEach(d=>{
    let v=d.id;

    vehicleList.innerHTML+=`
    <div class="vehicle" onclick="loadRepair('${v}')">
      🚗 ${v}
    </div>`;
  });
});

/* โหลดรายการ */
function loadRepair(v){
  selectedVehicle=v;
  currentVehicle.innerText=v;

  db.collection("vehicles").doc(v).collection("repairs")
  .onSnapshot(s=>{
    repairList.innerHTML="";

    s.forEach(doc=>{
      let r=doc.data();
      let id=doc.id;

      repairList.innerHTML+=`
      <div class="item" onclick="openDetail('${v}','${id}', this)">
        <b>${r["ระบบที่ซ่อม"]||"-"}</b><br>
        ${r["อาการเสีย"]||""}
      </div>`;
    });
  });
}

/* detail */
function openDetail(v,id,el){
  document.querySelectorAll(".item")
    .forEach(i=>i.classList.remove("active"));
  el.classList.add("active");

  db.collection("vehicles").doc(v).collection("repairs").doc(id)
  .get().then(doc=>{
    let r=doc.data();
    let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);

    title.innerText=r["ระบบที่ซ่อม"];
    detail.innerHTML=`
      📅 ${r["วันที่"]}<br>
      👨‍🔧 ${r["ช่างผู้รับผิดชอบ"]}<br>
      💰 ${cost.toLocaleString()} บาท<br><br>
      ${r["อาการเสีย"]}
    `;
  });
}

/* save */
function save(){
  if(!selectedVehicle) return alert("เลือกคันก่อน");

  db.collection("vehicles").doc(selectedVehicle)
    .collection("repairs")
    .add({
      "วันที่":date.value,
      "ระบบที่ซ่อม":system.value,
      "อาการเสีย":symptoms.value,
      "ช่างผู้รับผิดชอบ":technician.value,
      "ค่าอะไหล่":partsCost.value,
      "ค่าแรง":laborCost.value
    });

  modal.style.display="none";
}

/* modal */
function openModal(){modal.style.display="flex";}
</script>

</body>
</html>
