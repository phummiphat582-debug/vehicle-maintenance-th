<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Soft Control Maintenance</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg:#e6e9ef;
  --light:#ffffff;
  --dark:#c5c8ce;
  --primary:#0ea5a5;
}

body{
  margin:0;
  font-family:Segoe UI;
  background:var(--bg);
  padding:20px;
}

/* card */
.card{
  background:var(--bg);
  border-radius:20px;
  padding:20px;
  box-shadow:8px 8px 16px var(--dark),
             -8px -8px 16px var(--light);
}

/* grid */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

/* vehicle */
.vehicle{
  text-align:center;
  padding:15px;
  border-radius:15px;
  cursor:pointer;
  transition:.2s;
  box-shadow:inset 4px 4px 8px var(--dark),
             inset -4px -4px 8px var(--light);
}
.vehicle:active{
  transform:scale(.95);
}
.vehicle.active{
  background:var(--primary);
  color:#fff;
}

/* panel */
.panel{
  margin-top:10px;
  max-height:0;
  overflow:hidden;
  transition:max-height .35s ease;
}
.panel.open{
  max-height:2000px;
}

/* item */
.item{
  margin-top:10px;
  padding:10px;
  border-radius:12px;
  background:var(--bg);
  box-shadow:inset 4px 4px 8px var(--dark),
             inset -4px -4px 8px var(--light);
  animation:fade .3s;
}
@keyframes fade{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

/* header */
.title{
  font-weight:bold;
  margin-bottom:10px;
}

/* button */
.btn{
  padding:10px;
  border:none;
  border-radius:12px;
  background:var(--primary);
  color:#fff;
  cursor:pointer;
  margin-top:10px;
}
.btn:active{
  transform:scale(.95);
}
</style>
</head>

<body>

<h2>🚗 Maintenance Control</h2>

<div class="grid" id="vehicleContainer"></div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain: "vehicle-maintenance-64890.firebaseapp.com",
  projectId: "vehicle-maintenance-64890",
});

const db = firebase.firestore();

let vehicleData={};

/* โหลดรถ */
db.collection("vehicles").onSnapshot(async s=>{
  vehicleContainer.innerHTML="";

  for(const d of s.docs){
    let name=d.id;

    let snap = await db.collection("vehicles")
      .doc(name).collection("repairs").get();

    let repairs=[];
    snap.forEach(doc=>{
      let r=doc.data();
      r._id=doc.id;
      repairs.push(r);
    });

    vehicleData[name]=repairs;

    vehicleContainer.innerHTML+=`
    <div class="card">
      <div class="vehicle" onclick="toggle('${name}', this)">
        🚗 ${name}
      </div>

      <div class="panel" id="panel-${name}">
        ${renderList(repairs, name)}
      </div>
    </div>`;
  }
});

/* toggle */
function toggle(name, el){
  let panel=document.getElementById("panel-"+name);

  document.querySelectorAll(".panel")
    .forEach(p=>{
      if(p.id !== "panel-"+name){
        p.classList.remove("open");
      }
    });

  panel.classList.toggle("open");

  document.querySelectorAll(".vehicle")
    .forEach(v=>v.classList.remove("active"));

  el.classList.toggle("active");
}

/* render */
function renderList(list, v){
  if(!list.length){
    return `<div class="item">ไม่มีข้อมูล</div>`;
  }

  return list.map(r=>{
    let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);

    return `
    <div class="item">
      📅 ${r["วันที่"]||"-"}<br>
      🔧 ${r["ระบบที่ซ่อม"]||"-"}<br>
      💰 ${cost.toLocaleString()} บาท<br>
      👨‍🔧 ${r["ช่างผู้รับผิดชอบ"]||"-"}<br>
    </div>`;
  }).join("");
}
</script>

</body>
</html>
