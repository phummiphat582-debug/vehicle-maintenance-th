<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>SC Maintenance Pro</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg:#eef2ff;
  --card:#fff;
  --primary:#7c3aed;
}
body{
  margin:0;
  font-family:Inter,Segoe UI;
  background:var(--bg);
}

/* header */
header{
  background:linear-gradient(90deg,#7c3aed,#9333ea);
  color:#fff;
  padding:20px;
  font-size:22px;
}

/* container */
.container{
  padding:25px;
  max-width:1400px;
  margin:auto;
}

/* grid */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

/* card */
.card{
  background:var(--card);
  border-radius:18px;
  padding:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

/* button */
button{
  padding:10px;
  border:none;
  border-radius:10px;
  background:var(--primary);
  color:#fff;
  cursor:pointer;
}
button.danger{background:#ef4444}

/* item */
.item{
  padding:15px;
  border-radius:12px;
  background:#f9fafb;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
}

/* cost */
.cost{
  font-weight:bold;
  color:#7c3aed;
}

/* input */
input,select{
  padding:10px;
  border-radius:10px;
  border:1px solid #ddd;
}
</style>
</head>

<body>

<header>🚗 SC Maintenance (Pro UI)</header>

<div class="container">

<!-- CONTROL -->
<div class="card grid">
  <select id="vehicleSelect"></select>
  <button onclick="openModal()">➕ เพิ่มรายการ</button>
  <input id="searchInput" placeholder="ค้นหา...">
</div>

<!-- DASHBOARD -->
<div class="card">
  💰 ค่าใช้จ่ายรวม: <span id="totalCost">0</span> บาท
</div>

<!-- LIST -->
<div class="card">
  <div id="listView"></div>
</div>

</div>

<!-- modal -->
<div id="modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;">
<div style="background:#fff;padding:20px;border-radius:15px;width:350px">

<h3>เพิ่มรายการ</h3>

<input type="date" id="date">
<input id="system" placeholder="ระบบ">
<input id="technician" placeholder="ช่าง">
<input id="partsCost" placeholder="ค่าอะไหล่">
<input id="laborCost" placeholder="ค่าแรง">

<button onclick="save()">บันทึก</button>

</div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain:"vehicle-maintenance-64890.firebaseapp.com",
  projectId:"vehicle-maintenance-64890"
});

const db=firebase.firestore();

let allRepairs=[];

/* โหลดรถ */
db.collection("vehicles").onSnapshot(s=>{
  vehicleSelect.innerHTML="";
  s.forEach(d=>{
    vehicleSelect.innerHTML+=`<option>${d.id}</option>`;
  });
  load(vehicleSelect.value);
});

vehicleSelect.onchange=()=>load(vehicleSelect.value);

/* โหลดข้อมูล */
function load(v){
  db.collection("vehicles").doc(v).collection("repairs")
  .onSnapshot(s=>{
    allRepairs=[];
    let total=0;

    s.forEach(doc=>{
      let r=doc.data();
      allRepairs.push(r);

      total+=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);
    });

    totalCost.innerText=total.toLocaleString();
    render(allRepairs);
  });
}

/* render */
function render(list){
  listView.innerHTML="";

  list.sort((a,b)=>new Date(b["วันที่"]) - new Date(a["วันที่"]));

  list.forEach(r=>{
    let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);

    listView.innerHTML+=`
    <div class="item">
      <div>
        <b>${r["ระบบที่ซ่อม"]||"-"}</b><br>
        ${r["วันที่"]||"-"} | ${r["ช่างผู้รับผิดชอบ"]||"-"}
      </div>
      <div class="cost">${cost.toLocaleString()} ฿</div>
    </div>`;
  });
}

/* search */
searchInput.oninput=()=>{
  let q=searchInput.value.toLowerCase();
  render(allRepairs.filter(r=>
    (r["ระบบที่ซ่อม"]||"").toLowerCase().includes(q)
  ));
};

/* save */
function save(){
  let v=vehicleSelect.value;

  db.collection("vehicles").doc(v)
    .collection("repairs")
    .add({
      "วันที่":date.value,
      "ระบบที่ซ่อม":system.value,
      "ช่างผู้รับผิดชอบ":technician.value,
      "ค่าอะไหล่":partsCost.value,
      "ค่าแรง":laborCost.value
    });

  modal.style.display="none";
}

/* modal */
function openModal(){modal.style.display="flex";}
</script>

</body>
</html>
