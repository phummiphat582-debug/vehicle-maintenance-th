<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Maintenance Fitness</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#000;
  color:#fff;
}

/* header */
.header{
  padding:20px;
  font-size:28px;
  font-weight:bold;
}

/* ring */
.ring-box{
  background:#111;
  margin:20px;
  padding:20px;
  border-radius:20px;
}

.ring{
  width:140px;
  height:140px;
  border-radius:50%;
  background:conic-gradient(
    #ff375f 0deg var(--move),
    #222 var(--move) 360deg
  );
  display:flex;
  align-items:center;
  justify-content:center;
}

.ring-inner{
  width:90px;
  height:90px;
  background:#000;
  border-radius:50%;
}

/* stats */
.stats{
  display:flex;
  gap:10px;
  padding:0 20px;
}

.card{
  flex:1;
  background:#111;
  padding:15px;
  border-radius:15px;
}

.value{
  font-size:26px;
  color:#0af;
}

/* vehicle */
.vehicle-bar{
  display:flex;
  overflow:auto;
  gap:10px;
  padding:10px 20px;
}

.vehicle{
  padding:8px 14px;
  background:#222;
  border-radius:20px;
  cursor:pointer;
}

.vehicle.active{
  background:#0f0;
  color:#000;
}

/* list */
.list{
  padding:20px;
}

.item{
  background:#111;
  padding:15px;
  border-radius:15px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<div class="header">Summary</div>

<!-- RING -->
<div class="ring-box">
  <div style="display:flex; gap:20px; align-items:center;">
    
    <div class="ring" id="ring" style="--move:120deg">
      <div class="ring-inner"></div>
    </div>

    <div>
      <div>💰 ค่าใช้จ่าย</div>
      <div style="color:#ff375f;font-size:22px;" id="totalCost">0 บาท</div>

      <div>🔧 งานซ่อม</div>
      <div style="color:#0f0;font-size:22px;" id="totalJobs">0 ครั้ง</div>
    </div>

  </div>
</div>

<!-- stats -->
<div class="stats">
  <div class="card">
    วันนี้
    <div class="value" id="todayCost">0</div>
  </div>

  <div class="card">
    เดือนนี้
    <div class="value" id="monthCost">0</div>
  </div>
</div>

<!-- vehicles -->
<div class="vehicle-bar" id="vehicleList"></div>

<!-- list -->
<div class="list" id="log"></div>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain: "vehicle-maintenance-64890.firebaseapp.com",
  projectId: "vehicle-maintenance-64890",
});

const db = firebase.firestore();

let selectedVehicle=null;
let all=[];

/* โหลดรถ */
db.collection("vehicles").onSnapshot(s=>{
  vehicleList.innerHTML="";
  let first=null;

  s.forEach(d=>{
    if(!first) first=d.id;

    let div=document.createElement("div");
    div.className="vehicle";
    div.innerText=d.id;

    div.onclick=()=>{
      document.querySelectorAll(".vehicle")
        .forEach(v=>v.classList.remove("active"));

      div.classList.add("active");
      selectedVehicle=d.id;
      load(d.id);
    };

    vehicleList.appendChild(div);
  });

  if(first) vehicleList.children[0].click();
});

/* โหลดข้อมูล */
function load(v){
  db.collection("vehicles").doc(v).collection("repairs")
  .onSnapshot(s=>{
    all=[];
    s.forEach(doc=>{
      let r=doc.data();
      all.push(r);
    });

    calculate();
    render();
  });
}

/* คำนวณ */
function calculate(){
  let total=0;
  let today=0;
  let month=0;

  let now=new Date();
  let todayStr=now.toISOString().split("T")[0];
  let monthStr=todayStr.slice(0,7);

  all.forEach(r=>{
    let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);
    total+=cost;

    if(r["วันที่"]===todayStr) today+=cost;
    if((r["วันที่"]||"").startsWith(monthStr)) month+=cost;
  });

  totalCost.innerText=total.toLocaleString()+" บาท";
  todayCost.innerText=today.toLocaleString();
  monthCost.innerText=month.toLocaleString();
  totalJobs.innerText=all.length+" ครั้ง";

  // ring
  let percent=Math.min(total/50000,1); // ปรับเป้าได้
  ring.style.setProperty("--move", (percent*360)+"deg");
}

/* render list */
function render(){
  log.innerHTML="";

  all.forEach(r=>{
    let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);

    log.innerHTML+=`
    <div class="item">
      🔧 ${r["ระบบที่ซ่อม"]||"-"}<br>
      💰 ${cost.toLocaleString()} บาท<br>
      📅 ${r["วันที่"]||"-"}
    </div>`;
  });
}
</script>

</body>
</html>
