<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Maintenance System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI}

/* LAYOUT */
.app{
  display:grid;
  grid-template-columns:260px 1fr;
  grid-template-rows:70px 1fr;
  height:100vh;
}

/* TOP */
.topbar{
  grid-column:1 / span 2;
  background:#2f5b89;
  color:#fff;
  display:flex;
  align-items:center;
  padding:0 20px;
  font-weight:600;
}

/* LEFT */
.sidebar{
  background:#243c5a;
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* RIGHT */
.main{
  background:#d1d5db;
  padding:20px;
  overflow:auto;
}

/* BUTTON */
button{
  padding:10px;
  border:none;
  border-radius:6px;
  background:#1e293b;
  color:#fff;
  cursor:pointer;
  transition:.2s;
}
button:hover{transform:scale(1.05)}
button.danger{background:#dc2626}

/* INPUT */
input,select,textarea{
  padding:10px;
  border-radius:6px;
  border:none;
  width:100%;
}

/* TABLE */
.table{
  width:100%;
  background:#fff;
  border-collapse:collapse;
}
th,td{padding:10px}
th{background:#f3f4f6}
td{border-top:1px solid #e5e7eb}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;

  justify-content:center;
  align-items:flex-start;

  padding:40px 10px;
  overflow-y:auto;
}

/* BOX */
.modal-box{
  background:#fff;
  padding:20px;
  border-radius:12px;
  width:90%;
  max-width:800px;

  max-height:85vh;
  overflow-y:auto;

  position:relative;
  margin:auto;
  overflow:visible;
}

/* CLOSE BUTTON */
.close-btn{
  position:absolute;
  top:-12px;
  right:-12px;

  width:42px;
  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#dc2626;
  color:#fff;

  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,.25);
}

/* FORM */
.form-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:10px;
}

#detailContent p{
  margin:6px 0;
}
</style>
</head>

<body>

<div class="app">

<div class="topbar">ระบบซ่อมบำรุงรถยนต์</div>

<aside class="sidebar">
<button onclick="openModal()">+ เพิ่มรายการ</button>
<button onclick="showModal(vehicleModal)">+ เพิ่มรถ</button>
<select id="vehicleSelect"></select>
<button class="danger" onclick="confirmDeleteAll()">ลบรถทั้งหมด</button>
</aside>

<main class="main">

<table class="table">
<thead>
<tr>
<th>วันที่</th>
<th>รถ</th>
<th>ระบบ</th>
<th>อาการ</th>
<th>ช่าง</th>
<th>ดู</th>
<th>ลบ</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

</main>

</div>

<!-- MODALS -->
<div class="modal" id="modal">
<div class="modal-box">
<button class="close-btn" onclick="closeModal()">✕</button>
<h3>บันทึกการซ่อม</h3>
<div class="form-grid">
<input type="date" id="date">
<input id="mileage" placeholder="เลขไมล์">
<input id="jobNo" placeholder="เลขที่ใบงาน">
<input id="system" placeholder="ระบบ">
<input id="technician" placeholder="ช่าง">
<textarea id="symptoms" placeholder="อาการ"></textarea>
<textarea id="parts" placeholder="อะไหล่"></textarea>
<input type="number" id="partsCost" placeholder="ค่าอะไหล่">
<input type="number" id="laborCost" placeholder="ค่าแรง">
</div>
<br>
<button onclick="confirmSave()">บันทึก</button>
<button class="danger" onclick="closeModal()">ยกเลิก</button>
</div>
</div>

<div class="modal" id="vehicleModal">
<div class="modal-box">
<button class="close-btn" onclick="closeModal()">✕</button>
<h3>เพิ่มรถ</h3>
<input id="vehicleName">
<br><br>
<button onclick="confirmAddVehicle()">บันทึก</button>
</div>
</div>

<div class="modal" id="detailModal">
<div class="modal-box">
<button class="close-btn" onclick="closeModal()">✕</button>
<h3>รายละเอียด</h3>
<div id="detailContent"></div>
</div>
</div>

<div class="modal" id="confirmModal">
<div class="modal-box">
<button class="close-btn" onclick="closeModal()">✕</button>
<h3 id="confirmTitle"></h3>
<p id="confirmText"></p>
<button onclick="confirmYes()">ยืนยัน</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"YOUR_API_KEY",
  projectId:"vehicle-maintenance-64890"
});
const db=firebase.firestore();

let confirmAction=null;

/* 🔥 ปิดทั้งหมด */
function closeAllModals(){
  document.querySelectorAll(".modal").forEach(m=>m.style.display="none");
}

/* 🔥 เปิด modal */
function showModal(m){
  if(m.style.display==="flex") return;
  closeAllModals();
  m.style.display="flex";
}

function closeModal(){
  closeAllModals();
}

/* OPEN */
function openModal(){
  showModal(modal);
  date.value=new Date().toISOString().split("T")[0];
}

/* DETAIL */
function openDetail(d){
  showModal(detailModal);

  let cost=(+d["ค่าอะไหล่"]||0)+(+d["ค่าแรง"]||0);

  const fields=[
    ["วันที่","วันที่"],
    ["เลขไมล์","เลขไมล์"],
    ["เลขที่ใบงาน","เลขที่ใบงาน"],
    ["ระบบที่ซ่อม","ระบบที่ซ่อม"],
    ["อาการเสีย","อาการเสีย"],
    ["อะไหล่ที่เปลี่ยน","อะไหล่ที่เปลี่ยน"],
    ["ช่างผู้รับผิดชอบ","ช่างผู้รับผิดชอบ"],
    ["ค่าอะไหล่","ค่าอะไหล่"],
    ["ค่าแรง","ค่าแรง"]
  ];

  let html="";
  fields.forEach(([k,l])=>{
    html+=`<p><b>${l}:</b> ${d[k]||"-"}</p>`;
  });

  html+=`<hr><p><b>รวม:</b> ${cost}</p>`;

  detailContent.innerHTML=html;
}

/* CONFIRM */
function openConfirm(t,txt,fn){
  confirmTitle.textContent=t;
  confirmText.textContent=txt;
  confirmAction=fn;
  showModal(confirmModal);
}
function confirmYes(){
  if(confirmAction)confirmAction();
  closeModal();
}

/* FIREBASE LOGIC (เหมือนเดิมย่อ) */
function confirmAddVehicle(){
  let name=vehicleName.value.trim();
  if(!name) return;

  openConfirm("เพิ่มรถ","ยืนยัน?",()=>{
    db.collection("vehicles").doc(name).set({});
    vehicleName.value="";
  });
}

function confirmSave(){
  openConfirm("บันทึก","ยืนยัน?",()=>{
    let v=vehicleSelect.value;
    db.collection("vehicles").doc(v).collection("repairs").add({
      "วันที่":date.value,
      "timestamp":new Date(date.value).getTime(),
      "เลขไมล์":mileage.value,
      "เลขที่ใบงาน":jobNo.value,
      "ระบบที่ซ่อม":system.value,
      "อาการเสีย":symptoms.value,
      "อะไหล่ที่เปลี่ยน":parts.value,
      "ช่างผู้รับผิดชอบ":technician.value,
      "ค่าอะไหล่":partsCost.value,
      "ค่าแรง":laborCost.value
    });
  });
}
</script>

</body>
</html>
