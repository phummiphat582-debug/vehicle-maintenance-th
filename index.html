<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ระบบซ่อมบำรุง</title>

<style>
:root{
  --red:#991b1b;
  --red2:#b91c1c;
  --bg:#eef2f7;
}

/* RESET */
body{
  margin:0;
  font-family:Segoe UI;
  background:var(--bg);
}

/* SIDEBAR */
.sidebar{
  width:240px;
  height:100vh;
  position:fixed;
  background:linear-gradient(180deg,var(--red),#7f1d1d);
  color:#fff;
  padding:20px;
  box-shadow:5px 0 20px rgba(0,0,0,.15); /* 🔥 layer */
}

/* HEADER */
header{
  margin-left:240px;
  background:linear-gradient(90deg,var(--red),var(--red2));
  color:#fff;
  padding:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.1);
}

/* MAIN */
.main{
  margin-left:240px;
  padding:25px;
}

/* CARD (แยกเลเยอร์ชัด) */
.card{
  background:#fff;
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
  box-shadow:0 15px 35px rgba(0,0,0,.08);
  border:1px solid #e5e7eb;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

/* BUTTON */
button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  background:var(--red2);
  color:#fff;
  cursor:pointer;
  font-weight:500;
}
button:hover{opacity:.9}
.danger{background:#dc2626}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
}
th{
  background:#f9fafb;
}
th,td{
  padding:12px;
  border-bottom:1px solid #eee;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-box{
  background:#fff;
  padding:25px;
  border-radius:16px;
  width:95%;
  max-width:1000px;
  max-height:90vh;
  overflow:auto;
  box-shadow:0 25px 60px rgba(0,0,0,.25);
  animation:pop .2s ease;
}

@keyframes pop{
  from{transform:scale(.9);opacity:0}
  to{transform:scale(1);opacity:1}
}

/* FORM */
.form-grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.form-grid-3{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px;
}

input,textarea{
  padding:10px;
  border-radius:8px;
  border:1px solid #ddd;
  width:100%;
}

textarea{min-height:90px}

/* DETAIL */
.detail-row{
  display:grid;
  grid-template-columns:180px 1fr;
  padding:6px 0;
  border-bottom:1px dashed #ddd;
}
.detail-row b{color:var(--red)}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h3>ระบบซ่อมบำรุง</h3>
  <br>
  <button onclick="openVehicleModal()">เลือกรถ</button>
</div>

<header>ระบบซ่อมบำรุง</header>

<div class="main">

<div class="card">
  <b id="currentVehicle">ยังไม่เลือกรถ</b>
</div>

<div class="card grid">
  <button onclick="openAddModal()">เพิ่มประวัติการซ่อม</button>
  <button class="danger" onclick="deleteAll()">ลบทั้งหมด</button>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>วันที่</th>
<th>ระบบ</th>
<th>ช่าง</th>
<th>ดู</th>
<th>ลบ</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>

<!-- 🔴 เลือกรถ -->
<div class="modal" id="vehicleModal">
<div class="modal-box">
<h3>เลือกรถ</h3>
<div id="vehicleList"></div>
<br>
<button onclick="vehicleModal.style.display='none'">ปิด</button>
</div>
</div>

<!-- 🔴 เพิ่มข้อมูล -->
<div class="modal" id="addModal">
<div class="modal-box">

<h3>เพิ่มประวัติการซ่อม</h3>

<div class="form-grid-3">
<input type="date" id="date">
<input id="mileage" placeholder="เลขไมล์">
<input id="jobNo" placeholder="เลขที่ใบงาน">
</div>

<div class="form-grid-2">
<input id="system" placeholder="ระบบที่ซ่อม">
<input id="technician" placeholder="ช่าง">
</div>

<div class="form-grid-3">
<textarea id="symptoms" placeholder="อาการเสีย"></textarea>
<textarea id="parts" placeholder="อะไหล่"></textarea>
<textarea id="note" placeholder="หมายเหตุ"></textarea>
</div>

<div class="form-grid-2">
<input type="number" id="partsCost" placeholder="ค่าอะไหล่">
<input type="number" id="laborCost" placeholder="ค่าแรง">
</div>

<br>
<button onclick="save()">บันทึก</button>
<button class="danger" onclick="addModal.style.display='none'">ยกเลิก</button>

</div>
</div>

<!-- 🔴 DETAIL -->
<div class="modal" id="detailModal">
<div class="modal-box">
<h3>รายละเอียด</h3>
<div id="detail"></div>
<button onclick="detailModal.style.display='none'">ปิด</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSy...",
  projectId:"vehicle-maintenance-64890"
});
const db=firebase.firestore();

let currentVehicle=null;

/* เลือกรถ */
function openVehicleModal(){
  vehicleModal.style.display="flex";

  db.collection("vehicles").get().then(s=>{
    vehicleList.innerHTML="";
    s.forEach(d=>{
      let div=document.createElement("div");
      div.innerText=d.id;
      div.style.padding="10px";
      div.style.cursor="pointer";

      div.onclick=()=>{
        currentVehicle=d.id;
        currentVehicleEl.innerText=d.id;
        vehicleModal.style.display="none";
        loadData();
      };

      vehicleList.appendChild(div);
    });
  });
}

const currentVehicleEl=document.getElementById("currentVehicle");

/* โหลดข้อมูล */
function loadData(){
  db.collection("vehicles").doc(currentVehicle).collection("repairs")
  .onSnapshot(s=>{
    tbody.innerHTML="";
    s.forEach(doc=>{
      let r=doc.data();

      tbody.innerHTML+=`
      <tr>
        <td>${r["วันที่"]||""}</td>
        <td>${r["ระบบที่ซ่อม"]||""}</td>
        <td>${r["ช่างผู้รับผิดชอบ"]||""}</td>
        <td><button onclick='show(${JSON.stringify(r)})'>ดู</button></td>
        <td><button class="danger" onclick="del('${doc.id}')">ลบ</button></td>
      </tr>`;
    });
  });
}

/* เปิด modal */
function openAddModal(){
  if(!currentVehicle) return alert("กรุณาเลือกรถก่อน");
  addModal.style.display="flex";
}

/* บันทึก */
function save(){
  db.collection("vehicles").doc(currentVehicle)
  .collection("repairs").add({
    "วันที่":date.value,
    "เลขไมล์":mileage.value,
    "เลขที่ใบงาน":jobNo.value,
    "ระบบที่ซ่อม":system.value,
    "อาการเสีย":symptoms.value,
    "อะไหล่ที่เปลี่ยน":parts.value,
    "ช่างผู้รับผิดชอบ":technician.value,
    "หมายเหตุ":note.value,
    "ค่าอะไหล่":partsCost.value,
    "ค่าแรง":laborCost.value
  });

  addModal.style.display="none";
}

/* ลบ */
function del(id){
  db.collection("vehicles").doc(currentVehicle)
  .collection("repairs").doc(id).delete();
}

/* detail */
function show(d){
  let html="";
  for(let k in d){
    html+=`<div class="detail-row"><b>${k}</b><div>${d[k]}</div></div>`;
  }
  detail.innerHTML=html;
  detailModal.style.display="flex";
}
</script>

</body>
</html>
