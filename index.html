<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>SC Maintenance - Simplest UI</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Segoe UI;
}

/* HEADER */
.header{
  background:#4db6c6;
  color:#fff;
  padding:15px;
  display:flex;
  justify-content:space-between;
}

/* LAYOUT */
.app{
  display:flex;
  height:calc(100vh - 60px);
}

/* SIDEBAR */
.sidebar{
  width:220px;
  background:#3a3f44;
  color:#fff;
  padding:20px;
}
.sidebar h2{
  margin-bottom:20px;
}
.sidebar button{
  width:100%;
  padding:10px;
  background:#4db6c6;
  border:none;
  color:#fff;
  margin-bottom:15px;
  cursor:pointer;
}
.vehicle{
  padding:10px;
  cursor:pointer;
}
.vehicle:hover{
  background:#555;
}

/* CENTER */
.center{
  width:400px;
  background:#f3f3f3;
  border-right:1px solid #ddd;
  display:flex;
  flex-direction:column;
}
.center h2{
  margin:0;
  padding:15px;
}
.search{
  padding:10px;
}
.search input{
  width:100%;
  padding:8px;
}
.list{
  flex:1;
  overflow:auto;
}
.item{
  padding:12px;
  border-bottom:1px solid #ddd;
  cursor:pointer;
}
.item:hover{
  background:#fff;
}
.item.active{
  background:#ff8a65;
  color:#fff;
}

/* RIGHT */
.right{
  flex:1;
  padding:20px;
}
.title{
  font-size:20px;
  margin-bottom:10px;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
}
.modal-box{
  background:#fff;
  padding:20px;
  width:400px;
}
input,textarea{
  width:100%;
  margin-bottom:10px;
  padding:8px;
}
button{
  cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
  <div>Simplest</div>
  <div>SC Maintenance</div>
</div>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
  <button onclick="openModal()">+ เพิ่มรายการ</button>
  <div id="vehicleList"></div>
</div>

<!-- CENTER -->
<div class="center">
  <h2 id="currentVehicle">Inbox</h2>

  <div class="search">
    <input id="search" placeholder="ค้นหา...">
  </div>

  <div class="list" id="repairList"></div>
</div>

<!-- RIGHT -->
<div class="right">
  <div class="title" id="title">รายละเอียด</div>
  <div id="detail"></div>
</div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-box">

<h3>เพิ่มรายการซ่อม</h3>

<input type="date" id="date">
<input id="system" placeholder="ระบบ">
<textarea id="symptoms" placeholder="อาการ"></textarea>
<input id="technician" placeholder="ช่าง">
<input id="partsCost" placeholder="ค่าอะไหล่">
<input id="laborCost" placeholder="ค่าแรง">

<button onclick="save()">บันทึก</button>
<button onclick="modal.style.display='none'">ยกเลิก</button>

</div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain:"vehicle-maintenance-64890.firebaseapp.com",
  projectId:"vehicle-maintenance-64890"
});

const db=firebase.firestore();

let selectedVehicle=null;
let allRepairs=[];

/* โหลดรถ */
db.collection("vehicles").onSnapshot(s=>{
  vehicleList.innerHTML="";

  s.forEach(d=>{
    let v=d.id;

    vehicleList.innerHTML+=`
    <div class="vehicle" onclick="loadRepair('${v}')">
      🚗 ${v}
    </div>`;
  });
});

/* โหลดรายการ */
function loadRepair(v){
  selectedVehicle=v;
  currentVehicle.innerText=v;

  db.collection("vehicles").doc(v).collection("repairs")
  .onSnapshot(s=>{
    allRepairs=[];
    repairList.innerHTML="";

    s.forEach(doc=>{
      let r=doc.data();
      r._id=doc.id;
      allRepairs.push(r);
    });

    render(allRepairs);
  });
}

/* render */
function render(list){
  repairList.innerHTML="";

  list.forEach(r=>{
    repairList.innerHTML+=`
    <div class="item" onclick="openDetail('${r._id}', this)">
      <b>${r["ระบบที่ซ่อม"]||"-"}</b><br>
      ${r["อาการเสีย"]||""}
    </div>`;
  });
}

/* detail */
function openDetail(id,el){
  document.querySelectorAll(".item")
    .forEach(i=>i.classList.remove("active"));
  el.classList.add("active");

  let r=allRepairs.find(x=>x._id===id);

  let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);

  title.innerText=r["ระบบที่ซ่อม"];
  detail.innerHTML=`
    📅 ${r["วันที่"]}<br>
    👨‍🔧 ${r["ช่างผู้รับผิดชอบ"]}<br>
    💰 ${cost.toLocaleString()} บาท<br><br>
    ${r["อาการเสีย"]}
  `;
}

/* search */
search.oninput=()=>{
  let q=search.value.toLowerCase();

  render(allRepairs.filter(r=>
    (r["ระบบที่ซ่อม"]||"").toLowerCase().includes(q) ||
    (r["อาการเสีย"]||"").toLowerCase().includes(q)
  ));
};

/* save */
function save(){
  if(!selectedVehicle) return alert("เลือกคันก่อน");

  db.collection("vehicles").doc(selectedVehicle)
    .collection("repairs")
    .add({
      "วันที่":date.value,
      "ระบบที่ซ่อม":system.value,
      "อาการเสีย":symptoms.value,
      "ช่างผู้รับผิดชอบ":technician.value,
      "ค่าอะไหล่":partsCost.value,
      "ค่าแรง":laborCost.value
    });

  modal.style.display="none";
}

/* modal */
function openModal(){modal.style.display="flex";}
</script>

</body>
</html>
