<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ระบบซ่อมบำรุง ERP</title>

<style>
:root{
  --black:#0f172a;
  --gray:#1f2937;
  --bg:#f1f5f9;
}

/* RESET + LAYOUT FIX */
body{
  margin:0;
  display:flex;
  font-family:Segoe UI;
  background:var(--bg);
}

/* SIDEBAR */
.sidebar{
  width:240px;
  height:100vh;
  position:fixed;
  left:0;
  top:0;
  background:linear-gradient(180deg,#000,var(--gray));
  color:#fff;
  padding:20px;
  box-shadow:5px 0 25px rgba(0,0,0,.3);
  z-index:1000;
}

/* CONTENT WRAP */
.content{
  margin-left:240px;
  width:calc(100% - 240px);
}

/* HEADER */
header{
  background:var(--black);
  color:#fff;
  padding:18px;
  position:sticky;
  top:0;
  z-index:500;
}

/* MAIN */
.main{
  padding:25px;
}

/* CARD */
.card{
  background:#fff;
  padding:20px;
  border-radius:14px;
  margin-bottom:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}

/* BUTTON */
button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:var(--black);
  color:#fff;
  cursor:pointer;
}
.danger{background:#dc2626}

/* INPUT */
input,textarea{
  padding:10px;
  border-radius:8px;
  border:1px solid #ddd;
  width:100%;
}
textarea{min-height:80px}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
}
th{
  background:#f9fafb;
}
th,td{
  padding:12px;
  border-bottom:1px solid #eee;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.modal-box{
  background:#fff;
  padding:25px;
  border-radius:16px;
  width:95%;
  max-width:1000px;
  max-height:90vh;
  overflow:auto;
}

/* FORM */
.form-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.form-3{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px;
}

/* VEHICLE */
.vehicle-item{
  padding:12px;
  background:#f3f4f6;
  border-radius:10px;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  cursor:pointer;
}

/* DETAIL */
.detail-row{
  display:grid;
  grid-template-columns:180px 1fr;
  margin-bottom:6px;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h3>ระบบซ่อมบำรุง</h3>
  <br>
  <button onclick="openVehicleModal()">เลือกรถ</button><br><br>
  <button onclick="openAddVehicle()">เพิ่มรถ</button>
</div>

<!-- CONTENT -->
<div class="content">

<header>ระบบซ่อมบำรุง</header>

<div class="main">

<div class="card">
  <b id="currentVehicle">ยังไม่เลือกรถ</b>
</div>

<!-- DASHBOARD -->
<div class="grid">
  <div class="card"><div>จำนวนงาน</div><h2 id="totalJobs">0</h2></div>
  <div class="card"><div>ค่าใช้จ่ายรวม</div><h2 id="totalCost">0</h2></div>
</div>

<!-- CONTROL -->
<div class="card grid">
  <input id="search" placeholder="ค้นหา">
  <button onclick="openAdd()">เพิ่มประวัติ</button>
</div>

<!-- TABLE -->
<div class="card">
<table>
<thead>
<tr>
<th>วันที่</th>
<th>ระบบ</th>
<th>ช่าง</th>
<th>ดู</th>
<th>ลบ</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>
</div>

<!-- VEHICLE MODAL -->
<div class="modal" id="vehicleModal">
<div class="modal-box">
<h3>เลือกรถ</h3>
<div id="vehicleList"></div>
<button onclick="vehicleModal.style.display='none'">ปิด</button>
</div>
</div>

<!-- ADD VEHICLE -->
<div class="modal" id="vehicleAdd">
<div class="modal-box">
<h3>เพิ่มรถ</h3>
<input id="newVehicle">
<br><br>
<button onclick="saveVehicle()">บันทึก</button>
</div>
</div>

<!-- ADD -->
<div class="modal" id="addModal">
<div class="modal-box">

<h3>เพิ่มประวัติ</h3>

<div class="form-3">
<input type="date" id="date">
<input id="mileage" placeholder="เลขไมล์">
<input id="jobNo" placeholder="ใบงาน">
</div>

<div class="form-2">
<input id="system" placeholder="ระบบ">
<input id="technician" placeholder="ช่าง">
</div>

<div class="form-3">
<textarea id="symptoms" placeholder="อาการ"></textarea>
<textarea id="parts" placeholder="อะไหล่"></textarea>
<textarea id="note" placeholder="หมายเหตุ"></textarea>
</div>

<div class="form-2">
<input id="partsCost" placeholder="ค่าอะไหล่">
<input id="laborCost" placeholder="ค่าแรง">
</div>

<br>
<button onclick="save()">บันทึก</button>

</div>
</div>

<!-- DETAIL -->
<div class="modal" id="detailModal">
<div class="modal-box">
<h3>รายละเอียด</h3>
<div id="detail"></div>
<button onclick="detailModal.style.display='none'">ปิด</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSy...",
  projectId:"vehicle-maintenance-64890"
});
const db=firebase.firestore();

let currentVehicle=null;

/* VEHICLE */
function openVehicleModal(){
  vehicleModal.style.display="flex";

  db.collection("vehicles").get().then(s=>{
    vehicleList.innerHTML="";
    s.forEach(d=>{
      let div=document.createElement("div");
      div.className="vehicle-item";

      div.innerHTML=`
        <span>${d.id}</span>
        <button class="danger" onclick="deleteVehicle('${d.id}',event)">ลบ</button>
      `;

      div.onclick=()=>{
        currentVehicle=d.id;
        currentVehicleEl.innerText=d.id;
        vehicleModal.style.display="none";
        load();
      };

      vehicleList.appendChild(div);
    });
  });
}

function saveVehicle(){
  db.collection("vehicles").doc(newVehicle.value).set({});
  vehicleAdd.style.display="none";
}

function deleteVehicle(v,e){
  e.stopPropagation();
  if(!confirm("ลบรถนี้?")) return;

  db.collection("vehicles").doc(v).delete();
  openVehicleModal();
}

/* DATA */
function load(){
  db.collection("vehicles").doc(currentVehicle).collection("repairs")
  .onSnapshot(s=>{
    let data=[];
    s.forEach(d=>data.push({...d.data(),id:d.id}));
    render(data);
  });
}

function render(data){
  tbody.innerHTML="";
  let total=0;

  data.forEach(r=>{
    let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);
    total+=cost;

    tbody.innerHTML+=`
    <tr>
      <td>${r["วันที่"]}</td>
      <td>${r["ระบบที่ซ่อม"]}</td>
      <td>${r["ช่างผู้รับผิดชอบ"]}</td>
      <td><button onclick='show(${JSON.stringify(r)})'>ดู</button></td>
      <td><button class="danger" onclick="del('${r.id}')">ลบ</button></td>
    </tr>`;
  });

  totalJobs.innerText=data.length;
  totalCost.innerText=total;
}

/* ADD */
function openAdd(){
  if(!currentVehicle) return alert("เลือกรถก่อน");
  addModal.style.display="flex";
}

function save(){
  db.collection("vehicles").doc(currentVehicle)
  .collection("repairs").add({
    "วันที่":date.value,
    "ระบบที่ซ่อม":system.value,
    "อาการเสีย":symptoms.value,
    "อะไหล่ที่เปลี่ยน":parts.value,
    "ช่างผู้รับผิดชอบ":technician.value,
    "หมายเหตุ":note.value,
    "ค่าอะไหล่":partsCost.value,
    "ค่าแรง":laborCost.value
  });
  addModal.style.display="none";
}

/* DELETE */
function del(id){
  db.collection("vehicles").doc(currentVehicle)
  .collection("repairs").doc(id).delete();
}

/* DETAIL */
function show(d){
  let html="";
  for(let k in d){
    html+=`<div class="detail-row"><b>${k}</b><div>${d[k]}</div></div>`;
  }
  detail.innerHTML=html;
  detailModal.style.display="flex";
}
</script>

</body>
</html>
