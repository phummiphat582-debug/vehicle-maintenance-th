<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>ระบบซ่อมบำรุง</title>

<style>
:root{
  --black:#111827;
  --gray:#1f2937;
  --bg:#f3f4f6;
}

/* RESET */
body{
  margin:0;
  font-family:Segoe UI;
  background:var(--bg);
}

/* SIDEBAR */
.sidebar{
  width:240px;
  height:100vh;
  position:fixed;
  background:linear-gradient(180deg,#000,#1f2937);
  color:#fff;
  padding:20px;
  box-shadow:5px 0 20px rgba(0,0,0,.2);
}

/* HEADER */
header{
  margin-left:240px;
  background:#111827;
  color:#fff;
  padding:18px;
}

/* MAIN */
.main{
  margin-left:240px;
  padding:25px;
}

/* CARD */
.card{
  background:#fff;
  padding:20px;
  border-radius:14px;
  margin-bottom:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}

/* INPUT */
input,textarea{
  padding:10px;
  border-radius:8px;
  border:1px solid #ddd;
  width:100%;
}
textarea{min-height:80px}

/* BUTTON */
button{
  padding:10px 14px;
  border:none;
  border-radius:8px;
  background:#111827;
  color:#fff;
  cursor:pointer;
}
button:hover{opacity:.9}
.danger{background:#dc2626}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
}
th{
  background:#f9fafb;
}
th,td{
  padding:12px;
  border-bottom:1px solid #eee;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-box{
  background:#fff;
  padding:25px;
  border-radius:16px;
  width:95%;
  max-width:1000px;
  max-height:90vh;
  overflow:auto;
}

/* FORM */
.form-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.form-3{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px;
}

/* DETAIL */
.detail-row{
  display:grid;
  grid-template-columns:180px 1fr;
  margin-bottom:6px;
}
.detail-row b{color:#111827}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h3>ระบบซ่อมบำรุง</h3>
  <br>
  <button onclick="openVehicleModal()">เลือกรถ</button><br><br>
  <button onclick="openAddVehicle()">เพิ่มรถ</button>
</div>

<header>ระบบซ่อมบำรุง</header>

<div class="main">

<div class="card">
  <b id="currentVehicle">ยังไม่เลือกรถ</b>
</div>

<div class="card grid">
  <input id="search" placeholder="ค้นหาประวัติ">
  <button onclick="openAdd()">เพิ่มประวัติ</button>
</div>

<div class="card">
<table>
<thead>
<tr>
<th>วันที่</th>
<th>ระบบ</th>
<th>ช่าง</th>
<th>ดู</th>
<th>ลบ</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

</div>

<!-- เลือกรถ -->
<div class="modal" id="vehicleModal">
<div class="modal-box">
<h3>เลือกรถ</h3>
<div id="vehicleList"></div>
<button onclick="vehicleModal.style.display='none'">ปิด</button>
</div>
</div>

<!-- เพิ่มรถ -->
<div class="modal" id="vehicleAdd">
<div class="modal-box">
<h3>เพิ่มรถ</h3>
<input id="newVehicle" placeholder="ชื่อรถ">
<br><br>
<button onclick="saveVehicle()">บันทึก</button>
</div>
</div>

<!-- เพิ่มประวัติ -->
<div class="modal" id="addModal">
<div class="modal-box">

<h3>เพิ่มประวัติ</h3>

<div class="form-3">
<input type="date" id="date">
<input id="mileage" placeholder="เลขไมล์">
<input id="jobNo" placeholder="ใบงาน">
</div>

<div class="form-2">
<input id="system" placeholder="ระบบ">
<input id="technician" placeholder="ช่าง">
</div>

<div class="form-3">
<textarea id="symptoms" placeholder="อาการ"></textarea>
<textarea id="parts" placeholder="อะไหล่"></textarea>
<textarea id="note" placeholder="หมายเหตุ"></textarea>
</div>

<div class="form-2">
<input id="partsCost" placeholder="ค่าอะไหล่">
<input id="laborCost" placeholder="ค่าแรง">
</div>

<br>
<button onclick="save()">บันทึก</button>
</div>
</div>

<!-- DETAIL -->
<div class="modal" id="detailModal">
<div class="modal-box">
<h3>รายละเอียด</h3>
<div id="detail"></div>
<button onclick="detailModal.style.display='none'">ปิด</button>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey:"AIzaSy...",
  projectId:"vehicle-maintenance-64890"
});
const db=firebase.firestore();

let currentVehicle=null;

/* เลือกรถ */
function openVehicleModal(){
  vehicleModal.style.display="flex";
  db.collection("vehicles").get().then(s=>{
    vehicleList.innerHTML="";
    s.forEach(d=>{
      let div=document.createElement("div");
      div.innerText=d.id;
      div.style.padding="10px";
      div.style.cursor="pointer";
      div.onclick=()=>{
        currentVehicle=d.id;
        currentVehicleEl.innerText=d.id;
        vehicleModal.style.display="none";
        load();
      };
      vehicleList.appendChild(div);
    });
  });
}

/* เพิ่มรถ */
function openAddVehicle(){vehicleAdd.style.display="flex"}
function saveVehicle(){
  db.collection("vehicles").doc(newVehicle.value).set({});
  vehicleAdd.style.display="none";
}

/* โหลดข้อมูล */
function load(){
  db.collection("vehicles").doc(currentVehicle).collection("repairs")
  .onSnapshot(s=>{
    let all=[];
    s.forEach(d=>all.push({...d.data(),id:d.id}));

    render(all);
  });
}

/* render + search */
function render(data){
  tbody.innerHTML="";
  let q=search.value?.toLowerCase()||"";

  data.filter(r=>
    (r["ระบบที่ซ่อม"]||"").toLowerCase().includes(q) ||
    (r["อาการเสีย"]||"").toLowerCase().includes(q)
  ).forEach(r=>{
    tbody.innerHTML+=`
    <tr>
      <td>${r["วันที่"]||""}</td>
      <td>${r["ระบบที่ซ่อม"]||""}</td>
      <td>${r["ช่างผู้รับผิดชอบ"]||""}</td>
      <td><button onclick='show(${JSON.stringify(r)})'>ดู</button></td>
      <td><button class="danger" onclick="del('${r.id}')">ลบ</button></td>
    </tr>`;
  });
}

/* เพิ่ม */
function openAdd(){
  if(!currentVehicle) return alert("เลือกรถก่อน");
  addModal.style.display="flex";
}

function save(){
  db.collection("vehicles").doc(currentVehicle)
  .collection("repairs").add({
    "วันที่":date.value,
    "เลขไมล์":mileage.value,
    "เลขที่ใบงาน":jobNo.value,
    "ระบบที่ซ่อม":system.value,
    "อาการเสีย":symptoms.value,
    "อะไหล่ที่เปลี่ยน":parts.value,
    "ช่างผู้รับผิดชอบ":technician.value,
    "หมายเหตุ":note.value,
    "ค่าอะไหล่":partsCost.value,
    "ค่าแรง":laborCost.value
  });
  addModal.style.display="none";
}

/* ลบ */
function del(id){
  db.collection("vehicles").doc(currentVehicle)
  .collection("repairs").doc(id).delete();
}

/* detail */
function show(d){
  let html="";
  for(let k in d){
    html+=`<div class="detail-row"><b>${k}</b><div>${d[k]}</div></div>`;
  }
  detail.innerHTML=html;
  detailModal.style.display="flex";
}
</script>

</body>
</html>
