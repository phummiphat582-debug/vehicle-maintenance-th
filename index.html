<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>SC Maintenance Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Inter;
  background:#eef2ff;
}

/* layout */
.app{
  display:flex;
  height:100vh;
}

/* sidebar */
.sidebar{
  width:80px;
  background:linear-gradient(180deg,#7c3aed,#9333ea);
  color:#fff;
  padding:20px 10px;
}
.sidebar div{
  margin-bottom:20px;
  text-align:center;
  cursor:pointer;
}

/* main */
.main{
  flex:1;
  padding:20px;
}

/* header */
.header{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}

/* grid */
.grid{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:20px;
}

/* card */
.card{
  background:#fff;
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
}

/* welcome */
.welcome{
  background:linear-gradient(135deg,#fbbf24,#f59e0b);
  color:#000;
}

/* vehicles */
.vehicle{
  padding:10px;
  border-radius:10px;
  background:#f1f5f9;
  margin-bottom:10px;
  cursor:pointer;
}
.vehicle:hover{
  background:#e2e8f0;
}

/* repair */
.item{
  padding:10px;
  border-bottom:1px solid #eee;
}

/* stat */
.stat{
  font-size:22px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="app">

<!-- sidebar -->
<div class="sidebar">
  🚗
  📊
  ⚙️
</div>

<!-- main -->
<div class="main">

<div class="header">
  <h2>Dashboard</h2>
</div>

<div class="grid">

<!-- LEFT -->
<div>

<div class="card welcome">
  <h3>SC Maintenance</h3>
  <p>ระบบจัดการรถและซ่อมบำรุง</p>
</div>

<div class="card">
  <h3>📊 ค่าใช้จ่ายรวม</h3>
  <div class="stat" id="totalCost">0</div>
</div>

<div class="card">
  <h3>📋 รายการซ่อม</h3>
  <div id="repairList"></div>
</div>

</div>

<!-- RIGHT -->
<div>

<div class="card">
  <h3>🚗 รถทั้งหมด</h3>
  <div id="vehicleList"></div>
</div>

</div>

</div>

</div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCowDEvUQpBmq7AwUGiC6IuGOudPhi_0kM",
  authDomain:"vehicle-maintenance-64890.firebaseapp.com",
  projectId:"vehicle-maintenance-64890"
});

const db=firebase.firestore();

let selectedVehicle=null;

/* โหลดรถ */
db.collection("vehicles").onSnapshot(s=>{
  vehicleList.innerHTML="";

  s.forEach(d=>{
    let v=d.id;

    vehicleList.innerHTML+=`
    <div class="vehicle" onclick="load('${v}')">
      🚗 ${v}
    </div>`;
  });
});

/* โหลดข้อมูล */
function load(v){
  selectedVehicle=v;

  db.collection("vehicles").doc(v).collection("repairs")
  .onSnapshot(s=>{
    let total=0;
    repairList.innerHTML="";

    s.forEach(doc=>{
      let r=doc.data();
      let cost=(+r["ค่าอะไหล่"]||0)+(+r["ค่าแรง"]||0);
      total+=cost;

      repairList.innerHTML+=`
      <div class="item">
        ${r["วันที่"]} | ${r["ระบบที่ซ่อม"]} | ${cost}฿
      </div>`;
    });

    totalCost.innerText=total.toLocaleString();
  });
}
</script>

</body>
</html>
